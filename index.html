</style></head><body><div class="app"><aside class="side" id="side"><div class="brand"><b>Pre-IELTS Notes</b><small>Đã học đến Lesson 15</small></div><label class="search">⌕ <input id="search" placeholder="Tìm: modal, past, trip..."></label><nav class="nav" id="nav"><button class="active" data-page="stage">Current Stage</button><button data-page="course">Course Map</button><button data-page="grammar">Grammar Notes</button><button data-page="speaking">Speaking Notes</button><button data-page="pronunciation">Pronunciation Notes</button><button data-page="review">Review Up To L15</button></nav><div class="toc" id="toc"><b>Mục lục</b></div><div class="side-actions"><button class="mini mobile" id="closeMenu">Đóng</button></div></aside><main><header class="top"><div><div class="eyebrow">Current stage · up to Lesson 15</div><h1 id="title"></h1><p class="sub" id="subtitle"></p></div><button class="mini mobile" id="menu">Mục lục</button></header><div class="page" id="content"></div></main></div><script>const DOCS=[{"id":"foundation","type":"grammar","title":"01. Grammar Foundation","file":"source/01-Grammar-Foundation.md","markdown":"---\ntitle: Grammar Foundation\nvi: Nền tảng ngữ pháp trước khi học thì\nskill: Grammar\nlessons: Lesson 6-11\npriority: High\n---\n\n# 01. Grammar Foundation - Nền Tảng Ngữ Pháp\n\nFile này gom các chủ điểm nền tảng trước khi học nhóm thì: danh từ, lượng từ, đại từ, tính từ, mạo từ/từ hạn định và giới từ.\n\n## 01. Danh Từ - Nouns\n\n### Mục tiêu\n\n- Phân biệt common nouns và proper nouns.\n- Nhận diện singular/plural nouns.\n- Phân biệt countable và uncountable nouns.\n- Ghi nhớ một số danh từ số nhiều bất quy tắc.\n\n### Quy tắc chính\n\n| Trường hợp | Quy tắc | Ví dụ |\n|---|---|---|\n| Danh từ số ít đếm được | Cần `a/an/the` hoặc determiner | a doctor, my sister |\n| Thêm `-s` | Dạng số nhiều thông thường | book -> books |\n| Thêm `-es` | Sau s, x, ch, sh... | bus -> buses, watch -> watches |\n| Phụ âm + y | Đổi `y` thành `ies` | baby -> babies |\n| f/fe | Thường đổi thành `ves` | wife -> wives, leaf -> leaves |\n| Bất quy tắc | Học riêng | person -> people, child -> children, foot -> feet |\n\n### Bẫy thường gặp\n\n- `foots` sai -> `feet` đúng.\n- `peoples` sai -> `people` đúng.\n- `an information` sai -> `some information` đúng.\n\n## 02. Countable / Uncountable Nouns Và Quantifiers\n\n### Mục tiêu\n\n- Biết danh từ nào đếm được/không đếm được.\n- Chọn đúng `some`, `any`, `a few`, `a little`, `many`, `much`, `a lot of`.\n\n### Bảng chọn nhanh\n\n| Từ | Dùng với | Cách dùng |\n|---|---|---|\n| some | Danh từ số nhiều hoặc không đếm được | Câu khẳng định; lời mời |\n| any | Danh từ số nhiều hoặc không đếm được | Câu hỏi; phủ định |\n| a few | Danh từ đếm được số nhiều | Một vài, nghĩa tích cực |\n| a little | Danh từ không đếm được | Một ít, nghĩa tích cực |\n| many | Danh từ đếm được số nhiều | Câu hỏi/phủ định |\n| much | Danh từ không đếm được | Câu hỏi/phủ định |\n| a lot of | Cả hai loại | Câu khẳng định |\n\n### Ví dụ\n\n- There are not any chairs in the room.\n- There is a little money.\n- She has a lot of work.\n\n### Bẫy thường gặp\n\n- `much chairs` sai -> `many chairs` đúng.\n- `many money` sai -> `much money` đúng.\n\n## 03. Đại Từ - Pronouns\n\n### Mục tiêu\n\n- Dùng đúng subject pronouns, object pronouns và reflexive pronouns.\n- Nhận diện demonstrative pronouns và interrogative pronouns.\n\n### Bảng đại từ cần nhớ\n\n| Subject | Object | Reflexive |\n|---|---|---|\n| I | me | myself |\n| you | you | yourself |\n| he | him | himself |\n| she | her | herself |\n| it | it | itself |\n| we | us | ourselves |\n| they | them | themselves |\n\n### Cách quyết định\n\n- Đứng trước động từ và làm chủ ngữ -> subject pronoun.\n- Đứng sau động từ/giới từ và nhận hành động -> object pronoun.\n- Chủ ngữ và tân ngữ cùng người, hoặc có `by` với nghĩa tự mình -> reflexive pronoun.\n\n### Ví dụ\n\n- Everybody likes her.\n- I might buy it.\n- I can decorate the room by myself.\n\n## 04. Tính Từ - Adjectives\n\n### Mục tiêu\n\n- Biết vị trí của tính từ.\n- Phân biệt `-ing` và `-ed` adjectives.\n- Dùng đúng tính từ sau sensory verbs.\n- Nắm thứ tự tính từ khi có nhiều tính từ trước danh từ.\n\n### Quy tắc chính\n\n| Vị trí | Ví dụ |\n|---|---|\n| Trước danh từ | a friendly person |\n| Sau `to be` | She is kind. |\n| Sau động từ giác quan | This soup tastes good. |\n| `-ing adjective` | an interesting lesson |\n| `-ed adjective` | I am interested. |\n\n### Thứ tự tính từ\n\nOpinion -> Size -> Age -> Shape -> Color -> Origin -> Material -> Purpose\n\nVí dụ: `long straight black hair`.\n\n### Bẫy thường gặp\n\n- `tastes freshly` sai -> `tastes fresh` đúng.\n- `The lesson was interested` sai -> `The lesson was interesting` đúng.\n\n## 05. Articles Và Determiners\n\n### Mục tiêu\n\n- Dùng đúng `a`, `an`, `the`.\n- Biết khi nào không dùng mạo từ.\n- Dùng đúng possessive determiners và demonstrative determiners.\n\n### Cách quyết định nhanh\n\n| Trường hợp | Cách dùng | Ví dụ |\n|---|---|---|\n| Danh từ số ít đếm được, chưa xác định | `a/an` | a picture, an elephant |\n| Đã xác định/duy nhất/đã nhắc | `the` | the only zoo, the trip |\n| Nói chung với danh từ số nhiều/không đếm được | không dùng article | lions, water |\n| `next + time` | không dùng article | next weekend |\n\n### Bẫy thường gặp\n\n- Chọn `a/an` theo âm đầu, không chỉ theo chữ cái.\n- Không dùng `the` cho danh từ số nhiều khi nói chung.\n\n## 06. Giới Từ - Prepositions\n\n### Mục tiêu\n\n- Dùng giới từ chỉ vị trí, địa điểm và thời gian.\n- Phân biệt `in`, `on`, `at`.\n\n### Bảng dùng nhanh\n\n| Giới từ | Cách dùng | Ví dụ |\n|---|---|---|\n| in | tháng, năm, mùa; thành phố, quốc gia, phòng | in Hanoi, in the morning |\n| on | ngày, ngày tháng, bề mặt | on Monday, on the wall |\n| at | giờ, địa chỉ, điểm cụ thể | at 7 o'clock, at school |\n| next to | bên cạnh | next to the bed |\n| between | ở giữa hai vật/người | between the bed and the wardrobe |\n\n### Bẫy thường gặp\n\n- `in Monday` sai -> `on Monday` đúng.\n- `on 7 o'clock` sai -> `at 7 o'clock` đúng.\n- `at Hanoi` sai -> `in Hanoi` đúng.\n\n## 07. Mini Practice Tổng Hợp\n\n1. Chọn đúng: There are not `some/any` chairs in the room.\n2. Sửa lỗi: Everybody likes she.\n3. Sửa lỗi: This soup tastes well.\n4. Chọn đúng: We visited `a/an/the` only zoo in the city.\n5. Chọn đúng: I study English `in/on/at` Monday evening.\n"},{"id":"present","type":"grammar","title":"02. Present Tenses","file":"source/02-Grammar-Present-Tenses.md","markdown":"---\ntitle: Present Tenses\nvi: Nhóm thì hiện tại\nskill: Grammar\nlesson: Lesson 12\npriority: High\n---\n\n# 02. Grammar - Nhóm Thì Hiện Tại\n\nFile này gom 2 thì hiện tại đã học: Present Simple và Present Continuous.\n\n## 01. Present Simple - Hiện Tại Đơn\n\n### Khi nào dùng?\n\n- Sự thật hiển nhiên hoặc thông tin ổn định.\n- Thói quen, lịch sinh hoạt.\n- Lịch cố định, thời gian biểu.\n\n### Công thức\n\n| Dạng câu | Công thức | Ví dụ |\n|---|---|---|\n| Khẳng định | `S + V(s/es)` | She works every day. |\n| Phủ định | `S + do/does not + V1` | He does not work on Sunday. |\n| Nghi vấn | `Do/Does + S + V1?` | Does she work here? |\n\n### Dấu hiệu thường gặp\n\n- always, usually, often, sometimes, rarely, never\n- every day/week/month/year\n- on Mondays, at weekends\n\n### Bẫy thường gặp\n\n- `He work` sai -> `He works` đúng.\n- `Does she works?` sai -> `Does she work?` đúng.\n\n## 02. Present Continuous - Hiện Tại Tiếp Diễn\n\n### Khi nào dùng?\n\n- Hành động đang diễn ra tại thời điểm nói.\n- Tình huống tạm thời.\n- Kế hoạch đã sắp xếp trong tương lai gần.\n- Thói quen gây khó chịu với `always`.\n\n### Công thức\n\n| Dạng câu | Công thức | Ví dụ |\n|---|---|---|\n| Khẳng định | `S + am/is/are + V-ing` | I am studying now. |\n| Phủ định | `S + am/is/are not + V-ing` | She is not watching TV. |\n| Nghi vấn | `Am/Is/Are + S + V-ing?` | Are they playing football? |\n\n### Dấu hiệu thường gặp\n\n- now\n- right now\n- at the moment\n- today / this week với nghĩa tạm thời\n- always với thói quen gây khó chịu\n\n### Ví dụ từ bài học\n\n- My parents are making dinner right now.\n- She is always losing her keys.\n- What time does the movie begin?\n- The bus is leaving.\n\n## 03. Phân Biệt Nhanh\n\n| Present Simple | Present Continuous |\n|---|---|\n| Thói quen, sự thật, lịch cố định | Đang diễn ra, tạm thời, kế hoạch đã sắp xếp |\n| I go to school every day. | I am going to school now. |\n| The movie begins at 7 p.m. | I am meeting my teacher at 7 p.m. |\n\n## 04. Quy Trình Quyết Định\n\n1. Có `now/right now/at the moment` không? -> Present Continuous.\n2. Là thói quen/sự thật/lịch cố định không? -> Present Simple.\n3. Có `always` và mang nghĩa phàn nàn không? -> Present Continuous.\n4. Là kế hoạch đã sắp xếp gần chưa? -> Present Continuous.\n\n## 05. Mini Practice\n\nChia động từ trong ngoặc.\n\n1. She usually ________ (go) to school by bus.\n2. My parents ________ (make) dinner right now.\n3. What time ________ the movie ________ (begin)?\n4. He ________ always ________ (lose) his keys.\n"},{"id":"past","type":"grammar","title":"03. Past Tenses","file":"source/03-Grammar-Past-Tenses.md","markdown":"---\ntitle: Past Tenses\nvi: Nhóm thì quá khứ và động từ bất quy tắc\nskill: Grammar\nlesson: Lesson 13\npriority: High\nsources:\n  - G-PAST SIMPLE & PAST CONTINUOUS.txt\n  - Bất quy tắc căn bản.txt\n---\n\n# 03. Grammar - Nhóm Thì Quá Khứ\n\nFile này là bản gộp đầy đủ của nội dung cũ về Past Simple, Past Continuous, cách thêm/đọc `-ed` và bảng động từ bất quy tắc căn bản. Nội dung được sắp xếp lại để dễ ôn theo Lesson 13, không phải bản tóm tắt thay thế.\n\n## 01. Past Simple - Quá Khứ Đơn\n\n### 01.1. Mục đích\n\n1. Diễn tả hành động đã hoàn thành trong quá khứ.\n\nVí dụ:\n\n- I visited Da Nang last year.\n- She cooked dinner yesterday.\n\n2. Diễn tả chuỗi hành động trong quá khứ.\n\nVí dụ:\n\n- I got up, brushed my teeth, had breakfast and went to work.\n\n3. Diễn tả thói quen trong quá khứ.\n\nVí dụ:\n\n- When I was young, I played football every weekend.\n\n### 01.2. Dấu hiệu nhận biết\n\n- yesterday\n- last night\n- last week\n- last month\n- last year\n- ago\n- in + năm\n- when I was young\n\n### 01.3. Công thức\n\n#### To be\n\n| Dạng câu | Công thức |\n|---|---|\n| Khẳng định | `S + was/were + N/Adj` |\n| Phủ định | `S + was/were not + N/Adj` |\n| Nghi vấn | `Was/Were + S + N/Adj?` |\n\n#### Verb\n\n| Dạng câu | Công thức |\n|---|---|\n| Khẳng định | `S + V2/ed + O` |\n| Phủ định | `S + did not + V1 + O` |\n| Nghi vấn | `Did + S + V1 + O?` |\n\nLưu ý:\n\n- Sau `did/didn't`, động từ chính luôn dùng động từ nguyên mẫu V1.\n- `Did you went...?` sai -> `Did you go...?` đúng.\n- `I didn't went` sai -> `I didn't go` đúng.\n\n## 02. Quy Tắc Thêm `-ed`\n\n### 02.1. Động từ kết thúc bằng `e`\n\nThêm `d`.\n\nVí dụ:\n\n- like -> liked\n- live -> lived\n- dance -> danced\n\n### 02.2. Động từ kết thúc bằng phụ âm + `y`\n\nĐổi `y` thành `ied`.\n\nVí dụ:\n\n- study -> studied\n- carry -> carried\n- cry -> cried\n\n### 02.3. Động từ kết thúc bằng 1 nguyên âm + 1 phụ âm\n\nThường gấp đôi phụ âm rồi thêm `ed`.\n\nVí dụ:\n\n- stop -> stopped\n- plan -> planned\n- hop -> hopped\n\n### 02.4. Các trường hợp còn lại\n\nThêm `ed`.\n\nVí dụ:\n\n- wash -> washed\n- play -> played\n- work -> worked\n- finish -> finished\n\n## 03. Cách Phát Âm Đuôi `-ed`\n\n### 03.1. Đọc `/t/`\n\nKhi động từ kết thúc bằng âm vô thanh, trừ `/t/`.\n\nÂm vô thanh:\n\n- /p/\n- /k/\n- /f/\n- /s/\n- /ʃ/ - sh\n- /tʃ/ - ch\n- /θ/ - th\n\nVí dụ:\n\n- stopped\n- danced\n- walked\n- washed\n- watched\n- laughed\n\n### 03.2. Đọc `/d/`\n\nKhi động từ kết thúc bằng âm hữu thanh, trừ `/d/`.\n\nBao gồm:\n\n- Tất cả nguyên âm\n- /b/, /g/, /v/, /z/, /ʒ/, /dʒ/, /m/, /n/, /ŋ/, /l/, /r/\n\nVí dụ:\n\n- played\n- listened\n- phoned\n- lived\n- cried\n- planned\n\n### 03.3. Đọc `/ɪd/`\n\nChỉ khi động từ kết thúc bằng âm `/t/` hoặc `/d/`.\n\nVí dụ:\n\n- wanted\n- visited\n- needed\n- decided\n- started\n\n### 03.4. Mẹo nhớ\n\n- Âm vô thanh -> `/t/`.\n- Âm hữu thanh -> `/d/`.\n- Kết thúc bằng `/t/` hoặc `/d/` -> `/ɪd/`.\n\nLưu ý: xác định theo âm cuối khi phát âm, không phải chữ cái cuối khi viết.\n\nVí dụ:\n\n- liked -> /laɪkt/, âm cuối là /k/ nên đọc /t/.\n\n## 04. Past Continuous - Quá Khứ Tiếp Diễn\n\n### 04.1. Mục đích\n\n1. Diễn tả hành động đang diễn ra tại một thời điểm trong quá khứ.\n\nVí dụ:\n\n- I was studying at 8 p.m.\n- She was cooking.\n\n2. Diễn tả một hành động đang diễn ra thì hành động khác xen vào.\n\nVí dụ:\n\n- I was sleeping when my mother called.\n- She was cooking when I came home.\n\nCấu trúc cần nhớ:\n\n- `Past Continuous + when + Past Simple`\n\n3. Diễn tả hai hành động đang diễn ra cùng lúc.\n\nVí dụ:\n\n- I was studying while my sister was watching TV.\n\nCấu trúc cần nhớ:\n\n- `Past Continuous + while + Past Continuous`\n\n### 04.2. Dấu hiệu nhận biết\n\n- at that time\n- at that moment\n- at one o'clock\n- at two o'clock\n- when\n- while\n\n### 04.3. Công thức\n\n| Dạng câu | Công thức |\n|---|---|\n| Khẳng định | `S + was/were + V-ing` |\n| Phủ định | `S + was/were not + V-ing` |\n| Nghi vấn | `Was/Were + S + V-ing?` |\n\n## 05. Phân Biệt Nhanh\n\n| Past Simple | Past Continuous |\n|---|---|\n| Hành động đã hoàn thành | Hành động đang diễn ra tại một thời điểm trong quá khứ |\n| Chuỗi hành động | Một hành động đang diễn ra thì hành động khác xen vào |\n| Thói quen trong quá khứ | Hai hành động cùng diễn ra |\n| Dùng V2/ed | Dùng `was/were + V-ing` |\n| Dấu hiệu: yesterday, last..., ago | Dấu hiệu: at that time, at that moment, when, while |\n\n## 06. Động Từ Bất Quy Tắc Căn Bản\n\n### 06.1. Bảng V1 - V2\n\n| V1 | V2 | Nghĩa |\n|---|---|---|\n| be | was/were | là, thì, ở |\n| become | became | trở thành |\n| begin | began | bắt đầu |\n| break | broke | làm vỡ |\n| bring | brought | mang đến |\n| build | built | xây dựng |\n| buy | bought | mua |\n| catch | caught | bắt |\n| choose | chose | chọn |\n| come | came | đến |\n| cost | cost | có giá |\n| cut | cut | cắt |\n| do | did | làm |\n| draw | drew | vẽ |\n| dream | dreamt / dreamed | mơ |\n| drink | drank | uống |\n| drive | drove | lái xe |\n| eat | ate | ăn |\n| fall | fell | ngã, rơi |\n| feel | felt | cảm thấy |\n| find | found | tìm thấy |\n| fly | flew | bay |\n| forget | forgot | quên |\n| get | got | nhận, lấy |\n| give | gave | cho |\n| go | went | đi |\n| hang | hung | treo |\n| have | had | có |\n| hear | heard | nghe |\n| keep | kept | giữ |\n| know | knew | biết |\n| leave | left | rời đi |\n| lose | lost | mất |\n| make | made | làm, tạo ra |\n| mean | meant | có nghĩa, định |\n| meet | met | gặp |\n| pay | paid | trả tiền |\n| put | put | đặt |\n| read | read (/riːd/ -> /red/) | đọc |\n| ride | rode | cưỡi, đi xe |\n| run | ran | chạy |\n| say | said | nói |\n| see | saw | nhìn thấy |\n| sell | sold | bán |\n| send | sent | gửi |\n| sing | sang | hát |\n| sit | sat | ngồi |\n| sleep | slept | ngủ |\n| speak | spoke | nói |\n| spend | spent | dành, tiêu |\n| stand | stood | đứng |\n| swim | swam | bơi |\n| take | took | lấy |\n| tell | told | kể, bảo |\n| think | thought | nghĩ |\n| understand | understood | hiểu |\n| wake | woke | thức dậy |\n| wear | wore | mặc |\n| win | won | thắng |\n| write | wrote | viết |\n\n### 06.2. Những động từ cần nhớ nhất cho Speaking\n\n- be -> was/were\n- go -> went\n- have -> had\n- do -> did\n- come -> came\n- get -> got\n- make -> made\n- take -> took\n- see -> saw\n- eat -> ate\n- drink -> drank\n- buy -> bought\n- meet -> met\n- spend -> spent\n- leave -> left\n- find -> found\n- feel -> felt\n- tell -> told\n- say -> said\n- think -> thought\n- build -> built\n- stand -> stood\n- sit -> sat\n- swim -> swam\n- win -> won\n- ride -> rode\n- read -> read\n- dream -> dreamt / dreamed\n- mean -> meant\n- hang -> hung\n\n### 06.3. Mẹo học theo nhóm\n\n#### Nhóm giữ nguyên\n\n- cut -> cut\n- put -> put\n- cost -> cost\n- read -> read, nhưng phát âm quá khứ là /red/\n\n#### Nhóm `-ought / -aught`\n\n- buy -> bought\n- bring -> brought\n- catch -> caught\n- think -> thought\n\n#### Nhóm `-ent`\n\n- mean -> meant\n- send -> sent\n- spend -> spent\n\n#### Nhóm `-eft / -ept`\n\n- leave -> left\n- keep -> kept\n- feel -> felt\n- sleep -> slept\n\n#### Nhóm `-uilt`\n\n- build -> built\n\n#### Nhóm `-ood`\n\n- stand -> stood\n\n#### Nhóm đổi nguyên âm\n\n- sit -> sat\n- drink -> drank\n- swim -> swam\n- ride -> rode\n- drive -> drove\n- sing -> sang\n- begin -> began\n- speak -> spoke\n- write -> wrote\n- take -> took\n- give -> gave\n- eat -> ate\n- fall -> fell\n- fly -> flew\n- know -> knew\n- wake -> woke\n- wear -> wore\n- win -> won\n\n#### Nhóm đặc biệt\n\n- go -> went\n- do -> did\n- have -> had\n- make -> made\n- say -> said\n- hear -> heard\n- tell -> told\n- meet -> met\n- lose -> lost\n- find -> found\n- dream -> dreamt / dreamed\n- hang -> hung\n\n### 06.4. Các động từ giáo viên yêu cầu học thêm\n\n- sit -> sat\n- drink -> drank\n- eat -> ate\n- read -> read (/riːd/ -> /red/)\n- ride -> rode\n- mean -> meant\n- build -> built\n- dream -> dreamt / dreamed\n- hang -> hung\n- feel -> felt\n- swim -> swam\n- win -> won\n- stand -> stood\n\n## 07. Key Takeaways\n\n1. Past Simple dùng để diễn tả hành động đã hoàn thành, chuỗi hành động hoặc thói quen trong quá khứ.\n2. Past Continuous dùng để diễn tả hành động đang diễn ra tại một thời điểm trong quá khứ hoặc đang diễn ra thì có hành động khác xen vào.\n3. Khi có `when`: Past Continuous + when + Past Simple.\n4. Khi có `while`: Past Continuous + while + Past Continuous.\n5. Học động từ bất quy tắc theo nhóm sẽ dễ nhớ hơn học riêng lẻ.\n\n## 08. Mini Practice\n\nChia động từ trong ngoặc.\n\n1. I ________ (visit) Da Nang last year.\n2. She ________ (cook) when I came home.\n3. They ________ (watch) TV while I ________ (study).\n4. Did you ________ (go) to school yesterday?\n5. I go to Da Nang. -> I ________ to Da Nang.\n6. We have dinner together. -> We ________ dinner together.\n7. She buys a new book. -> She ________ a new book.\n8. They take a lot of photos. -> They ________ a lot of photos.\n9. He feels tired. -> He ________ tired.\n"},{"id":"future","type":"grammar","title":"04. Future Tenses","file":"source/04-Grammar-Future-Tenses.md","markdown":"---\ntitle: Future Tenses\nvi: Nhóm tương lai\nskill: Grammar\nlesson: Lesson 15\npriority: High\nsources:\n  - G-Future Simple.txt\n  - G-Near Future.txt\n---\n\n# 04. Grammar - Nhóm Tương Lai\n\nFile này là bản gộp đầy đủ của Future Simple và Near Future. Nội dung cũ được giữ lại và sắp xếp theo số thứ tự để dễ ôn.\n\n## 01. Future Simple - Tương Lai Đơn Với `will`\n\n### 01.1. Cách dùng\n\n1. Diễn tả quyết định ngay tại thời điểm nói.\n\nVí dụ:\n\n- I'm thirsty. I will buy some water.\n- I will help you.\n\n2. Diễn tả dự đoán không có căn cứ rõ ràng.\n\nVí dụ:\n\n- I think it will rain tomorrow.\n- I think she will pass the exam.\n\n3. Diễn tả lời hứa, lời đề nghị hoặc lời mời.\n\nVí dụ:\n\n- I will call you tonight.\n- Will you help me?\n- I won't tell anyone.\n\n### 01.2. Dấu hiệu nhận biết\n\n- tomorrow\n- next week / next month / next year\n- tonight\n- soon\n- in the future\n- one day\n- I think...\n- I believe...\n- probably\n- maybe\n- perhaps\n\n### 01.3. Công thức\n\n| Dạng câu | Công thức | Ví dụ |\n|---|---|---|\n| Khẳng định | `S + will + V1` | I will study tonight. / She will travel next month. |\n| Phủ định | `S + will not / won't + V1` | I won't stay home. / They won't come. |\n| Nghi vấn | `Will + S + V1?` | Will you come tomorrow? / Will she call me? |\n\n### 01.4. Mẹo nhớ\n\n- Tất cả các chủ ngữ đều dùng `will`.\n- Sau `will` luôn dùng V1.\n- `will go` đúng.\n- `will study` đúng.\n- `will went` sai.\n- `will studies` sai.\n\n## 02. Near Future - Tương Lai Gần Với `be going to`\n\n### 02.1. Cách dùng\n\n1. Diễn tả kế hoạch hoặc dự định đã có từ trước.\n\nVí dụ:\n\n- I am going to study tonight.\n- We are going to visit Da Nang next month.\n\n2. Diễn tả dự đoán có căn cứ.\n\nVí dụ:\n\n- Look at those clouds. It is going to rain.\n- Be careful! You are going to fall.\n\n### 02.2. Dấu hiệu nhận biết\n\n- tomorrow\n- tonight\n- next week / next month / next year\n- this weekend\n- soon\n- in the future\n- in + khoảng thời gian\n- look!\n- be careful!\n- I think...\n- I believe...\n\n### 02.3. Công thức\n\n| Dạng câu | Công thức | Ví dụ |\n|---|---|---|\n| Khẳng định | `S + am/is/are + going to + V1` | I am going to travel. / She is going to cook dinner. |\n| Phủ định | `S + am/is/are + not + going to + V1` | I am not going to stay home. / They aren't going to play football. |\n| Nghi vấn | `Am/Is/Are + S + going to + V1?` | Are you going to travel? / Is she going to study? |\n\n### 02.4. Mẹo nhớ\n\n| Chủ ngữ | To be |\n|---|---|\n| I | am |\n| He / She / It | is |\n| You / We / They | are |\n\nSau `going to` luôn dùng V1.\n\n- `going to go` đúng.\n- `going to study` đúng.\n- `going to went` sai.\n- `going to studied` sai.\n- `I going to travel` sai -> `I am going to travel` đúng.\n\n## 03. Phân Biệt Future Simple, Near Future Và Present Continuous\n\n| Mẫu câu | Khi dùng | Ví dụ |\n|---|---|---|\n| `will + V1` | Quyết định ngay lúc nói; dự đoán không có căn cứ; lời hứa/lời đề nghị | I will help you. / I think it will rain. |\n| `be going to + V1` | Kế hoạch hoặc dự định đã có; dự đoán có căn cứ | I am going to meet my teacher. / Look! It is going to rain. |\n| Present Continuous | Kế hoạch đã sắp xếp, thường có thời gian cụ thể | I am meeting my teacher at 7 p.m. |\n\n## 04. Quy Trình Quyết Định\n\n1. Quyết định ngay lúc nói? -> dùng `will`.\n2. Dự đoán không có căn cứ rõ ràng? -> dùng `will`.\n3. Lời hứa, lời đề nghị, lời mời? -> dùng `will`.\n4. Kế hoạch hoặc dự định đã có từ trước? -> dùng `be going to`.\n5. Dự đoán có căn cứ hiện tại? -> dùng `be going to`.\n6. Kế hoạch đã sắp xếp với thời gian cụ thể? -> dùng Present Continuous.\n\n## 05. Key Takeaways\n\n1. `will + V1`.\n2. `am/is/are + going to + V1`.\n3. Sau `will` và sau `going to` đều dùng V1.\n4. `will` thiên về quyết định tức thời/dự đoán theo ý kiến.\n5. `be going to` thiên về kế hoạch đã có/dự đoán có căn cứ.\n\n## 06. Mini Practice\n\nHoàn thành câu bằng `will` hoặc `be going to`.\n\n1. I think she ________ pass the exam.\n2. I am tired. I ________ go to bed early.\n3. Look at those clouds. It ________ rain.\n4. We ________ visit Da Nang next month. We already have a plan.\n5. ________ you help me?\n6. She ________ cook dinner tonight.\n"},{"id":"speaking","type":"speaking","title":"05. Speaking Topics","file":"source/05-Speaking-Topics.md","markdown":"---\ntitle: Speaking Topics\nvi: Chủ đề Speaking theo lộ trình slide\nskill: Speaking\nlessons: Lesson 7-14\npriority: High\nsources:\n  - SPEAKING-JOB.txt\n  - SPEAKING-Family.txt\n  - SPEAKING-Appearance.txt\n  - SPEAKING-Personality.txt\n  - SPEAKING-House-room.txt\n  - SPEAKING-Weekend.txt\n  - SPEAKING-Trip.txt\n---\n\n# 05. Speaking Topics - Tổng Hợp Theo Lộ Trình Học\n\nFile này gộp nội dung Speaking cũ vào một file duy nhất, đánh số theo quá trình học để dễ ôn. Nội dung không bị rút gọn thành ý mới; các mẫu câu, câu hỏi, từ vựng và bài mẫu cũ được giữ lại, chỉ được chuẩn hóa bố cục.\n\n## 01. Bản Thân - Self Introduction\n\nPhần này được thêm làm điểm bắt đầu lộ trình vì slide có yêu cầu introduce yourself và describe family members.\n\n### 01.1. Câu hỏi thường gặp\n\n1. What is your name?\n2. How old are you?\n3. Where are you from?\n4. What do you do?\n5. What are your hobbies?\n\n### 01.2. Khung trả lời\n\n- My name is...\n- I am ... years old.\n- I am from...\n- I am a student.\n- In my free time, I like/enjoy...\n\n### 01.3. Bài mẫu ngắn\n\nMy name is Khanh. I am a student and I am from Hanoi. In my free time, I enjoy listening to music and watching movies because they help me relax.\n\n## 02. Công Việc / Nghề Nghiệp Mơ Ước - Job\n\n### 02.1. What is your dream job?\n\n#### Mẫu câu trả lời\n\n- I want to be/become a/an...\n- My dream is to become a/an...\n\n#### Why?\n\n- It is a good job for me because...\n- I like acting in front of lots of people.\n- I like helping people.\n- I like travel and flying.\n- I love working with kids/children.\n- It is hard work, but the pay is good.\n- It is a well-paid job.\n- I get to meet a lot of people.\n- I have a chance to visit lots of countries.\n\n### 02.2. What do you do? / What is your job?\n\n#### Mẫu câu trả lời\n\n- I'm a/an ... at ...\n- I'm working as a/an ... at ...\n\n### 02.3. What do you like about your job?\n\n#### Mẫu câu trả lời\n\n- I like ... a lot.\n- I really like...\n- I'm well-paid.\n- I love working with kids.\n- I think it is the people I work with. They are so nice/kind.\n- I think my boss is great to work for.\n- I get to meet so many people.\n\n### 02.4. What do you dislike about your job?\n\nCâu hỏi tương tự:\n\n- Is there anything you don't like about your job?\n\n#### Mẫu câu trả lời\n\n- The only trouble is...\n- I do the same thing every day.\n- I'm really sick of it.\n- I don't like the long hours.\n- It is hard work and pretty tiring.\n- I'm on my feet all day.\n- The pay is not good.\n- I'm not well-paid.\n\n### 02.5. Cách khác để diễn tả thích / không thích\n\n| Thích | Không thích |\n|---|---|\n| be into something | can't stand something |\n| have a passion for something | hate something |\n| be interested in something | not like something |\n| love working with... | be sick of something |\n\n### 02.6. Câu hỏi tương tự\n\n- Do you want to become a/an ... in the future? Why?\n- What is your father's/mother's/brother's/sister's job?\n- What does your father/mother/brother/sister do?\n\n### 02.7. Bài mẫu ngắn\n\nMy dream is to become a teacher. It is a good job for me because I love working with kids. It is hard work, but I think it is meaningful.\n\n## 03. Gia Đình - Family\n\n### 03.1. Do you live in a big family?\n\n#### Mẫu câu trả lời\n\n- No, I'm an only child. It's just me and my parents.\n- No, I live in a nuclear/small family with my parents and my younger sister.\n- Well, I come from quite a big/large family. I've got two brothers.\n\n### 03.2. How many members/people are there in your family?\n\n#### Mẫu câu trả lời\n\n- There are four members/people in my family: my parents, my younger brother and me.\n\n### 03.3. Have you got / Do you have any brothers/sisters/siblings?\n\n#### Mẫu câu trả lời\n\n- I have one younger brother and two elder sisters.\n- I've got one younger brother and two elder sisters.\n\n### 03.4. What does he/she like? / What are your hobbies?\n\n#### Mẫu câu trả lời\n\n- He/She is very interested in computers. We spend all our free time in computer stores and on the Internet.\n- My sister is more interested in the arts. She likes music and she loves to read.\n- My dad likes outdoor things. He is really into sports and swimming, and he always tells me I should get more interested in sports.\n- Both of us love to learn new things about cultures.\n- I'm keen on movies and sports.\n\n### 03.5. Cấu trúc nói về sở thích\n\n| Mẫu câu | Theo sau bằng | Ví dụ |\n|---|---|---|\n| like / love / enjoy | noun hoặc V-ing | I enjoy reading books. |\n| be interested in | noun hoặc V-ing | She is interested in music. |\n| be really into | noun hoặc V-ing | My dad is really into sports. |\n| be keen on | noun hoặc V-ing | I'm keen on movies and sports. |\n\n### 03.6. Mở rộng thêm lý do vì sao thích hoạt động đó\n\n- because it is interesting.\n- because it is relaxing.\n- because it helps me relax.\n- because it is good for health.\n\n### 03.7. Từ vựng cần nhớ\n\n| English | Vietnamese |\n|---|---|\n| only child | con một |\n| nuclear family | gia đình hạt nhân |\n| small family | gia đình nhỏ |\n| big/large family | gia đình lớn |\n| younger brother/sister | em trai/em gái |\n| elder brother/sister | anh trai/chị gái |\n| parents | bố mẹ |\n| siblings | anh chị em ruột |\n| outdoor things | hoạt động ngoài trời |\n| culture | văn hóa |\n\n## 04. Ngoại Hình - Appearance\n\n### 04.1. Câu hỏi thường gặp\n\n1. What does he/she look like?\n2. What does your father/mother look like?\n3. Can you describe your father/mother?\n4. What kinds of clothes does he/she often wear?\n\n### 04.2. Age - Tuổi\n\n- He/She is almost 25, but he/she doesn't look that old.\n- He/She is in his/her twenties/thirties/forties.\n- He/She is young/old/middle-aged.\n\n### 04.3. General look - Ngoại hình chung\n\n- He/She is very + adjective.\n\nAdjectives:\n\n- handsome - đẹp trai\n- pretty - xinh đẹp\n- beautiful - xinh đẹp\n- cute - đáng yêu\n- good-looking - ưa nhìn\n- average-looking - bình thường\n\n### 04.4. Height, weight and build - Chiều cao, cân nặng và vóc người\n\n- He/She is not very tall, about ... centimeters.\n- He/She is quite short, about ... centimeters.\n- He/She is of average height.\n- He/She weighs ... kilos.\n- He/She is quite slim/thin/overweight/chubby/well-built.\n\n### 04.5. Face and head - Mặt và đầu\n\n- He/She has got dark/fair skin.\n- She has got long straight black hair.\n- He/She has got brown/blue eyes.\n- She has got glasses.\n- He has got a beard/moustache.\n\nTừ vựng tóc:\n\n- long - dài\n- short - ngắn\n- shoulder-length - ngang vai\n- straight - thẳng\n- wavy - xoăn lượn sóng\n- curly - xoăn xù\n- black - đen\n- brown - nâu\n- blonde - vàng hoe\n\n### 04.6. Clothes - Quần áo\n\n#### What kinds of clothes does he/she often wear?\n\n- He/She often wears...\n\nClothes:\n\n- shirts - áo sơ mi\n- T-shirts - áo phông\n- a pair of jeans - quần bò\n- casual clothes - quần áo thường ngày\n\n### 04.7. Bài mẫu ngắn\n\nMy father is in his forties. He is not very tall, but he is well-built. He has got short black hair and brown eyes. He often wears shirts and a pair of jeans.\n\n## 05. Tính Cách - Personality\n\n### 05.1. What is he/she/your father/your mother like?\n\n#### Công thức trả lời\n\n`He/She is + adjective + explanation.`\n\nVí dụ:\n\n- He is really neat. He always keeps things tidy.\n- She is great to be with. She makes me laugh all the time.\n\n### 05.2. Gợi ý tính cách và giải thích\n\n| Tính cách | Giải thích mẫu |\n|---|---|\n| be really neat/organized | He always keeps things tidy. |\n| be great to be with | She makes me laugh all the time. |\n| be funny/easy-going | He always tells jokes / does crazy things. |\n| be friendly and easy to talk to | She is easy to talk to. |\n| be outgoing/sociable | He loves going out and meeting people. |\n| be kind and generous | She loves giving things and does not expect anything in return. |\n| be kind of shy and not very talkative | He does not talk much. |\n| always look like he is in a bad mood | He often looks unhappy. |\n| be pretty serious | It is difficult to get him to laugh. |\n\nGhi chú thêm từ source cũ:\n\n- when someone tells a really funny joke, he doesn't seem to think it is funny.\n\n### 05.3. Is he friendly/talkative/humorous/generous?\n\n#### Mức độ tính từ\n\n| Mức độ | Mẫu câu |\n|---|---|\n| Rất | He is really/so/very + adjective. |\n| Khá | He is quite/pretty/kind of + adjective. |\n| Phủ định | He is not + adjective + at all. |\n\n### 05.4. Ví dụ mẫu\n\nMy father is really neat. He always keeps things tidy. He is also great to be with because he makes me laugh all the time.\n\n## 06. Nhà Ở Và Phòng Yêu Thích - House / Room\n\n### 06.1. Do you live in a big house?\n\n#### Mẫu câu trả lời\n\n- Yes, my house is quite big.\n- Yes, I live in a big house.\n- No, my house is quite small.\n- No, I live in a small house.\n\n### 06.2. How many rooms does your house have?\n\n#### Mẫu câu trả lời\n\n- It has five rooms: a living room, a kitchen, a bathroom and two bedrooms.\n- It's got five rooms: a living room, a kitchen, a bathroom and two bedrooms.\n\n### 06.3. What is your favorite room in your house?\n\n#### Mẫu câu trả lời\n\n- My favorite room in my house is the bedroom/living room/kitchen.\n\n#### Bedroom\n\n- because I feel free and comfortable in my own room.\n- because I can do whatever I want like studying, listening to music, watching films.\n\n#### Kitchen\n\n- because I love cooking.\n- because I want to cook for my family.\n\n#### Living room\n\n- because I can spend time with my family there.\n- We can watch TV together and have a chit-chat.\n\n### 06.4. Can you describe your living room/bedroom/kitchen?\n\n#### Mẫu câu trả lời\n\n- It is comfortable, but it is pretty small.\n- It is really big.\n- It is huge.\n- My room is painted in blue/white/pink.\n- There is a desk, a chair, a bed and a wardrobe.\n\n### 06.5. Áp dụng giới từ miêu tả vị trí đồ vật trong phòng\n\n- My bed is in the middle of the room.\n- The table is next to the bed.\n- There are some pictures on the wall.\n\n### 06.6. Từ vựng cần nhớ\n\n| English | Vietnamese |\n|---|---|\n| living room | phòng khách |\n| kitchen | nhà bếp |\n| bathroom | phòng tắm |\n| bedroom | phòng ngủ |\n| desk | bàn học/bàn làm việc |\n| chair | ghế |\n| bed | giường |\n| wardrobe | tủ quần áo |\n| comfortable | thoải mái |\n| huge | rất lớn |\n| in the middle of | ở giữa |\n| next to | bên cạnh |\n| on the wall | trên tường |\n\n## 07. Cuối Tuần Và Thời Gian Rảnh - Weekend / Free Time\n\n### 07.1. What do you often do on the weekend / in your free time?\n\n#### Mẫu câu\n\n- I often + Verb.\n- I don't do anything special.\n- I'm not free on the weekend.\n- I usually go away for the weekend.\n\n#### Gợi ý hoạt động\n\n- pack a lunch, ride to a park and have a picnic\n- have a party\n- go to a disco\n- come over to my friend's house for dinner and watch a movie together\n- go out for dinner\n- see a movie / go to the cinema\n- go for coffee after class/work/school\n- go downtown\n- go shopping\n\n### 07.2. Other words to describe likes and dislikes\n\n| Thích | Không thích |\n|---|---|\n| enjoy V-ing | can't stand something |\n| be into something | hate something |\n| have a passion for something | phủ định của các cụm thích |\n| be interested in something |  |\n| be keen on something |  |\n| be crazy about something |  |\n| be a big fan of something |  |\n\n### 07.3. Do you like sports? How often do you play sports?\n\n#### Từ vựng / cụm từ\n\n- work out - tập thể dục\n- get lots of exercise - tập thể dục nhiều\n- get some exercise - tập thể dục một chút\n- take walks - đi bộ\n- go jogging to warm up - chạy bộ để khởi động\n- help me be/keep in great shape - giúp tôi giữ dáng\n- get big muscles - tăng cơ\n- be really good at something - rất giỏi một thứ gì đó\n\n#### How often?\n\n- every day - hằng ngày\n- always - luôn luôn\n- usually - thường xuyên\n- often - thường thường\n- sometimes - thỉnh thoảng\n- once/twice/three times a day/week - một/hai/ba lần một ngày/tuần\n\n#### Mẫu câu phủ định\n\n- I don't like exercising at all, but I do watch a lot of baseball on TV.\n- I don't like doing anything too energetic.\n- I don't like to sweat.\n\n### 07.4. Do you like watching movies?\n\n- Yes, watching movies is a good way to relax/chill out.\n- No, I don't like watching movies. I often spend my free time reading books/listening to music/hanging out with my friends/cooking.\n\n### 07.5. What is your favorite movie?\n\n- My favorite movie is...\n- It is one of the funniest/most interesting/best movies I've seen.\n- If you want a good laugh, you should see it.\n- It is worth seeing.\n- The story is good/interesting/fantastic.\n- The special effects are great/terrific.\n- The main character is pretty good/amazing/good-looking.\n- The music/soundtrack is excellent/nice.\n\n### 07.6. Do you like reading books? What do you like to read most?\n\n- I'm interested in reading books about animals/nature/culture/languages.\n- I'm really into reading books about animals/nature/culture/languages.\n\n### 07.7. Do you like listening to music?\n\n- I'm keen on listening to music.\n- I'm fond of listening to music.\n- I often listen to my favorite songs when I'm relaxing/taking a shower/doing the chores.\n\n### 07.8. Who is your favorite singer?\n\n- I'm a big fan of...\n- He has a great/beautiful voice.\n- He is also handsome/attractive.\n- Có thể miêu tả thêm về ngoại hình và tính cách đã học.\n\n### 07.9. Câu hỏi tương tự\n\n- What does your father/mother/brother/sister often do in his/her free time?\n- Does your father/mother/brother/sister often play sports/read books/watch movies/listen to music?\n\n## 08. Du Lịch Và Chuyến Đi Đáng Nhớ - Trip / Travelling\n\n### 08.1. Do you love travelling?\n\n#### Câu trả lời đồng ý\n\nYes, definitely, because I can relax, spend time with my family and friends, learn new things, and gain new experiences.\n\n#### Câu trả lời không đồng ý\n\n- No, I don't, because I don't have enough time.\n- No, I don't, because travelling is expensive.\n\n#### Useful ideas\n\n- relax\n- spend time with my family\n- spend time with my friends\n- learn new things\n- gain new experiences\n- enjoy beautiful scenery\n- try local food\n\n### 08.2. Tell me about one trip you remember the most.\n\n#### Bài mẫu từ source cũ\n\nThe trip I remember the most is my trip to Hue, Da Nang, and Hoi An.\n\nI went there last year.\n\nI went with my friends.\n\nWe went there by plane, and it took us about one hour to get there.\n\nWe went sightseeing, enjoyed the local food, visited many beautiful places, and took a lot of photos.\n\nThe trip was wonderful, and I had a great time.\n\nIf I have a chance, I would love to visit these places again in the future.\n\n### 08.3. Useful Expressions\n\n- The trip I remember the most is...\n- I went there...\n- I went with...\n- We went there by...\n- It took us about...\n- We went sightseeing.\n- We enjoyed the local food.\n- We visited many beautiful places.\n- We took a lot of photos.\n- The trip was wonderful.\n- I had a great time.\n- If I have a chance, I would love to visit this place again in the future.\n\n### 08.4. Useful Vocabulary\n\n| English | Vietnamese |\n|---|---|\n| travel | du lịch |\n| trip | chuyến đi |\n| sightseeing | tham quan |\n| local food | món ăn địa phương |\n| beautiful places | những nơi đẹp |\n| plane | máy bay |\n| friends | bạn bè |\n| family | gia đình |\n| experience | trải nghiệm |\n| wonderful | tuyệt vời |\n| fantastic | rất tuyệt |\n| peaceful | yên bình |\n| crowded | đông đúc |\n| future | tương lai |\n\n### 08.5. Useful Grammar\n\n- Present Simple\n- Simple Past\n- because...\n- and / also\n- If I have a chance, I would love to...\n\n## 09. Checklist Tự Ôn Speaking\n\n1. Trả lời được mỗi chủ đề bằng ít nhất 2-3 câu.\n2. Có ít nhất 1 lý do dùng `because`.\n3. Có ít nhất 1 cụm từ vựng đúng chủ đề.\n4. Dùng đúng thì: Present Simple cho thói quen, Past Simple cho trip, Future forms cho dự định.\n5. Đọc to câu trả lời 3 lần và tự sửa phát âm.\n"}];
DOCS.push({"id":"modal-verbs","type":"grammar","title":"06. Grammar Modal Verbs","file":"source/06-Grammar-Modal-Verbs.md","markdown":"---\ntitle: Modal Verbs\nvi: Động từ khuyết thiếu\nskill: Grammar\nlesson: Lesson 15\npriority: High\nsources:\n  - Lesson 15.pptx\n---\n\n# 06. Grammar - Modal Verbs\n\nModal verbs là nhóm động từ khuyết thiếu dùng để diễn tả khả năng, xin phép, lời khuyên, nghĩa vụ, khả năng xảy ra hoặc suy đoán.\n\n## 01. Khái Niệm\n\nModal verb là trợ động từ.\n\nModal verbs thường dùng để diễn tả:\n\n- Ability - khả năng\n- Permission - sự cho phép / xin phép\n- Advice - lời khuyên\n- Obligation - nghĩa vụ / sự bắt buộc\n- Possibility - khả năng có thể xảy ra\n- Probability - sự suy đoán / khả năng cao thấp\n\n## 02. Công Thức Chung\n\n| Dạng | Công thức | Ví dụ |\n|---|---|---|\n| Khẳng định | `S + modal verb + V1` | I can swim. |\n| Phủ định | `S + modal verb + not + V1` | She can't come. |\n| Nghi vấn | `Modal verb + S + V1?` | May I come in? |\n\n### Ghi Nhớ Quan Trọng\n\n- Modal verbs chỉ có một dạng.\n- Modal verbs không đổi theo chủ ngữ.\n- Sau modal verb luôn dùng động từ nguyên mẫu không `to`.\n- Không thêm `s/es` sau modal verb.\n\nVí dụ đúng:\n\n- She can swim.\n- You should study harder.\n- We may go tomorrow.\n\nVí dụ sai:\n\n- She cans swim.\n- She can to swim.\n\n## 03. Common Modal Verbs\n\n| Modal verb | Phủ định | Nghĩa chính |\n|---|---|---|\n| can | can't | có thể / biết cách làm gì |\n| could | couldn't | có thể trong quá khứ / xin phép lịch sự |\n| may | may not | có thể / xin phép trang trọng |\n| might | might not | có thể, nhưng không chắc |\n| will | won't | sẽ |\n| should | shouldn't | nên / không nên |\n| must | mustn't | phải / không được phép |\n\n## 04. Semi-Modals\n\nSemi-modals là các cấu trúc gần giống modal verbs nhưng có một số điểm khác.\n\n| Semi-modal | Cách dùng | Ví dụ |\n|---|---|---|\n| ought to | Đưa ra lời khuyên, chỉ có một dạng | You ought to try this dish. |\n| have to | Nghĩa vụ do luật lệ / hoàn cảnh bên ngoài, đổi theo chủ ngữ và thì | She has to work. / They had to wait. |\n| need to | Điều cần thiết, nhẹ hơn `must`, đổi theo chủ ngữ và thì | I need to study. / She needs to buy a ticket. |\n\n## 05. Ability - Khả Năng\n\n| Cấu trúc | Cách dùng | Ví dụ |\n|---|---|---|\n| can | Khả năng ở hiện tại | She can speak two languages. |\n| could | Khả năng ở quá khứ | Tom could read when he was two. |\n| be able to | Khả năng ở các thì khác | I will be able to speak English more fluently. |\n\nVí dụ thêm:\n\n- She hasn't been able to visit us this year.\n\n## 06. Permission - Xin Phép / Cho Phép\n\n### Xin phép\n\n| Cấu trúc | Mức độ lịch sự | Ví dụ |\n|---|---|---|\n| May I...? | Trang trọng nhất | May I come in? |\n| Could I...? | Lịch sự | Could I borrow your pen? |\n| Can I...? | Thân mật hơn | Can I go shopping? |\n\n### Cho phép\n\n- You may come in.\n- You can use my laptop.\n\nMẹo nhớ mức độ lịch sự:\n\n`May` > `Could` > `Can`\n\n## 07. Advice - Lời Khuyên\n\nDùng `should` hoặc `ought to` để đưa ra lời khuyên.\n\nVí dụ:\n\n- You should study every day.\n- You ought to finish your homework first.\n\n## 08. Obligation - Nghĩa Vụ / Sự Cần Thiết\n\n| Cấu trúc | Nghĩa | Ví dụ |\n|---|---|---|\n| must | Người nói nghĩ việc đó cần thiết / bắt buộc | I must study tonight. |\n| have to | Luật lệ hoặc yêu cầu từ bên ngoài | We have to attend at least 80% of classes. |\n| need to | Cần thiết nhưng nhẹ hơn `must` | I need to improve my pronunciation. |\n\nVí dụ thêm:\n\n- You must submit your homework.\n- I have to work on Sundays.\n\n## 09. Important Differences\n\n### `mustn't` vs `don't have to`\n\n| Cấu trúc | Nghĩa | Ví dụ |\n|---|---|---|\n| mustn't | Không được phép làm | You mustn't smoke here. |\n| don't have to | Không cần thiết phải làm | You don't have to come tomorrow. |\n| don't need to | Không cần làm | You don't need to buy water. |\n\nLỗi dễ sai:\n\n- `mustn't` không có nghĩa là \"không cần\".\n- `don't have to` mới là \"không cần phải\".\n\n## 10. Probability - Suy Đoán\n\n| Cấu trúc | Mức độ chắc chắn | Ví dụ |\n|---|---|---|\n| must | Gần như chắc chắn | It must be Simon. |\n| can't / couldn't | Không thể là | It can't be my mom. She is sitting next to me. |\n| may / might | Có thể, không chắc | It may rain. / It might be Polish. |\n\n## 11. Summary\n\n| Ý nghĩa | Cấu trúc thường dùng |\n|---|---|\n| Ability | can, could, be able to |\n| Permission | may, could, can |\n| Advice | should, ought to |\n| Obligation | must, have to, need to |\n| Probability | must, can't, couldn't, may, might |\n\n## 12. Common Exam Points\n\n- Modal + V1.\n- Không dùng `to` sau modal verbs thường.\n- Không thêm `s/es` vào modal verbs.\n- Phân biệt `must` và `have to`.\n- Phân biệt `mustn't` và `don't have to`.\n- Phân biệt `should` và `ought to`.\n- Phân biệt `can` và `could`.\n- Phân biệt `may` và `might`.\n- Biết dùng `be able to` cho các thì khác.\n- Biết dùng modal verbs để xin phép, khuyên, bắt buộc và suy đoán.\n"});

  function inlineAudioFor(text) { const a = audioMatchesText(text); return a ? '<div class="inline-audio"><span class="audio-title">Audio trung tâm: ' + esc(a.title) + '</span><audio controls preload="none" src="' + esc(a.file) + '"></audio></div>' : ""; }
  function audioBank() { const groups = {}; AUDIO.forEach((a) => { (groups[a.topic] ||= []).push(a); }); return '<section class="note-card"><h2>Audio từ trung tâm</h2><p class="sub">Danh sách này chưa đầy đủ. Khi bạn bổ sung file mới vào thư mục audio, có thể cập nhật thêm vào web sau.</p><div class="audio-bank">' + Object.entries(groups).map(([topic, items]) => '<div class="audio-topic searchable"><h3>' + esc(topic) + '</h3><div class="audio-list">' + items.map((a) => '<div class="audio-item"><div class="audio-title">' + a.num + '. ' + esc(a.title) + '</div><audio controls preload="none" src="' + esc(a.file) + '"></audio></div>').join("") + '</div></div>').join("") + '</div></section>'; }
  function mdToHtml(md, kind) {
    const lines = stripFrontmatter(md).split(/\r?\n/);
    const out = [];
    let i = 0;
    function table() {
      const rows = [];
      while (i < lines.length && /^\|.*\|\s*$/.test(lines[i])) rows.push(lines[i++]);
      if (rows.length < 2) return;
      const head = rows[0].split("|").slice(1, -1).map((x) => x.trim());
      const body = rows.slice(2).map((r) => r.split("|").slice(1, -1).map((x) => x.trim()));
      out.push(`<div class="table-wrap"><table><thead><tr>${head.map((h) => `<th>${inline(h)}</th>`).join("")}</tr></thead><tbody>${body.map((r) => `<tr>${r.map((c) => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
    }
    function list(ordered) {
      const items = [];
      const re = ordered ? /^\d+\.\s+(.+)/ : /^-\s+(.+)/;
      while (i < lines.length && re.test(lines[i])) items.push(lines[i++].replace(re, "$1"));
      out.push(`<${ordered ? "ol" : "ul"}>${items.map((x) => `<li>${inline(x)}${kind === "speaking" ? inlineAudioFor(x) : ""}</li>`).join("")}</${ordered ? "ol" : "ul"}>`);
    }
    while (i < lines.length) {
      const line = lines[i];
      if (!line.trim()) { i++; continue; }
      if (/^\|.*\|\s*$/.test(line)) { table(); continue; }
      const h = line.match(/^(#{1,4})\s+(.+)/);
      if (h) { const level = h[1].length; const text = h[2]; out.push(`<h${level} id="${slug(text)}">${inline(text)}</h${level}>`); if (kind === "speaking") out.push(inlineAudioFor(text)); i++; continue; }
      if (/^\d+\.\s+/.test(line)) { list(true); continue; }
      if (/^-\s+/.test(line)) { list(false); continue; }
      const paras = [];
      while (i < lines.length && lines[i].trim() && !/^(#{1,4})\s+/.test(lines[i]) && !/^\|.*\|\s*$/.test(lines[i]) && !/^-\s+/.test(lines[i]) && !/^\d+\.\s+/.test(lines[i])) paras.push(lines[i++]);
      out.push(`<p>${inline(paras.join(" "))}</p>`);
    }
    return out.join("\n");
  }
  function docSection(doc) { return `<article class="note-section searchable"><div class="note-content">${mdToHtml(doc.markdown, doc.type)}</div><div class="source">Source: ${esc(doc.file)}</div></article>`; }
  function stagePage() {
    return `<section class="hero"><span class="tag">Đã học đến Lesson 15</span><h2>Giai đoạn hiện tại, chưa phải toàn bộ khóa</h2><p>Tài liệu này chỉ tổng hợp kiến thức đã học đến Lesson 15. Các lesson sau có thể bổ sung kiến thức mới, nên web sẽ được cập nhật theo tiến độ học.</p></section><section class="note-card"><h2>Mục tiêu giai đoạn hiện tại</h2><ol>${GOALS.map((g) => `<li>${esc(g)}</li>`).join("")}</ol></section><section class="note-grid"><article class="note-card searchable"><h2>Ưu tiên số 1</h2><p>Xây nền Grammar: nouns, quantifiers, pronouns, adjectives, determiners, prepositions, present, past, future, modal verbs.</p></article><article class="note-card searchable"><h2>Nguyên tắc học</h2><p>Không học vượt, không lan man. Học theo giáo trình, hiểu vì sao đúng/sai, rồi mới luyện tự nhiên hơn.</p></article></section>`;
  }
  function coursePage() { return `<section class="hero"><h2>Course Map đến Lesson 15</h2><p>Dùng để biết kiến thức đến từ lesson nào. Khi ôn, ưu tiên ôn theo topic trong Grammar/Speaking/Pronunciation.</p></section><section class="course-map"><div class="course-head"><span>#</span><span>Lesson</span><span>Nội dung</span><span>Nên xem</span><span>Source</span></div>${LESSONS.map((l) => `<article class="course-row searchable"><div class="lesson-no">${l.n}</div><div><span class="tag">Lesson ${l.n}</span><h3>${esc(l.title)}</h3></div><div class="course-focus"><div class="course-label course-compact">Nội dung</div><p>${esc(l.focus)}</p></div><div class="course-note"><div class="course-label course-compact">Nên xem</div><p><b>Gợi ý:</b> ${esc(l.note)}</p></div><div class="source">${esc(l.source)}</div></article>`).join("")}</section>`; }
  function grammarPage() { return `<section class="hero"><span class="tag">Up to Lesson 15</span><h2>Grammar Notes</h2><p>Mỗi phần ưu tiên thứ tự: khái niệm → công thức → cách dùng → dấu hiệu → ví dụ → bẫy lỗi.</p></section>${DOCS.filter((d) => d.type === "grammar").map(docSection).join("")}`; }
  function speakingPage() { return `<section class="hero"><span class="tag">A1-A2 first</span><h2>Speaking Notes</h2><p>Các ví dụ thật được giữ nguyên. Mục tiêu hiện tại là nói đúng ngữ pháp, dễ học thuộc, sau đó mới tự nhiên hơn.</p></section><section class="note-card"><h2>Cách đọc nhanh các câu mẫu</h2>${READ_GUIDE.map((r) => `<div class="read-card searchable"><b>${esc(r.topic)}</b><div class="read-line">${esc(r.text)}</div><div class="source">Nhấn: ${esc(r.stress)}<br>Grammar: ${esc(r.grammar)}</div></div>`).join("")}</section>${audioBank()}${DOCS.filter((d) => d.type === "speaking").map(docSection).join("")}`; }
  function pronunciationPage() {
    return `<section class="hero"><span class="tag">Lesson 1-5 + grammar endings</span><h2>Pronunciation Notes</h2><p>Phần này tập trung vào đọc đúng IPA cơ bản, trọng âm, âm cuối và các âm dễ nhầm trong nội dung đã học.</p></section><section class="note-grid"><article class="note-card searchable"><h2>01. IPA Workflow</h2><ol><li>Nhìn phiên âm.</li><li>Đếm âm tiết.</li><li>Tìm trọng âm.</li><li>Đọc từng âm.</li><li>Ghép từ thành cụm.</li></ol></article><article class="note-card searchable"><h2>02. Vowels</h2><p>Ôn nguyên âm dài/ngắn và diphthongs từ Lesson 1-2. Khi đọc, không kéo dài tùy tiện, phải dựa vào ký hiệu IPA.</p></article><article class="note-card searchable"><h2>03. Consonants</h2><p>Ôn consonants từ Lesson 3-4. Chú ý cặp vô thanh/hữu thanh: /p-b/, /t-d/, /k-g/, /f-v/, /s-z/.</p></article><article class="note-card searchable"><h2>04. Final Sounds</h2><p>Không nuốt âm cuối. Ưu tiên các âm cuối thường gặp trong bài: /s/, /z/, /t/, /d/, /k/, /n/, /ŋ/.</p></article><article class="note-card searchable"><h2>05. -s / -es</h2><p>/s/: books, works<br>/z/: teachers, roads<br>/ɪz/: buses, dishes, watches</p></article><article class="note-card searchable"><h2>06. -ed</h2><p>/t/: liked, walked<br>/d/: played, lived<br>/ɪd/: wanted, needed</p></article></section>`;
  }
  function reviewPage() {
    return `<section class="hero"><span class="tag">Review Up To Lesson 15</span><h2>Ôn theo chủ đề, không ôn lan man</h2><p>Không gọi đây là ôn toàn khóa. Đây là phần ôn nội dung đã học đến Lesson 15.</p></section><section class="note-grid"><article class="note-card searchable"><h2>Grammar Review</h2><ol><li>Foundation: nouns, quantifiers, pronouns, adjectives, articles, prepositions.</li><li>Present: Present Simple vs Present Continuous.</li><li>Past: Past Simple, Past Continuous, irregular verbs, -ed pronunciation.</li><li>Future: will vs be going to.</li><li>Modal verbs: can/could, may/might, should/ought to, must/have to/need to.</li></ol></article><article class="note-card searchable"><h2>Speaking Review</h2><ol><li>Bản thân.</li><li>Công việc.</li><li>Gia đình, ngoại hình, tính cách.</li><li>House / Room.</li><li>Weekend / Free time.</li><li>Trip / Travelling.</li></ol></article><article class="note-card searchable"><h2>Homework / Review Tracker</h2><ul><li>Tôi đã hiểu khái niệm chưa?</li><li>Tôi có viết lại được công thức không?</li><li>Tôi biết vì sao câu đúng/sai không?</li><li>Tôi nói lại được speaking answer mà không nhìn quá nhiều không?</li><li>Tôi có lỗi nào cần ghi lại để ôn sau không?</li></ul></article><article class="note-card searchable"><h2>Common Mistake Review</h2><ul><li>Quên s/es với he/she/it.</li><li>Sau did/didn't vẫn dùng V2.</li><li>Nhầm many/much.</li><li>Nhầm a/an/the.</li><li>Nuốt âm cuối khi đọc speaking.</li><li>Dùng sai modal verbs: she cans, can to, mustn't = không cần.</li></ul></article></section><section class="note-card searchable"><h2>Vocabulary Bank</h2>${Object.entries(VOCAB).map(([topic, words]) => `<h3>${esc(topic)}</h3><p>${words.map((w) => `<code>${esc(w)}</code>`).join(" ")}</p>`).join("")}</section>`;
  }
  function buildToc() { const hs = [...content.querySelectorAll("h2")].slice(0, 28); toc.innerHTML = "<b>Mục lục</b>" + hs.map((h) => `<button onclick="document.getElementById('${h.id || slug(h.textContent)}').scrollIntoView({behavior:'smooth'})">${esc(h.textContent)}</button>`).join(""); }
  function applySearch() { const q = search.value.toLowerCase().trim(); document.querySelectorAll(".searchable").forEach((el) => el.classList.toggle("hidden", q && !el.textContent.toLowerCase().includes(q))); }
  function render() { title.textContent = pages[state.page][0]; subtitle.textContent = pages[state.page][1]; content.innerHTML = { stage: stagePage, course: coursePage, grammar: grammarPage, speaking: speakingPage, pronunciation: pronunciationPage, review: reviewPage }[state.page](); document.querySelectorAll(".nav button").forEach((b) => b.classList.toggle("active", b.dataset.page === state.page)); side.classList.remove("open"); buildToc(); applySearch(); }
  document.querySelectorAll(".nav button").forEach((b) => b.onclick = () => { state.page = b.dataset.page; search.value = ""; render(); scrollTo(0, 0); });
  search.oninput = applySearch;
  menu.onclick = () => side.classList.add("open");
  closeMenu.onclick = () => side.classList.remove("open");
  render();
})();</script></body></html>
