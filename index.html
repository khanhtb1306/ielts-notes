<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Pre-IELTS Notes · Khánh</title>
    <style>
:root {
  --bg: #f6f7fb;
  --card: #ffffff;
  --paper2: #f2f4f8;
  --ink: #1b2333;
  --muted: #6b7385;
  --line: #e6e8ef;
  --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 8px 24px rgba(16, 24, 40, 0.05);
  --shadow-lg: 0 12px 40px rgba(16, 24, 40, 0.12);
  --sidebar: 272px;
  --accent: #2563eb;
  --accent-soft: rgba(37, 99, 235, 0.1);
  --radius: 16px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Inter", "Segoe UI", Roboto, Arial, sans-serif;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
a { color: var(--accent); }
code {
  background: var(--paper2);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 1px 6px;
  font-family: "JetBrains Mono", Consolas, monospace;
  font-size: 0.88em;
  color: #b91c1c;
}
::selection { background: var(--accent-soft); }

/* ===== Accent per page ===== */
#content[data-page="stage"], .app[data-page="stage"] { --accent: #2563eb; --accent-soft: rgba(37,99,235,.12); }
.app[data-page="course"] { --accent: #d97706; --accent-soft: rgba(217,119,6,.12); }
.app[data-page="pronunciation"] { --accent: #0d9488; --accent-soft: rgba(13,148,136,.12); }
.app[data-page="grammar"] { --accent: #4f46e5; --accent-soft: rgba(79,70,229,.12); }
.app[data-page="speaking"] { --accent: #7c3aed; --accent-soft: rgba(124,58,237,.12); }
.app[data-page="final"] { --accent: #059669; --accent-soft: rgba(5,150,105,.12); }

.app { display: grid; grid-template-columns: var(--sidebar) 1fr; min-height: 100vh; }

/* ===== Sidebar ===== */
.side {
  position: sticky; top: 0; height: 100vh;
  padding: 20px 14px; background: #fff;
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 14px;
}
.brand { padding: 4px 8px 14px; border-bottom: 1px solid var(--line); }
.brand b { font-size: 18px; display: block; letter-spacing: -0.01em; }
.brand small { color: var(--muted); font-size: 12.5px; }
.search {
  display: flex; gap: 8px; align-items: center;
  border: 1px solid var(--line); background: var(--paper2);
  border-radius: 12px; padding: 9px 12px; color: var(--muted);
  transition: border-color .15s, box-shadow .15s;
}
.search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search input { border: 0; outline: 0; background: transparent; width: 100%; }
.nav { display: grid; gap: 3px; }
.nav button {
  display: flex; align-items: center; gap: 10px;
  border: 0; background: transparent; color: #495066;
  padding: 10px 12px; border-radius: 11px; text-align: left; cursor: pointer;
  font-size: 14.5px; transition: background .12s, color .12s;
}
.nav button .ico { font-size: 16px; width: 20px; text-align: center; }
.nav button:hover { background: var(--paper2); }
.nav button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.toc { border-top: 1px solid var(--line); padding-top: 12px; overflow: auto; }
.toc b { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; padding: 0 8px; }
.toc button { display: block; width: 100%; border: 0; background: transparent; color: var(--muted); text-align: left; cursor: pointer; font-size: 13px; line-height: 1.3; padding: 6px 8px; border-radius: 8px; }
.toc button:hover { background: var(--paper2); color: var(--accent); }
.side-actions { margin-top: auto; }
.mini { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 12px; cursor: pointer; }
.mobile { display: none; }

/* ===== Main ===== */
main { padding: 30px clamp(20px, 4vw, 56px) 90px; min-width: 0; }
.top { display: flex; justify-content: space-between; gap: 18px; align-items: flex-start; margin-bottom: 22px; }
.eyebrow { font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); font-weight: 800; }
.top h1 { font-size: clamp(26px, 3.4vw, 38px); margin: 6px 0 4px; letter-spacing: -0.02em; }
.sub { color: var(--muted); margin: 0; max-width: 780px; }
.layout { display: block; }
.page { max-width: 1080px; }
.rail { display: none; }

/* ===== Hero ===== */
.hero {
  position: relative; overflow: hidden;
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 24px 26px; margin-bottom: 22px; background: #fff;
  box-shadow: var(--shadow);
}
.hero::before {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(135deg, var(--accent-soft), transparent 60%);
  pointer-events: none;
}
.hero > * { position: relative; }
.hero h2 { margin: 10px 0 6px; font-size: 23px; letter-spacing: -0.01em; }
.hero p { margin: 0; color: var(--muted); max-width: 760px; }
.tag {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 700; color: var(--accent);
  background: var(--accent-soft); padding: 4px 11px; border-radius: 999px;
}

/* ===== Cards / grid ===== */
.note-card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 20px 22px; margin-bottom: 18px;
  box-shadow: var(--shadow); border-top: 3px solid var(--accent);
}
.note-card > h2:first-child, .note-card > h3:first-child { margin-top: 0; }
.note-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-bottom: 18px; }
.note-grid .note-card { margin-bottom: 0; }

.note-section {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 8px 26px 20px; margin-bottom: 22px;
  box-shadow: var(--shadow);
}
.note-content h1 { font-size: 25px; letter-spacing: -0.01em; padding-bottom: 12px; margin-bottom: 4px; border-bottom: 2px solid var(--accent-soft); }
.note-content h2 {
  font-size: 20px; margin-top: 30px; color: var(--ink);
  padding-left: 12px; border-left: 4px solid var(--accent);
}
.note-content h3 { font-size: 16.5px; margin-top: 22px; }
.note-content h4 { font-size: 14.5px; margin-top: 16px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
.note-content ul, .note-content ol { padding-left: 22px; }
.note-content li { margin: 5px 0; }
.note-content li::marker { color: var(--accent); }
.note-content p { margin: 10px 0; }

/* ===== Tables ===== */
.table-wrap { overflow-x: auto; margin: 14px 0; border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: var(--accent-soft); color: var(--ink); font-weight: 700; position: sticky; top: 0; }
tbody tr:nth-child(even) { background: var(--paper2); }
tr:last-child td { border-bottom: 0; }

/* ===== Callouts ===== */
.callout { position: relative; border-radius: 12px; padding: 14px 16px 14px 46px; margin: 16px 0; border: 1px solid; }
.callout::before { position: absolute; left: 14px; top: 12px; font-size: 18px; }
.callout.warn { background: #fff7ed; border-color: #fed7aa; color: #7c2d12; }
.callout.warn::before { content: "⚠️"; }
.callout.tip { background: #ecfeff; border-color: #a5f3fc; color: #155e63; }
.callout.tip::before { content: "💡"; }
.callout b { display: block; margin-bottom: 4px; font-size: 14px; }
.callout p, .callout ul { margin: 4px 0; }
.callout code { background: rgba(255,255,255,.6); }

/* ===== Badges (skill/priority) ===== */
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 6px; }
.badge { font-size: 11.5px; font-weight: 700; padding: 3px 10px; border-radius: 999px; letter-spacing: .01em; }
.badge.skill { background: var(--accent-soft); color: var(--accent); }
.badge.lesson { background: #eef2ff; color: #4338ca; }
.badge.hi { background: #fef2f2; color: #dc2626; }

/* ===== Source ===== */
.source { color: var(--muted); font-size: 12.5px; margin-top: 14px; padding-top: 10px; border-top: 1px dashed var(--line); }

/* ===== Chips quick jump ===== */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
.chip {
  border: 1px solid var(--line); background: #fff; color: #495066;
  border-radius: 999px; padding: 7px 14px; font-size: 13.5px; cursor: pointer;
  transition: all .12s; box-shadow: var(--shadow);
}
.chip:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); transform: translateY(-1px); }

/* ===== Audio ===== */
.inline-audio { display: flex; flex-direction: column; gap: 5px; margin: 8px 0 16px; padding: 10px 12px; background: var(--paper2); border: 1px solid var(--line); border-radius: 12px; }
.inline-audio .audio-title { font-size: 12.5px; color: var(--accent); font-weight: 600; }
.inline-audio audio { width: 100%; height: 36px; }

/* ===== Course map ===== */
.course-map { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.course-row { display: grid; grid-template-columns: 46px 1fr; gap: 14px; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); border-top: 3px solid var(--accent); transition: transform .12s, box-shadow .12s; }
.course-row:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.lesson-no { width: 46px; height: 46px; display: grid; place-items: center; background: var(--accent); color: #fff; font-weight: 800; border-radius: 12px; font-size: 18px; }
.course-row h3 { margin: 8px 0 6px; font-size: 16px; }
.course-row p { margin: 4px 0; color: var(--muted); font-size: 13.5px; }

/* ===== Read guide cards ===== */
.read-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.read-card { background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); }
.read-card b { color: var(--accent); }
.read-card .read-line { font-size: 15.5px; margin: 8px 0; }

/* ===== IPA chart ===== */
.pron-tool { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 20px; box-shadow: var(--shadow); border-top: 3px solid var(--accent); }
.pron-tool h2 { margin: 0 0 4px; font-size: 18px; }
.pron-tool .hint { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
.pron-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.pron-input { flex: 1 1 220px; border: 1px solid var(--line); background: var(--paper2); border-radius: 12px; padding: 11px 14px; outline: 0; }
.pron-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.btn { border: 0; border-radius: 12px; padding: 11px 18px; font-weight: 600; cursor: pointer; background: var(--accent); color: #fff; transition: filter .12s, transform .12s; }
.btn:hover { filter: brightness(1.05); transform: translateY(-1px); }
.btn.ghost { background: var(--paper2); color: var(--ink); border: 1px solid var(--line); }
.pron-controls { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-top: 12px; font-size: 13px; color: var(--muted); }
.pron-controls select, .pron-controls input[type="range"] { accent-color: var(--accent); }
.pron-result { margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); font-size: 14px; min-height: 0; display: none; }
.pron-result.show { display: block; }
.pron-result .ipa-big { font-size: 20px; font-weight: 700; color: var(--accent); }

.ipa-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin: 6px 0 14px; }
.ipa-legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
.dot.long { background: #4f46e5; } .dot.short { background: #0ea5e9; }
.dot.diph { background: #7c3aed; } .dot.voiced { background: #059669; } .dot.unvoiced { background: #f97316; }

.ipa-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 10px; margin-bottom: 8px; }
.ipa-tile {
  border: 1px solid var(--line); border-radius: 14px; padding: 10px 6px 8px; background: #fff;
  text-align: center; cursor: pointer; position: relative; box-shadow: var(--shadow);
  transition: transform .1s, box-shadow .1s, border-color .1s;
  border-top: 3px solid var(--tile, var(--accent));
}
.ipa-tile:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.ipa-tile:active { transform: scale(.96); }
.ipa-tile .sym { font-size: 22px; font-weight: 700; font-family: "JetBrains Mono", Consolas, monospace; }
.ipa-tile .ex { font-size: 12px; color: var(--muted); margin-top: 2px; }
.ipa-tile .spk { font-size: 12px; color: var(--tile, var(--accent)); margin-top: 3px; }
.ipa-tile.playing { border-color: var(--tile); box-shadow: 0 0 0 3px var(--accent-soft); }

/* ===== Exam / Final ===== */
.exam-part { margin-bottom: 8px; }
.exam-head { display: flex; align-items: center; gap: 10px; margin: 10px 0 14px; }
.exam-head .num { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 15px; }
.exam-head h2 { margin: 0; font-size: 20px; }
.exam-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-bottom: 20px; }
.exam-item {
  display: flex; align-items: flex-start; gap: 10px; background: #fff; border: 1px solid var(--line);
  border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); cursor: pointer; transition: border-color .12s;
}
.exam-item:hover { border-color: var(--accent); }
.exam-item.done { background: var(--accent-soft); border-color: var(--accent); }
.exam-item.done .exam-label { text-decoration: line-through; color: var(--muted); }
.exam-item input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--accent); flex: none; }
.exam-item .exam-label { font-weight: 600; font-size: 14px; }
.exam-item .exam-sub { display: block; font-weight: 400; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.progress { height: 8px; border-radius: 999px; background: var(--paper2); overflow: hidden; margin: 6px 0 16px; }
.progress > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }

/* ===== Vocab ===== */
.vocab h3 { margin: 16px 0 6px; color: var(--accent); }
.vocab .chip-word { display: inline-block; background: var(--paper2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; margin: 3px 4px 3px 0; font-size: 13px; }

/* ===== Right rail (mini TOC) ===== */
.rail-inner { position: sticky; top: 24px; }
.rail b { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.rail a { display: block; color: var(--muted); text-decoration: none; font-size: 13px; padding: 5px 10px; border-left: 2px solid var(--line); margin-left: 2px; }
.rail a:hover { color: var(--accent); border-left-color: var(--accent); }

.hidden { display: none !important; }

/* ===== Tablet ===== */
@media (min-width: 861px) and (max-width: 1179px) {
  :root { --sidebar: 240px; }
  .page { max-width: none; }
}
/* ===== Wide desktop: show right rail ===== */
@media (min-width: 1180px) {
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 32px; align-items: start; }
  .page { max-width: none; }
  .rail { display: block; }
  .side .toc { display: none; }
}
/* ===== Mobile ===== */
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .side {
    position: fixed; z-index: 40; width: 84%; max-width: 320px;
    transform: translateX(-104%); transition: transform .22s ease;
    box-shadow: var(--shadow-lg);
  }
  .side.open { transform: translateX(0); }
  .side.open ~ main .scrim, .scrim { }
  .mobile { display: inline-flex; align-items: center; gap: 6px; }
  main { padding: 22px 16px 80px; }
  .page { max-width: none; }
  .top h1 { font-size: 25px; }
  .note-section { padding: 6px 16px 16px; }
  .note-card { padding: 16px; }
  .ipa-grid { grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); }
  th, td { padding: 8px 10px; }
}

    </style>
  </head>

        <nav class="nav" id="nav"></nav>

        <div class="side-actions">
          <button class="mini mobile" id="closeMenu">Đóng</button>
        </div>
      </aside>
      <main>
        <header class="top">
          <div>
            <div class="eyebrow" id="eyebrow">Pre-IELTS · up to Lesson 15</div>

            <p class="sub" id="subtitle"></p>
          </div>
          <button class="mini mobile" id="menu">☰ Menu</button>
        </header>
        <div class="layout">
          <div class="page" id="content"></div>
          <aside class="rail" id="rail"></aside>
        </div>
      </main>

window.__DATA__ = {"docs":[{"id":"01-vowels","type":"pronunciation","title":"Vowels - Nguyên Âm","vi":"12 monophthongs + 8 diphthongs","lesson":"Lesson 1-2","priority":"High","file":"source/pronunciation/01-vowels.md","markdown":"# Vowels - Nguyên Âm\n\nTiếng Anh có **20 nguyên âm**: 12 monophthongs (nguyên âm đơn) và 8 diphthongs (nguyên âm đôi). Nguyên âm quyết định số âm tiết của từ.\n\n> [!tip] Cách học\n> Đọc theo cột \"Chính tả hay gặp\" để đoán âm khi nhìn từ mới, rồi kiểm tra lại bằng phiên âm. Không kéo dài âm tùy tiện — dựa vào ký hiệu IPA.\n\n## 01. Monophthongs - Nguyên Âm Đơn\n\n| Âm | Dài/Ngắn | Chính tả hay gặp | Ví dụ |\n|---|---|---|---|\n| /iː/ | dài | ea, ee, -y | tea, green, see, happy, family |\n| /ɪ/ | ngắn | i | sit, kiss, drink, sister, office |\n| /uː/ | dài | oo, ou, ue, ew | food, school, group, blue, flew |\n| /ʊ/ | ngắn | oo, u, ou | book, foot, good, put, should |\n| /e/ | ngắn | e | ten, red, bed, yellow, spell |\n| /æ/ | ngắn | a | hand, hat, dad, black, pants |\n| /ɑː/ | dài | ar | car, park, star, dark, backyard |\n| /ʌ/ | ngắn | u, o, ou | run, lunch, love, brother, young |\n| /ɔː/ | dài | or, al, aw | corn, ball, call, walk, draw, always |\n| /ɒ/ | ngắn | o | pot, shop, hop, box, lot |\n| /ɜː/ | dài | ir, ur, or, er | bird, girl, nurse, work, person |\n| /ə/ | ngắn (không nhấn) | nhiều cách | teacher, banana, doctor |\n\n> [!warn] Cặp dễ nhầm\n> - /iː/ (dài) vs /ɪ/ (ngắn): `sheep` vs `ship`.\n> - /e/ vs /æ/: `pen` vs `pan`, `men` vs `man`.\n> - /ɑː/ vs /ʌ/: `bar` vs `bus`, `car` vs `cup`.\n> - /ə/ luôn **không mang trọng âm**; đọc nhẹ và ngắn.\n\n## 02. Diphthongs - Nguyên Âm Đôi\n\nNguyên âm đôi là hai âm trượt vào nhau trong một hơi.\n\n| Âm | Chính tả hay gặp | Ví dụ |\n|---|---|---|\n| /ɪə/ | ea, ear, eer, ere | real, ear, dear, hear, year, beer, here |\n| /eɪ/ | a, ai, ay, ei/ea | make, cake, rain, train, day, play, eight, break |\n| /eə/ | are, air, ear, ere | care, square, air, chair, hair, wear, there, where |\n| /aʊ/ | ow, ou | how, now, down, loud, mouth, sound |\n| /ʊə/ | ure, oor, ou | sure, pure, cure, poor, tourist |\n| /ɔɪ/ | oi, oy | coin, point, voice, boy, enjoy, toy |\n| /aɪ/ | i/ie, y/uy, igh | like, time, tie, dry, buy, high, night |\n| /əʊ/ | o, ow, oa/oe | no, cold, home, go, know, low, boat, toe |\n\n## 03. Câu luyện đọc\n\n- This is my family. `/ðɪs ɪz maɪ ˈfæməli/`\n- Every morning, I have noodles for breakfast. `/ˈevri ˈmɔːnɪŋ aɪ hæv ˈnuːdlz fɔːr ˈbrekfəst/`\n- Today is a nice day. The sky is blue. `/təˈdeɪ ɪz ə naɪs deɪ ðə skaɪ ɪz bluː/`\n- I often do the gardening in my free time. `/aɪ ˈɒfən duː ðə ˈɡɑːdənɪŋ ɪn maɪ friː taɪm/`"},{"id":"02-consonants","type":"pronunciation","title":"Consonants - Phụ Âm","vi":"24 phụ âm và các cặp dễ nhầm","lesson":"Lesson 3-4","priority":"High","file":"source/pronunciation/02-consonants.md","markdown":"# Consonants - Phụ Âm\n\nTiếng Anh có **24 phụ âm**, chia thành 2 nhóm: **voiced (hữu thanh)** - dây thanh rung, và **unvoiced (vô thanh)** - dây thanh không rung. Nhiều phụ âm đi thành cặp cùng khẩu hình, chỉ khác rung/không rung.\n\n## 01. Các Cặp Vô Thanh - Hữu Thanh\n\n| Vô thanh | Hữu thanh | Ví dụ |\n|---|---|---|\n| /p/ | /b/ | pen / big, stop / tab |\n| /t/ | /d/ | tea / day, eat / food |\n| /k/ | /ɡ/ | car / go, back / bag |\n| /f/ | /v/ | fork / very, laugh / drive |\n| /s/ | /z/ | sit / zoo, bus / rose |\n| /ʃ/ | /ʒ/ | shop / measure, cash / vision |\n| /tʃ/ | /dʒ/ | chair / jam, watch / bridge |\n| /θ/ | /ð/ | think / this, math / mother |\n\n> [!tip] Mẹo phân biệt\n> Đặt tay lên cổ họng: âm **hữu thanh** làm cổ rung (/b/, /d/, /g/, /v/, /z/, /ð/); âm **vô thanh** thì không (/p/, /t/, /k/, /f/, /s/, /θ/).\n\n## 02. Chính Tả Hay Gặp\n\n| Âm | Chính tả | Ví dụ |\n|---|---|---|\n| /k/ | c, k, ck, ch | car, key, back, school, stomach |\n| /f/ | f, ff, ph, gh | fork, off, phone, laugh, cough |\n| /s/ | s, ss, c, sc | sit, class, city, science |\n| /z/ | s, z, ss, zz | easy, zoo, scissors, jazz |\n| /ʃ/ | sh, c/ch, ci/ti, s | shop, chef, delicious, special, sugar |\n| /ʒ/ | s, g | measure, television, garage, decision |\n| /tʃ/ | ch, t, tch | teacher, future, watch, kitchen |\n| /dʒ/ | j, g, ge, dge | jam, general, language, bridge |\n| /θ/ | th | think, thousand, math, birthday |\n| /ð/ | th | the, weather, mother, this, breathe |\n\n## 03. Các Phụ Âm Còn Lại\n\n| Âm | Chính tả | Ví dụ |\n|---|---|---|\n| /h/ | h | hair, house, help, behind |\n| /j/ | y, u, i | yes, yellow, use, university, opinion |\n| /m/ | m | map, mother, ham, moon |\n| /n/ | n | night, sun, banana, none |\n| /ŋ/ | ng | going, bring, singer, long, king |\n| /l/ | l, ll | love, life, ball, wall |\n| /r/ | r, wr | red, rice, write, wrong |\n| /w/ | w, wh | winter, woman, what, where, why |\n\n> [!warn] Minimal pairs dễ sai\n> - /ŋ/ vs /n/: `sing` /sɪŋ/ vs `sin` /sɪn/.\n> - /n/ vs /m/: `run` /rʌn/ vs `rum` /rʌm/, `sun` vs `sum`.\n> - /j/ vs /h/: `year` /jɪə/ vs `hear` /hɪə/.\n> - /juː/ vs /uː/: `you` /juː/ vs `zoo` /zuː/.\n\n## 04. Câu luyện đọc\n\n- I had a stomachache two days ago. `/aɪ hæd ə ˈstʌmək eɪk tuː deɪz əˈɡəʊ/`\n- My brother buys a lot of clothes. `/maɪ ˈbrʌðə baɪz ə lɒt ɒv kləʊðz/`\n- They take a deep breath, and then breathe out slowly. `/ðeɪ teɪk ə diːp breθ ænd ðen briːð aʊt ˈsləʊli/`\n- His mom makes lunch for him every Monday. `/hɪz mɒm meɪks lʌntʃ fɔː hɪm ˈevri ˈmʌndeɪ/`"},{"id":"03-reading-stress-time","type":"pronunciation","title":"Reading IPA, Stress & Time","vi":"Đọc phiên âm, trọng âm và cách nói giờ","lesson":"Lesson 5","priority":"High","file":"source/pronunciation/03-reading-stress-time.md","markdown":"# Reading IPA, Stress & Telling Time\n\n## 01. Quy Trình Đọc Phiên Âm\n\n1. **Xác định số âm tiết** = số nguyên âm trong từ.\n2. **Xác định trọng âm** (dấu `ˈ` đứng trước âm tiết được nhấn).\n3. **Thêm dấu cho từng âm tiết**: âm tiết nhấn đọc **to hơn, cao hơn, dài hơn**.\n4. **Đọc chậm rồi nhanh dần**, giữ nguyên khẩu hình từng âm.\n\n> [!tip] Ghi nhớ\n> Số âm tiết = số nguyên âm. Ví dụ `syllable` /ˈsɪ.lə.b(ə)l/ có 3 nguyên âm → 3 âm tiết.\n\n## 02. Trọng Âm - Stress\n\nÂm tiết mang trọng âm được đọc: **to hơn (louder), cao hơn (higher), dài hơn (longer)**. Các âm tiết còn lại thường đọc nhẹ và về âm /ə/.\n\nVí dụ đọc thử:\n\n- information `/ˌɪn.fəˈmeɪ.ʃən/`\n- technology `/tekˈnɒlədʒi/`\n- responsible `/rɪsˈpɒnsəbl/`\n- difficult `/ˈdɪfɪkəlt/`\n- optimistic `/ˌɒptɪˈmɪstɪk/`\n\n## 03. Hỏi Và Nói Giờ - Telling the Time\n\n### Cách hỏi giờ\n\n- Excuse me, what's the time?\n- What time is it now?\n- Do you have the time?\n- Can you tell me the time, please?\n\n### Cách nói giờ\n\n| Kiểu nói | Ý nghĩa | Ví dụ |\n|---|---|---|\n| ... o'clock | giờ tròn | 1:00 → one o'clock |\n| half past ... | rưỡi (30 phút) | 9:30 → half past nine |\n| a quarter past/after ... | hơn 15 phút | 7:15 → a quarter after seven |\n| a quarter to ... | kém 15 phút | 7:45 → a quarter to eight |\n| ... minutes past/after ... | hơn ... phút | 3:20 → twenty minutes after three |\n| ... minutes to ... | kém ... phút | 8:40 → twenty to nine |\n\n> [!warn] Lưu ý\n> - `to` = kém (giờ sắp tới), `past/after` = hơn (giờ đã qua).\n> - 12 am = midnight (nửa đêm), 12 pm = noon (giữa trưa)."},{"id":"04-collocations","type":"pronunciation","title":"Collocations theo âm (DC)","vi":"Cụm từ đi với DO/HAVE/GET/GO/TAKE/MAKE và say/tell/ask","lesson":"Lesson 2-5","priority":"Medium","file":"source/pronunciation/04-collocations.md","markdown":"# Collocations - Cụm Từ Thường Đi Cùng Nhau\n\nCác cụm từ này học được qua Daily Challenge của Lesson 2–5, gắn với các âm đang luyện. Học cả **nghĩa** lẫn **cách phát âm theo cụm** và lặp lại nhiều lần.\n\n## 01. DO / HAVE\n\n| DO + ... | HAVE + ... |\n|---|---|\n| do the housework | have breakfast / dinner |\n| do the washing up | have a shower |\n| do the gardening | have a party |\n| do some exercise | have a go |\n| do your best | have a look |\n| do a business with | have a haircut / have my hair cut |\n\n## 02. GET / GO\n\n| GET + ... | GO + ... |\n|---|---|\n| get up | go shopping |\n| get a job | go swimming |\n| get a taxi | go fishing |\n| get some exercise | go sightseeing |\n| get married | go for a walk |\n| get back from | go by motorbike |\n| get sick | go on foot |\n\n## 03. TAKE / MAKE\n\n| TAKE + ... | MAKE + ... |\n|---|---|\n| take a look | make a mistake |\n| take a bus | make some coffee |\n| take an exam | make noise |\n| take a photo | make an appointment |\n| take a break | make a bed |\n| take an umbrella | make dinner |\n\n## 04. SAY / TELL / ASK\n\n| Cấu trúc | Ví dụ |\n|---|---|\n| say + (that) ... | She said, \"This is wonderful.\" |\n| tell + sb + ... | Tell me when you go to school. |\n| ask + sb + a question | Can I ask you a question? |\n| ask + sb + to V | I ask you to make my bed. |\n| ask + sb + for + sth | She asks me for an umbrella. |\n\n## 05. Cấu Trúc Thời Gian Hữu Ích\n\n- `It takes + sb + time + to V`: It takes me 20 minutes to wash clothes.\n- `once / twice / three times + a week/month`: I play sports twice a week.\n- rarely / seldom / hardly = hiếm khi.\n- at + time (am/pm): at 7 am, at 9 pm."},{"id":"01-nouns-quantifiers","type":"grammar","title":"Nouns & Quantifiers","vi":"Danh từ, đếm được/không đếm được và lượng từ","lesson":"Lesson 6-7","priority":"High","file":"source/grammar/01-nouns-quantifiers.md","markdown":"# Nouns & Quantifiers - Danh Từ Và Lượng Từ\n\n## 01. Common vs Proper Nouns\n\n- **Common noun** (danh từ chung): người, con vật, nơi chốn, vật nói chung → teacher, cat, office.\n- **Proper noun** (danh từ riêng): tên riêng, **viết hoa** → Ms. Jane, Milo, LangGo, Bach Mai Hospital.\n\nVí dụ: `Ms. Maria` (P) is my `teacher` (C) at the `Dong Da School` (P).\n\n## 02. Số Ít / Số Nhiều Và Quy Tắc Thêm `-s`\n\n| Trường hợp | Quy tắc | Ví dụ |\n|---|---|---|\n| Danh từ số ít đếm được | cần `a/an/the` hoặc determiner | a doctor, my sister |\n| Thông thường | thêm `-s` | book → books |\n| Sau o, s, ss, ch, x, sh, z | thêm `-es` | bus → buses, watch → watches, quiz → quizzes |\n| Phụ âm + y | đổi `y → ies` | baby → babies |\n| Nguyên âm + y | chỉ thêm `s` | toy → toys, kidney → kidneys |\n| f/fe | thường đổi thành `ves` | wife → wives, leaf → leaves |\n| Bất quy tắc | học riêng | person → people, child → children, foot → feet, man → men, mouse → mice, sheep → sheep |\n\n### Danh từ luôn ở dạng số nhiều (a pair of ...)\n\nscissors, jeans, shorts, pants/trousers, shoes, sandals, sneakers, slippers, stockings.\n\n### Phát âm đuôi `-s/-es`\n\n- `/s/` sau âm vô thanh: parents, works, books.\n- `/z/` sau âm hữu thanh: babies, teachers, doctors, roads.\n- `/ɪz/` sau s, z, ʃ, tʃ, dʒ: buses, roses, dishes, watches, oranges.\n\n> [!warn] Bẫy thường gặp\n> - `foots` sai → `feet` đúng.\n> - `peoples` sai → `people` đúng.\n> - `an information` sai → `some information` đúng.\n\n## 03. Countable vs Uncountable Nouns\n\n| Countable (đếm được) | Uncountable (không đếm được) |\n|---|---|\n| dùng được với số đếm | không dùng số đếm |\n| có số ít và số nhiều | luôn đi với động từ số ít |\n| a book → two books | water, rice, sugar, salt |\n| a chair → three chairs | air, smoke, butter, bread, meat |\n| a doctor → five doctors | beauty, fear, information, knowledge, news |\n\nVới danh từ không đếm được, dùng đơn vị: `a piece of furniture`, `two pieces of information`.\n\n## 04. Quantifiers - Lượng Từ\n\n| Từ | Dùng với | Loại câu |\n|---|---|---|\n| some | không đếm được / số nhiều | khẳng định; lời mời (Would you like some coffee?) |\n| any | không đếm được / số nhiều | phủ định; câu hỏi |\n| a few | đếm được số nhiều | \"một vài\" (nghĩa tích cực) |\n| a little | không đếm được | \"một ít\" (nghĩa tích cực) |\n| many | đếm được số nhiều | phủ định / câu hỏi (How many...?) |\n| much | không đếm được | phủ định / câu hỏi (How much...?) |\n| a lot of | cả hai loại | khẳng định |\n\nVí dụ:\n\n- There are some students. / There is some water.\n- There aren't any oranges. / Is there any coffee?\n- There are a few students. / There is a little money.\n- There aren't many students. / There isn't much money.\n\n> [!warn] Bẫy thường gặp\n> - `much chairs` sai → `many chairs` đúng.\n> - `many money` sai → `much money` đúng.\n> - Không dùng `much` trong câu khẳng định → dùng `a lot of`.\n\n## 05. Mini Practice\n\n1. Do you have `some/any` close friends?\n2. There aren't `many/much` students in the room.\n3. She has `a few/a little` money.\n4. My mother wears `a/an` dress and has `a lot of/much` dresses."},{"id":"02-pronouns","type":"grammar","title":"Pronouns","vi":"Đại từ - nhân xưng, phản thân, chỉ định, nghi vấn","lesson":"Lesson 8","priority":"High","file":"source/grammar/02-pronouns.md","markdown":"# Pronouns - Đại Từ\n\nĐại từ dùng để **thay thế cho danh từ** (chung hoặc riêng), tránh lặp lại.\n\nVí dụ: *Mary is a teacher.* → ***She** is a teacher.*\n\n## 01. Personal & Reflexive Pronouns\n\n| Ngôi | Subject | Object | Reflexive |\n|---|---|---|---|\n| I | I | me | myself |\n| you | you | you | yourself |\n| he | he | him | himself |\n| she | she | her | herself |\n| it | it | it | itself |\n| we | we | us | ourselves |\n| you (số nhiều) | you | you | yourselves |\n| they | they | them | themselves |\n\n### Cách quyết định\n\n- Làm **chủ ngữ** (đứng trước động từ) → subject pronoun: *She is a teacher.*\n- **Nhận hành động** (sau động từ/giới từ) → object pronoun: *Everybody likes her.*\n- Chủ ngữ và tân ngữ **cùng một người**, hoặc \"tự mình làm\" → reflexive: *I bake the cake myself.* / *He saw himself in the mirror.*\n\n## 02. Demonstrative Pronouns - Đại Từ Chỉ Định\n\n| | Số ít | Số nhiều |\n|---|---|---|\n| Ở gần | this | these |\n| Ở xa | that | those |\n\nVí dụ: *This is an apple. Those are apples.*\n\n## 03. Interrogative Pronouns - Đại Từ Nghi Vấn\n\n`who, whom, whose, what, which` dùng để hỏi.\n\n- **Who** is he? (hỏi người - chủ ngữ)\n- **Whom** are you playing with? (hỏi người - tân ngữ)\n- **Whose** is this umbrella? (hỏi sở hữu)\n- **What** are you doing? (hỏi vật/việc)\n- **Which** do you prefer? (hỏi lựa chọn)\n\n## 04. Mini Practice\n\nĐiền đại từ phù hợp:\n\n1. My sister loves fashion. ______ often wears colorful dresses.\n2. That jacket looks great on you. Where did ______ buy it?\n3. My friends and I went shopping, and ______ bought some shirts.\n4. Tom looked at ______ in the mirror. (chính Tom)\n5. ______ is this bag? — It's mine."},{"id":"03-adjectives","type":"grammar","title":"Adjectives","vi":"Tính từ - vị trí, cấu tạo và thứ tự","lesson":"Lesson 9","priority":"High","file":"source/grammar/03-adjectives.md","markdown":"# Adjectives - Tính Từ\n\nTính từ là từ **miêu tả**, cho biết thêm về danh từ (a **smart** dog, a **tall** man).\n\n## 01. Vị Trí Của Tính Từ\n\n| Vị trí | Ví dụ |\n|---|---|\n| Trước danh từ | She is an **impatient** person. |\n| Sau động từ `to be` | Today is **wonderful**. |\n| Sau động từ giác quan (look, taste, smell, sound, feel) | The food smells **great**. |\n\n> [!warn] Bẫy thường gặp\n> Sau động từ giác quan dùng **tính từ**, không dùng trạng từ.\n> - `tastes freshly` sai → `tastes fresh` đúng.\n> - `smells greatly` sai → `smells great` đúng.\n\n## 02. Cấu Tạo Tính Từ - Suffix & Prefix\n\nNhiều tính từ được tạo bằng cách thêm đuôi (suffix) hoặc tiền tố (prefix).\n\n### Suffix thường gặp\n\n| Đuôi | Ví dụ |\n|---|---|\n| -able / -ible | drinkable, possible |\n| -ous | delicious, dangerous |\n| -ent / -ant | excellent, important |\n| -ful | careful, wonderful, helpful |\n| -less | careless, useless |\n| -y | tidy, messy |\n| -ic | artistic |\n| -ive | attractive |\n| -ly | lovely, friendly |\n| -ed / -ing | interested / interesting |\n\n### Prefix mang nghĩa phủ định\n\n`un-, im-, il-, in-, ir-, dis-, non-` → unhappy, impolite, illegal, incorrect, irregular, disloyal, dishonest.\n\n> [!warn] `-ed` vs `-ing`\n> - `-ed`: cảm xúc của người → *I am interested.*\n> - `-ing`: tính chất gây ra cảm xúc → *The lesson is interesting.*\n> - `The lesson was interested` sai → `interesting` đúng.\n\n## 03. Thứ Tự Tính Từ (OSASCOMP)\n\n**Opinion → Size → Age → Shape → Color → Origin → Material → Purpose**\n\nVí dụ: `long straight black hair`, `a small golden necklace`, `a big brown bag`.\n\n| Loại | Ví dụ |\n|---|---|\n| Opinion | beautiful, nice, friendly |\n| Size | tall, long, small, big |\n| Age | new, old, young, ancient |\n| Color | black, blue, brown |\n| Origin | French, Japanese |\n| Material | cotton, golden, wooden |\n\n## 04. Mini Practice\n\n1. She wears a ______ (blue / cotton) dress. → đúng thứ tự?\n2. The soup tastes ______ (good / well).\n3. The movie was ______ (bored / boring).\n4. Thêm suffix: care____, wonder____, friend____."},{"id":"04-articles-determiners","type":"grammar","title":"Articles & Determiners","vi":"Mạo từ và từ hạn định","lesson":"Lesson 10","priority":"High","file":"source/grammar/04-articles-determiners.md","markdown":"# Articles & Determiners - Mạo Từ Và Từ Hạn Định\n\nDeterminers đứng trước danh từ để xác định danh từ đó. Gồm: articles (a/an/the), possessive (my, your...), demonstrative (this/that...), numerals, ordinals, quantifiers.\n\n## 01. Articles - Mạo Từ\n\n| Trường hợp | Dùng | Ví dụ |\n|---|---|---|\n| Số ít đếm được, **chưa xác định** | a / an | I have a banana. / I have an apple. |\n| Đã xác định / duy nhất / đã nhắc đến | the | The house has a garden. / the coldest place in the world |\n| Nói **chung chung** (số nhiều / không đếm được) | không dùng article | I love cats. / Water is essential. |\n\n> [!tip] Chọn a hay an?\n> Dựa vào **âm đầu**, không phải chữ cái: a university /juː/, an hour /aʊə/, an old sofa.\n\n### Không dùng mạo từ với\n\n- Danh từ trừu tượng nói chung: *Love is more important than money.*\n- meals, languages, sports: *have breakfast, play tennis, speak English.*\n- Cụm place & time: *at home, next week, before breakfast.*\n\n## 02. Possessive Determiners\n\n`my, your, his, her, its, our, their` - đứng trước danh từ chỉ vật thuộc về ai.\n\nVí dụ: *My bedroom is painted white. / Their new house has 5 rooms.*\n\n## 03. Demonstrative Determiners\n\n| | Số ít | Số nhiều |\n|---|---|---|\n| Ở gần | this | these |\n| Ở xa | that | those |\n\nVí dụ: *This letter is hard to understand. / Those books are on the bookshelf.*\n\n> [!warn] Bẫy thường gặp\n> - Chọn `a/an` theo âm đầu, không theo chữ cái.\n> - Không dùng `the` cho danh từ số nhiều khi nói chung chung.\n> - Danh từ số ít đếm được **bắt buộc** có determiner.\n\n## 04. Mini Practice\n\nĐiền `a / an / the` hoặc bỏ trống:\n\n1. I live in ___ small house.\n2. My favorite room is ___ living room.\n3. There is ___ old sofa in ___ living room.\n4. I love ___ cats. (nói chung)\n5. She lives in ___ USA."},{"id":"05-prepositions","type":"grammar","title":"Prepositions","vi":"Giới từ chỉ vị trí, nơi chốn và thời gian","lesson":"Lesson 11","priority":"High","file":"source/grammar/05-prepositions.md","markdown":"# Prepositions - Giới Từ\n\nGiới từ nối một vật/việc với vật/việc khác, cho biết **quan hệ** giữa chúng. Thường theo sau bởi một **danh từ hoặc đại từ** và nói về **vị trí, nơi chốn hoặc thời gian**.\n\n## 01. Giới Từ Chỉ Vị Trí\n\n| Giới từ | Nghĩa | Ví dụ |\n|---|---|---|\n| next to / near | bên cạnh / gần | The wardrobe is next to the window. |\n| in front of | phía trước | The plant is in front of the sofa. |\n| behind | phía sau | The dress behind me is beautiful. |\n| between | ở giữa hai vật | The armchair is between the desk and the door. |\n| in the middle of | ở giữa (phòng) | The coffee table is in the middle of the room. |\n| in the corner | ở góc | The lamp is in the corner. |\n| on the left/right of | bên trái/phải của | The TV is on the left of the room. |\n| across from / opposite | đối diện | The door is opposite the plant. |\n| against the wall | dựa vào tường | The sofa is against the wall. |\n| above / under | phía trên / dưới | The lamp is above the bed. The mat is under the table. |\n| on | trên bề mặt | There is a book on the table. |\n\n## 02. IN / ON / AT\n\n### Chỉ thời gian\n\n| Giới từ | Dùng cho | Ví dụ |\n|---|---|---|\n| in | tháng, năm, mùa, buổi trong ngày | in April, in 2005, in winter, in the morning |\n| on | thứ, ngày tháng, buổi của một ngày cụ thể | on Saturday, on 19th March, on Monday morning |\n| at | giờ đồng hồ, dịp lễ | at ten o'clock, at Christmas |\n\n### Chỉ nơi chốn\n\n| Giới từ | Dùng cho | Ví dụ |\n|---|---|---|\n| in | địa điểm lớn: thành phố, quốc gia, phòng, tòa nhà | in Ha Noi, in Mexico, in the kitchen, in the hospital |\n| at | địa điểm nhỏ/cụ thể, địa chỉ, sự kiện | at the train station, at 132 London Road, at a party |\n| on | đảo, bề mặt, trang sách | on Long Beach island, on the wall, on page 23 |\n\n> [!tip] Vè nhớ in/on/at\n> IN năm, IN tháng, IN mùa; IN sáng chiều tối. Ngày thì ON, còn giờ phút thêm AT đằng trước.\n\n> [!warn] Bẫy thường gặp\n> - `in Monday` sai → `on Monday` đúng.\n> - `on 7 o'clock` sai → `at 7 o'clock` đúng.\n> - `at Hanoi` sai → `in Hanoi` đúng.\n> - **Không dùng giới từ** với tomorrow, yesterday, tomorrow morning, yesterday evening: *We're flying tomorrow afternoon.*\n\n## 03. Mini Practice\n\nĐiền `in/on/at` hoặc bỏ trống:\n\n1. We are going on a holiday ___ the 31st January.\n2. I am going to the hospital ___ tomorrow.\n3. They met David ___ Monday evening.\n4. You are leaving ___ 7 o'clock, right?\n5. ___ the morning, there are a lot of birds here."},{"id":"06-present-tenses","type":"grammar","title":"Present Tenses","vi":"Nhóm thì hiện tại","lesson":"Lesson 12","priority":"High","file":"source/grammar/06-present-tenses.md","markdown":"# Present Tenses - Nhóm Thì Hiện Tại\n\n## 00. Verb Là Gì?\n\nVerb (động từ) thường là **từ chỉ hành động** - cho biết người, vật đang làm gì: *read, sing, climb, go, listen.*\n\nMột số verb phrase hay gặp: `have breakfast, go shopping, do homework, make dinner, take a photo, get up, come home, bring an umbrella`.\n\n## 01. Present Simple - Hiện Tại Đơn\n\n### Khi nào dùng?\n\n- Sự thật hiển nhiên: *The sun rises in the East.*\n- Thói quen: *My father plays badminton every Tuesday.*\n- Lịch cố định, thời gian biểu: *Our train leaves at 9 am.*\n\n### Công thức\n\n| Dạng | To be | Verb |\n|---|---|---|\n| Khẳng định | S + am/is/are + N/adj | S + V(s/es) + O |\n| Phủ định | S + am/is/are + not | S + do/does + not + V1 |\n| Nghi vấn | Am/Is/Are + S? | Do/Does + S + V1? |\n\n### Dấu hiệu\n\n- Adverbs of frequency: always, usually, often, sometimes, rarely, never.\n- every day/week/month/year; once/twice/three times a week; on Mondays.\n\n> [!warn] Bẫy thường gặp\n> - `He work` sai → `He works` đúng (thêm s/es với he/she/it).\n> - `Does she works?` sai → `Does she work?` đúng.\n\n## 02. Present Continuous - Hiện Tại Tiếp Diễn\n\n### Khi nào dùng?\n\n- Hành động đang diễn ra lúc nói: *Jim is watching TV at the moment.*\n- Tình huống tạm thời: *I'm staying with a friend for a few days.*\n- Kế hoạch tương lai gần đã sắp xếp: *We are having a barbecue tonight.*\n- Thói quen gây khó chịu (với `always`): *She is always coming late.*\n\n### Công thức\n\n| Dạng | Công thức | Ví dụ |\n|---|---|---|\n| Khẳng định | S + am/is/are + V-ing | He is playing football. |\n| Phủ định | S + am/is/are + not + V-ing | He isn't playing football. |\n| Nghi vấn | Am/Is/Are + S + V-ing? | Is he playing football? |\n\n### Dấu hiệu\n\nnow, right now, at the moment, today, this week (nghĩa tạm thời), always (phàn nàn).\n\n## 03. Phân Biệt Nhanh\n\n| Present Simple | Present Continuous |\n|---|---|\n| Thói quen, sự thật, lịch cố định | Đang diễn ra, tạm thời, kế hoạch đã sắp xếp |\n| He comes from Vietnam. | She is reading now. |\n| The class starts at 8 am. | She is getting married next Tuesday. |\n| He often stays up late. | You are always staying up late! |\n\n## 04. Mini Practice\n\n1. She usually ______ (go) to school by bus.\n2. My parents ______ (make) dinner right now.\n3. What time ______ the movie ______ (begin)?\n4. He ______ always ______ (lose) his keys."},{"id":"07-past-tenses","type":"grammar","title":"Past Tenses","vi":"Nhóm thì quá khứ và động từ bất quy tắc","lesson":"Lesson 13","priority":"High","file":"source/grammar/07-past-tenses.md","markdown":"# Past Tenses - Nhóm Thì Quá Khứ\n\n## 01. Past Simple - Quá Khứ Đơn\n\n### Khi nào dùng?\n\n- Hành động đã hoàn thành trong quá khứ: *I visited Da Nang last year.*\n- Chuỗi hành động: *We arrived, caught a taxi and went to a restaurant.*\n- Thói quen trong quá khứ: *When I was young, I travelled every summer.*\n\n### Công thức\n\n| Dạng | To be | Verb |\n|---|---|---|\n| Khẳng định | S + was/were + N/adj | S + V2/ed + O |\n| Phủ định | S + was/were + not | S + did not + V1 |\n| Nghi vấn | Was/Were + S? | Did + S + V1? |\n\n### Dấu hiệu\n\nyesterday, last night/week/month/year, ... ago, in + năm, when I was young.\n\n> [!warn] Bẫy thường gặp\n> Sau `did/didn't`, động từ chính luôn ở dạng nguyên mẫu V1.\n> - `Did you went...?` sai → `Did you go...?` đúng.\n> - `I didn't went` sai → `I didn't go` đúng.\n\n## 02. Quy Tắc Thêm `-ed`\n\n| Kết thúc bằng | Quy tắc | Ví dụ |\n|---|---|---|\n| e | thêm `d` | like → liked, live → lived |\n| phụ âm + y | đổi `y → ied` | study → studied, carry → carried |\n| 1 nguyên âm + 1 phụ âm | gấp đôi phụ âm + `ed` | stop → stopped, plan → planned |\n| còn lại | thêm `ed` | wash → washed, play → played |\n\n## 03. Phát Âm Đuôi `-ed`\n\n| Đọc | Khi âm cuối là | Ví dụ |\n|---|---|---|\n| /t/ | âm vô thanh (trừ /t/): p, k, f, s, ʃ, tʃ, θ | stopped, walked, washed, watched, laughed |\n| /d/ | âm hữu thanh (trừ /d/): nguyên âm, b, g, v, z, m, n, ŋ, l, r | played, listened, lived, cried, planned |\n| /ɪd/ | âm /t/ hoặc /d/ | wanted, visited, needed, decided, started |\n\n> [!tip] Xác định theo âm cuối khi PHÁT ÂM, không phải chữ cái cuối khi viết\n> `liked` → âm cuối /k/ (vô thanh) → đọc /t/ → /laɪkt/.\n\n## 04. Past Continuous - Quá Khứ Tiếp Diễn\n\n### Khi nào dùng?\n\n- Hành động đang diễn ra tại một thời điểm trong quá khứ: *I was working in the garden at 7 am yesterday.*\n- Một hành động đang diễn ra thì hành động khác xen vào: *We were having dinner when he came home.* → `Past Continuous + when + Past Simple`.\n- Hai hành động song song: *While I was washing the dishes, my sister was taking a shower.* → `Past Continuous + while + Past Continuous`.\n\n### Công thức\n\n| Dạng | Công thức |\n|---|---|\n| Khẳng định | S + was/were + V-ing |\n| Phủ định | S + was/were + not + V-ing |\n| Nghi vấn | Was/Were + S + V-ing? |\n\nDấu hiệu: at that time/moment, at one o'clock, when, while.\n\n## 05. Động Từ Bất Quy Tắc Căn Bản (V1 → V2)\n\n| V1 | V2 | V1 | V2 |\n|---|---|---|---|\n| be | was/were | buy | bought |\n| become | became | catch | caught |\n| begin | began | come | came |\n| break | broke | do | did |\n| bring | brought | drink | drank |\n| build | built | eat | ate |\n| fall | fell | make | made |\n| feel | felt | meet | met |\n| find | found | pay | paid |\n| fly | flew | read | read (/red/) |\n| get | got | ride | rode |\n| give | gave | run | ran |\n| go | went | say | said |\n| have | had | see | saw |\n| hang | hung | sell | sold |\n| hear | heard | sing | sang |\n| keep | kept | sit | sat |\n| know | knew | sleep | slept |\n| leave | left | speak | spoke |\n| lose | lost | spend | spent |\n| mean | meant | stand | stood |\n| swim | swam | take | took |\n| tell | told | think | thought |\n| understand | understood | wear | wore |\n| wake | woke | win | won |\n| write | wrote | put/cut/cost | put/cut/cost |\n\n> [!tip] Học theo nhóm cho dễ nhớ\n> - Giữ nguyên: cut, put, cost, read (đọc /red/).\n> - Nhóm `-ought/-aught`: buy→bought, bring→brought, catch→caught, think→thought.\n> - Nhóm `-ent`: mean→meant, send→sent, spend→spent.\n> - Nhóm `-eft/-ept`: leave→left, keep→kept, feel→felt, sleep→slept.\n\n## 06. Mini Practice\n\n1. I ______ (visit) Da Nang last year.\n2. She ______ (cook) when I came home.\n3. They ______ (watch) TV while I ______ (study).\n4. Did you ______ (go) to school yesterday?"},{"id":"08-future-tenses","type":"grammar","title":"Future Tenses","vi":"Nhóm tương lai - will và be going to","lesson":"Lesson 14","priority":"High","file":"source/grammar/08-future-tenses.md","markdown":"# Future Tenses - Nhóm Tương Lai\n\n## 01. Future Simple - `will`\n\n### Khi nào dùng?\n\n- Quyết định ngay tại thời điểm nói: *Oh no, I forgot my passport! I will go back to get it.*\n- Dự đoán dựa trên ý kiến/kinh nghiệm (không có căn cứ hiện tại): *I think it will be hot there.*\n- Lời hứa, đề nghị, lời mời: *I will call you tonight. / Will you help me?*\n\n### Công thức\n\n| Dạng | Công thức | Ví dụ |\n|---|---|---|\n| Khẳng định | S + will + V1 | I will study tonight. |\n| Phủ định | S + will not / won't + V1 | They won't come. |\n| Nghi vấn | Will + S + V1? | Will you come tomorrow? |\n| WH | WH + will + S + V1? | Who will you go with? |\n\nDấu hiệu: tomorrow, next week, tonight, soon, in the future, I think..., probably, maybe.\n\n> [!warn] Sau `will` luôn dùng V1\n> `will went` sai, `will studies` sai. `will go`, `will study` đúng.\n\n## 02. Near Future - `be going to`\n\n### Khi nào dùng?\n\n- Kế hoạch/dự định **đã có từ trước**: *We're going to stay at the Grand Hotel.*\n- Dự đoán có **căn cứ hiện tại**: *Look at those clouds. It is going to rain.*\n\n### Công thức\n\n| Dạng | Công thức | Ví dụ |\n|---|---|---|\n| Khẳng định | S + am/is/are + going to + V1 | She is going to cook dinner. |\n| Phủ định | S + am/is/are + not + going to + V1 | We aren't going to travel. |\n| Nghi vấn | Am/Is/Are + S + going to + V1? | Are you going to buy the ticket? |\n\n> [!warn] Bẫy thường gặp\n> - `I going to travel` sai → `I am going to travel` đúng.\n> - Sau `going to` luôn dùng V1: `going to went` sai.\n\n## 03. Phân Biệt\n\n| Cấu trúc | Khi dùng | Ví dụ |\n|---|---|---|\n| will + V1 | quyết định tức thời; dự đoán theo ý kiến; hứa/mời | I will help you. / I think it will rain. |\n| be going to + V1 | kế hoạch đã có; dự đoán có căn cứ | I'm going to visit Da Lat. I've booked my flight. / Look! It's going to rain. |\n| Present Continuous | kế hoạch đã sắp xếp, có thời gian cụ thể | I am meeting my teacher at 7 pm. |\n\n## 04. Mini Practice\n\nĐiền `will` hoặc `be going to`:\n\n1. I think she ______ pass the exam.\n2. Look at those clouds. It ______ rain.\n3. We ______ visit Da Nang next month. We already have a plan.\n4. ______ you help me?"},{"id":"09-modal-verbs","type":"grammar","title":"Modal Verbs","vi":"Động từ khuyết thiếu","lesson":"Lesson 15","priority":"High","file":"source/grammar/09-modal-verbs.md","markdown":"# Modal Verbs - Động Từ Khuyết Thiếu\n\nModal verb là **trợ động từ** diễn tả: ability (khả năng), permission (xin phép), advice (lời khuyên), obligation (nghĩa vụ), possibility/probability (khả năng, suy đoán).\n\n## 01. Công Thức & Quy Tắc\n\n| Dạng | Công thức | Ví dụ |\n|---|---|---|\n| Khẳng định | S + modal + V1 | I can swim. |\n| Phủ định | S + modal + not + V1 | She can't come. |\n| Nghi vấn | Modal + S + V1? | May I come in? |\n\n> [!warn] Ghi nhớ quan trọng\n> - Modal chỉ có **một dạng**, không đổi theo chủ ngữ, không thêm `s/es`.\n> - Sau modal luôn là **động từ nguyên mẫu không `to`**.\n> - `She cans swim` sai. `She can to swim` sai. → `She can swim` đúng.\n\n## 02. Common Modal Verbs\n\n| Modal | Phủ định | Nghĩa chính |\n|---|---|---|\n| can | can't | có thể / biết làm gì |\n| could | couldn't | có thể (quá khứ) / xin phép lịch sự |\n| may | may not | có thể / xin phép trang trọng |\n| might | might not | có thể, không chắc |\n| will | won't | sẽ |\n| should | shouldn't | nên / không nên |\n| must | mustn't | phải / không được phép |\n\n## 03. Semi-Modals\n\n| Semi-modal | Cách dùng | Ví dụ |\n|---|---|---|\n| ought to | lời khuyên, chỉ một dạng (phủ định: ought not to) | You ought to try this dish. |\n| have to | nghĩa vụ do bên ngoài, chia theo chủ ngữ/thì | She has to work. / They had to wait. |\n| need to | điều cần thiết, nhẹ hơn must, chia theo chủ ngữ/thì | I need to practice more. |\n\n## 04. Cách Dùng Theo Chức Năng\n\n| Chức năng | Cấu trúc | Ví dụ |\n|---|---|---|\n| Ability | can (hiện tại), could (quá khứ), be able to (thì khác) | She can speak 2 languages. / Tom could read at two. / I will be able to speak fluently. |\n| Permission (xin phép) | May > Could > Can (lịch sự giảm dần) | May/Could/Can I go shopping? |\n| Permission (cho phép) | may, can | You may come in. / You can use my laptop. |\n| Advice | should, ought to | You should study every day. |\n| Obligation | must (người nói muốn), have to (bên ngoài bắt), need to (nhẹ hơn) | I must study tonight. / We have to attend 80% of classes. |\n| Probability | must (gần như chắc), can't/couldn't (không thể), may/might (có thể) | It must be Simon. / It can't be my mom. / It may rain. |\n\n## 05. Important Differences\n\n| Cấu trúc | Nghĩa | Ví dụ |\n|---|---|---|\n| mustn't | **không được phép / cấm** | You mustn't smoke here. |\n| don't have to | **không cần thiết** phải làm | You don't have to come tomorrow. |\n| don't need to / needn't | không cần làm | You needn't buy water. |\n\n> [!warn] Lỗi kinh điển\n> `mustn't` KHÔNG có nghĩa \"không cần\". \"Không cần phải làm\" là `don't have to` / `don't need to` / `needn't`.\n\n## 06. Mini Practice\n\nĐiền modal phù hợp (có thể dùng dạng phủ định):\n\n1. The restaurant was popular, so we ______ book a table. *(had to)*\n2. The soup was great — you ______ try it! *(should)*\n3. It ______ be the best pudding I've tasted. *(might)*\n4. Maybe we ______ order fried items next time. *(shouldn't)*\n5. The staff were kind; we ______ ask them anything. *(could)*"},{"id":"01-self","type":"speaking","title":"Self Introduction","vi":"Giới thiệu bản thân","lesson":"Lesson 1-9","priority":"High","file":"source/speaking/01-self.md","markdown":"# Self Introduction - Giới Thiệu Bản Thân\n\nĐiểm bắt đầu của lộ trình: giới thiệu tên, tuổi, quê, việc học/làm và sở thích.\n\n## 01. Câu Hỏi Thường Gặp\n\n**What is your name?**\n\n[[audio:1]]\n\n**How do you spell your name?**\n\n[[audio:2]]\n\n**Do you like your name?**\n\n[[audio:3]]\n\n**How old are you?**\n\n[[audio:4]]\n\n**When is your birthday?**\n\n[[audio:5]]\n\n## 02. Khung Trả Lời\n\n- My name is...\n- I am ... years old.\n- I am from...\n- I am a student. / I'm a first-year student at ... university.\n- In my free time, I like/enjoy...\n\nTừ vựng bậc học: a freshman, a sophomore, a junior, a senior; I'm in grade 12 / in my final year.\n\n## 03. Câu Hỏi Về Trường Lớp (Lesson 9)\n\n- What is your favourite subject at school?\n- Do you like your school? Why?\n- What do you usually do with your friends?\n\nGợi ý: *My favourite subject is English because it is useful and interesting. I like my school because the teachers are friendly and helpful.*\n\n## 04. Bài Mẫu Ngắn\n\nMy name is Khanh. I am a student and I am from Hanoi. In my free time, I enjoy listening to music and watching movies because they help me relax."},{"id":"02-job","type":"speaking","title":"Job","vi":"Công việc và nghề nghiệp mơ ước","lesson":"Lesson 7","priority":"High","file":"source/speaking/02-job.md","markdown":"# Job - Công Việc / Nghề Nghiệp Mơ Ước\n\n## 01. What is your dream job? Why?\n\n[[audio:12]]\n\n**Mẫu câu:**\n\n- I want to be/become a/an... / My dream is to become a/an...\n\n**Why?**\n\n- It is a good job for me because...\n- I like helping people. / I love working with kids.\n- It is hard work, but the pay is good. / It is a well-paid job.\n- I get to meet a lot of people. / I have a chance to visit lots of countries.\n\n## 02. What do you do? / What is your job?\n\n[[audio:10]]\n\n**Are you a student or do you work?**\n\n[[audio:11]]\n\n**Mẫu câu:**\n\n- I'm a/an ... at ...\n- I'm working as a/an ... at ...\n- I'm a first-year student at ... university.\n\n## 03. What do you like about your job?\n\n- I really like... / I like ... a lot.\n- I'm well-paid. / I love working with kids.\n- It is the people I work with. They are so nice.\n- I get to meet so many people.\n\n## 04. What do you dislike about your job?\n\n- The only trouble is...\n- I do the same thing every day. I'm really sick of it.\n- I don't like the long hours. / I'm on my feet all day.\n- The pay is not good. / I'm not well-paid.\n\n## 05. Cách Khác Diễn Tả Thích / Không Thích\n\n| Thích | Không thích |\n|---|---|\n| be into something | can't stand something |\n| have a passion for something | hate something |\n| be interested in something | not like something |\n| love working with... | be sick of something |\n\n## 06. Câu Hỏi Tương Tự\n\n- Do you want to become a/an ... in the future? Why?\n- What does your father/mother/brother/sister do?\n\n[[audio:38]]\n\n## 07. Bài Mẫu Ngắn\n\nMy dream is to become a teacher. It is a good job for me because I love working with kids. It is hard work, but I think it is meaningful."},{"id":"03-family","type":"speaking","title":"Family","vi":"Gia đình","lesson":"Lesson 9","priority":"High","file":"source/speaking/03-family.md","markdown":"# Family - Gia Đình\n\n## 01. Do you live in a big family?\n\n[[audio:37]]\n\n**Mẫu câu:**\n\n- No, I'm an only child. It's just me and my parents.\n- No, I live in a nuclear/small family with my parents and my younger sister.\n- Well, I come from quite a big family. I've got two brothers.\n\n## 02. How many people are there in your family?\n\n- There are four people in my family: my parents, my younger brother and me.\n\n## 03. Do you have any brothers/sisters/siblings?\n\n- I have one younger brother and two elder sisters.\n- I've got one younger brother and two elder sisters.\n\n## 04. What does he/she like? / What are your hobbies?\n\n[[audio:44]]\n\n**Mẫu câu:**\n\n- He/She is very interested in computers.\n- My sister is more interested in the arts. She likes music and loves to read.\n- My dad is really into sports and swimming.\n- I'm keen on movies and sports.\n\n## 05. Cấu Trúc Nói Về Sở Thích\n\n| Mẫu câu | Theo sau bằng | Ví dụ |\n|---|---|---|\n| like / love / enjoy | noun hoặc V-ing | I enjoy reading books. |\n| be interested in | noun hoặc V-ing | She is interested in music. |\n| be really into | noun hoặc V-ing | My dad is really into sports. |\n| be keen on | noun hoặc V-ing | I'm keen on movies. |\n\nMở rộng lý do: *because it is interesting / relaxing / good for health / it helps me relax.*\n\n## 06. Từ Vựng Cần Nhớ\n\n| English | Vietnamese |\n|---|---|\n| only child | con một |\n| nuclear family | gia đình hạt nhân |\n| big/large family | gia đình lớn |\n| younger brother/sister | em trai/em gái |\n| elder brother/sister | anh trai/chị gái |\n| siblings | anh chị em ruột |\n| parents | bố mẹ |"},{"id":"04-appearance","type":"speaking","title":"Appearance","vi":"Ngoại hình","lesson":"Lesson 8","priority":"High","file":"source/speaking/04-appearance.md","markdown":"# Appearance - Ngoại Hình\n\n## 01. Câu Hỏi Thường Gặp\n\n**What does he/she look like?**\n\n[[audio:39]]\n\n**What kind of hair does he/she have?**\n\n[[audio:40]]\n\n**What kinds of clothes does he/she often wear?**\n\n[[audio:41]]\n\n## 02. Age - Tuổi\n\n- He/She is almost 25, but doesn't look that old.\n- He/She is in his/her twenties/thirties/forties.\n- He/She is young / old / middle-aged.\n\n## 03. General Look - Ngoại Hình Chung\n\n`He/She is very + adjective`: handsome, pretty, beautiful, cute, good-looking, average-looking.\n\n## 04. Height, Weight & Build\n\n- He/She is not very tall, about ... centimeters. / of average height.\n- He/She weighs ... kilos.\n- He/She is quite slim / thin / overweight / chubby / well-built.\n\n## 05. Face & Hair\n\n- He/She has got dark/fair skin.\n- She has got long straight black hair. / He has got a beard/moustache.\n- He/She has got brown/blue eyes. / glasses.\n\nTừ vựng tóc: long, short, shoulder-length, straight, wavy, curly, black, brown, blonde.\n\n## 06. Clothes\n\n- He/She often wears... shirts, T-shirts, a pair of jeans, casual clothes.\n\n## 07. Bài Mẫu Ngắn\n\nMy father is in his forties. He is not very tall, but he is well-built. He has got short black hair and brown eyes. He often wears shirts and a pair of jeans."},{"id":"05-personality","type":"speaking","title":"Personality","vi":"Tính cách","lesson":"Lesson 10","priority":"High","file":"source/speaking/05-personality.md","markdown":"# Personality - Tính Cách\n\n## 01. What is he/she like?\n\n[[audio:42]]\n\n**Công thức:** `He/She is + adjective + explanation.`\n\n- He is really neat. He always keeps things tidy.\n- She is great to be with. She makes me laugh all the time.\n\n## 02. Gợi Ý Tính Cách Và Giải Thích\n\n| Tính cách | Giải thích mẫu |\n|---|---|\n| neat / organized | He always keeps things tidy. |\n| great to be with | She makes me laugh all the time. |\n| funny / easy-going | He always tells jokes. |\n| friendly and easy to talk to | She is easy to talk to. |\n| outgoing / sociable | He loves going out and meeting people. |\n| kind and generous | She loves giving things and expects nothing in return. |\n| shy / not very talkative | He doesn't talk much. |\n| serious | It is difficult to get him to laugh. |\n\n## 03. Is he/she friendly/talkative/humorous/generous?\n\n[[audio:43]]\n\n**Mức độ tính từ:**\n\n| Mức độ | Mẫu câu |\n|---|---|\n| Rất | He is really/so/very + adjective. |\n| Khá | He is quite/pretty/kind of + adjective. |\n| Phủ định | He is not + adjective + at all. |\n\n## 04. Ví Dụ Mẫu\n\nMy father is really neat. He always keeps things tidy. He is also great to be with because he makes me laugh all the time."},{"id":"06-house","type":"speaking","title":"House / Room","vi":"Nhà ở và phòng yêu thích","lesson":"Lesson 12","priority":"High","file":"source/speaking/06-house.md","markdown":"# House / Room - Nhà Ở Và Phòng Yêu Thích\n\n## 01. What is your house like? How many rooms?\n\n- Yes, my house is quite big. / No, my house is quite small.\n- It has five rooms: a living room, a kitchen, a bathroom and two bedrooms.\n\n## 02. What is your favorite room? Why?\n\n[[audio:45]]\n\n- My favorite room is the bedroom / living room / kitchen.\n\n| Phòng | Lý do |\n|---|---|\n| Bedroom | I feel free and comfortable; I can study, listen to music, watch films. |\n| Kitchen | I love cooking; I want to cook for my family. |\n| Living room | I can spend time with my family; we watch TV and have a chit-chat. |\n\n## 03. Can you describe your living room/bedroom/kitchen?\n\n[[audio:46]]\n\n- It is comfortable, but pretty small. / It is really big. / It is huge.\n- My room is painted in blue/white/pink.\n- There is a desk, a chair, a bed and a wardrobe.\n\n## 04. Dùng Giới Từ Tả Vị Trí Đồ Vật\n\n- My bed is in the middle of the room.\n- The table is next to the bed.\n- There are some pictures on the wall.\n\n## 05. Từ Vựng Cần Nhớ\n\n| English | Vietnamese |\n|---|---|\n| living room | phòng khách |\n| kitchen | nhà bếp |\n| bathroom | phòng tắm |\n| bedroom | phòng ngủ |\n| wardrobe | tủ quần áo |\n| comfortable | thoải mái |\n| huge | rất lớn |\n| in the middle of | ở giữa |\n| next to | bên cạnh |\n| on the wall | trên tường |"},{"id":"07-weekend","type":"speaking","title":"Weekend / Free time","vi":"Cuối tuần và thời gian rảnh","lesson":"Lesson 13","priority":"High","file":"source/speaking/07-weekend.md","markdown":"# Weekend / Free Time - Cuối Tuần Và Thời Gian Rảnh\n\n## 01. What do you often do on the weekend / in your free time?\n\n[[audio:13]]\n\n[[audio:14]]\n\n**Mẫu câu:** I often + V. / I don't do anything special. / I usually go away for the weekend.\n\n**Gợi ý hoạt động:** have a picnic, go to a disco, go out for dinner, see a movie / go to the cinema, go for coffee after class, go downtown, go shopping.\n\n## 02. Cách Diễn Tả Thích / Không Thích\n\n| Thích | Không thích |\n|---|---|\n| enjoy V-ing | can't stand something |\n| be into something | hate something |\n| have a passion for something | not like something |\n| be keen on / be crazy about | be sick of something |\n| be a big fan of | |\n\n## 03. Do you like sports? How often?\n\n[[audio:15]]\n\n**Từ vựng:** work out, get some exercise, take walks, go jogging, keep in great shape, get big muscles, be really good at something.\n\n**How often?** every day, always, usually, often, sometimes, once/twice/three times a week.\n\n**Phủ định:** I don't like exercising at all. / I don't like anything too energetic. / I don't like to sweat.\n\n## 04. Do you like watching movies?\n\n[[audio:16]]\n\n- Yes, watching movies is a good way to relax/chill out.\n- No, I often spend my free time reading books / listening to music / hanging out with friends.\n\n## 05. What kinds of movies / What is your favorite movie?\n\n[[audio:17]]\n\n[[audio:18]]\n\n- My favorite movie is... It is one of the best movies I've seen.\n- The story is interesting. The special effects are great. The soundtrack is excellent.\n- If you want a good laugh, you should see it. It is worth seeing.\n\n## 06. Do you like reading books / listening to music?\n\n- I'm interested in / really into reading books about animals/nature/culture.\n- I'm keen on / fond of listening to music.\n- I'm a big fan of... He has a great voice. He is also handsome/attractive."},{"id":"08-trip","type":"speaking","title":"Trip / Travelling","vi":"Du lịch - chuyến đi quá khứ và tương lai","lesson":"Lesson 13-14","priority":"High","file":"source/speaking/08-trip.md","markdown":"# Trip / Travelling - Du Lịch\n\n## 01. Do you love travelling? Why?\n\n- Yes, definitely, because I can relax, spend time with family and friends, learn new things and gain new experiences.\n- No, I don't, because I don't have enough time / travelling is expensive.\n\nUseful ideas: relax, spend time with family, learn new things, gain new experiences, enjoy beautiful scenery, try local food.\n\n## 02. Tell me about one trip you remember the most (QUÁ KHỨ)\n\nDùng **Past Simple**. Khung: went to → went with → went by → what you did → feeling.\n\n**Bài mẫu:**\n\nThe trip I remember the most is my trip to Hue, Da Nang, and Hoi An. I went there last year with my friends. We went there by plane, and it took us about one hour. We went sightseeing, enjoyed the local food, visited many beautiful places, and took a lot of photos. The trip was wonderful, and I had a great time. If I have a chance, I would love to visit again.\n\n**Useful expressions:** The trip I remember the most is... / We went there by... / It took us about... / We went sightseeing. / The trip was wonderful. / I had a great time.\n\n## 03. Describe a trip you would like to take in the future (TƯƠNG LAI)\n\nDùng **will / be going to**. Trả lời theo 5 câu hỏi khung:\n\n| Câu hỏi | Ý cần nói |\n|---|---|\n| Where would you like to go? Why? | Place |\n| Who will you go with? | People |\n| How will you get there? | Means of transport |\n| What will you do there? | Activities |\n| How will you feel about the trip? | Feelings |\n\n**Bài mẫu:**\n\nI want to talk about a trip I am going to take in the future. I want to go to Da Lat because I love its cool weather and beautiful nature. I am going to go with my best friends. We are going to travel by car because it is comfortable, and it will take us about 6 hours. When we arrive, we are going to check in a nice homestay, then explore the city. We are going to visit Xuan Huong Lake and take a lot of photos. We are also going to try local foods like hot pot. I think the food will be amazing! I won't try to visit too many places in one day because I want to enjoy the peaceful feeling. I hope we will make many good memories. I am really excited about this trip.\n\n## 04. Useful Vocabulary\n\n| English | Vietnamese |\n|---|---|\n| travel / trip | du lịch / chuyến đi |\n| sightseeing | tham quan |\n| local food | món ăn địa phương |\n| beautiful scenery | cảnh đẹp |\n| wonderful / fantastic | tuyệt vời |\n| peaceful | yên bình |\n| crowded | đông đúc |\n\n## 05. Useful Grammar\n\n- Present Simple, Simple Past (trip quá khứ), will / be going to (trip tương lai).\n- because...; and / also; If I have a chance, I would love to..."},{"id":"09-food-restaurant","type":"speaking","title":"Food & Restaurant","vi":"Đồ ăn thức uống và mô tả nhà hàng","lesson":"Lesson 15","priority":"High","file":"source/speaking/09-food-restaurant.md","markdown":"# Food & Restaurant - Đồ Ăn Và Nhà Hàng\n\nChủ đề của Lesson 15, đi cùng modal verbs. Dùng lại cấu trúc thích/không thích đã học.\n\n## 01. What are your favorite foods/drinks?\n\n- My favorite dish is...\n- I love eating/having ... for breakfast/lunch/dinner.\n- My comfort dish is...\n- I always eat...\n\n## 02. Are they good for you?\n\n- **Yes:** They are good for my health / they are healthy because they have a lot of vitamins/protein.\n- **No:** They are unhealthy because they contain a lot of oil, sugar and salt.\n\n## 03. Talk about a restaurant you went to\n\nDùng **Past Simple** + **modal verbs** (could / had to / should).\n\n### Where you went\n\n- I went to a seafood / steak / fast food restaurant with my family / friends / classmates.\n- It was near my hotel / in the city center, so we `could` walk / `had to` take a taxi to get there.\n\n### Why you went\n\n- We went there for dinner. / It was my birthday, so we wanted to celebrate. / We wanted to try something new.\n\n### What you ate\n\n- To start, we had soup / salad / bread.\n- The main dish was chicken rice / steak / seafood noodles.\n- For dessert, we had ice cream / fruit / cake.\n\n### The food & service\n\n- The food was tasty / delicious / fresh. My favorite dish was... You `should` try it if you visit!\n- The staff were kind, and we `could` ask them anything about the food. We `didn't have to` wait long.\n\n### What you didn't like\n\n- Unfortunately, it was too salty / a little oily. I had a stomachache afterwards.\n\n### Would you go again?\n\n- If I go back to that city, I `would` definitely eat there again! I `may` try other dishes next time.\n\n## 04. Bài Mẫu Ngắn\n\nLast weekend, I went to a seafood restaurant with my family. It was very popular, so we had to book a table. The main dish was grilled prawns with rice, and the spices were amazing. The staff were kind, and we could ask them anything about the food. It was a great experience — if I go back, I would definitely eat there again.\n\n## 05. Từ Vựng Cần Nhớ\n\n| English | Vietnamese |\n|---|---|\n| book a table | đặt bàn |\n| main dish | món chính |\n| for dessert | món tráng miệng |\n| tasty / delicious / fresh | ngon / ngon / tươi |\n| oily / salty | nhiều dầu / mặn |\n| the service | dịch vụ / phục vụ |"}],"meta":{"stageSub":"Mục tiêu giai đoạn hiện tại: học chắc nội dung đã học đến Lesson 15.","courseSub":"Bản đồ nguồn kiến thức Lesson 1–15, dùng để tra kiến thức đến từ đâu.","pronSub":"IPA cơ bản, trọng âm, âm cuối, các âm dễ nhầm và collocation theo âm (Lesson 1–5).","grammarSub":"Khái niệm → công thức → cách dùng → dấu hiệu → ví dụ → bẫy lỗi.","speakingSub":"Giữ nguyên ví dụ thật, thêm cách ngắt hơi và audio để luyện nói đúng, dễ thuộc.","reviewSub":"Ôn cho kỳ thi cuối: Phần 1 Speaking tất cả chủ đề, Phần 2 kiến thức đã học. Tích vào ô để lưu tiến độ.","stageTitle":"Giai đoạn hiện tại, chưa phải toàn bộ khóa","stageIntro":"Tài liệu này tổng hợp kiến thức đã học đến Lesson 15. Các lesson sau sẽ được bổ sung theo tiến độ học.","courseIntro":"Dùng để biết kiến thức đến từ lesson nào. Khi ôn, ưu tiên ôn theo topic trong Pronunciation/Grammar/Speaking.","reviewTitle":"Ôn tập cho kỳ thi cuối giai đoạn","reviewIntro":"Kỳ thi cuối gồm 2 phần: Speaking theo tất cả chủ đề đã học và kiến thức Grammar/Pronunciation. Tích ô đã ôn để theo dõi tiến độ.","goals":["Hoàn thành tốt giai đoạn Pre-IELTS hiện tại.","Học theo đúng giáo trình: không bỏ bài, không học vượt, không lan man ngoài nội dung đã học.","Hiểu kiến thức đã học, không chỉ nhớ đáp án; biết vì sao đúng và vì sao sai.","Ghi nhớ lâu dài bằng cách hệ thống hóa và liên kết giữa các lesson.","Ưu tiên xây nền: phát âm IPA, rồi grammar nouns → tenses → modal verbs.","Speaking đúng ngữ pháp, dùng cấu trúc đã học, dễ học thuộc, phù hợp A1–A2 trước.","Vocabulary học theo chủ đề và theo âm, ôn lại nhiều lần.","Làm được homework, review và bài kiểm tra cuối giai đoạn hiện tại."],"principles":[{"ti .pptx"},{"n":9,"title":"Adjectives + Family","focus":"Tính từ, suffix/prefix, thứ tự tính từ và nói về gia đình.","note":"Xem Grammar Foundation · Tính từ và Speaking Family.","source":"Lesson 9 - Pre-IELTS.pptx"},{"n":10,"title":"Determiners + Personality","focus":"Articles/determiners và mô tả tính cách.","note":"Xem Grammar Foundation · Articles và Speaking Personality.","source":"Lesson 10.pptx"},{"n":11,"title":"Prepositions","focus":"Prepositions of position, place and time.","note":"Đặc biệt in/on/at và vị trí đồ vật trong phòng.","source":"Lesson 11.pptx"},{"n":12,"title":"Present tenses + House","focus":"What is a verb, Present Simple, Present Continuous và Speaking House.","note":"Xem Grammar Present Tenses và Speaking House.","source":"Lesson 12.pptx"},{"n":13,"title":"Past tenses + Free time","focus":"Past Simple, Past Continuous, -ed, irregular verbs và Speaking Free time.","note":"Xem Grammar Past Tenses và Speaking Weekend.","source":"Lesson 13.pptx"},{"n":14,"title":"Future tenses + Trip","focus":"Future Simple, be going to và Speaking mô tả chuyến đi tương lai.","note":"Xem Grammar Future Tenses và Speaking Trip.","source":"Lesson 14.pptx"},{"n":15,"title":"Modal Verbs + Restaurant","focus":"Modal verbs (ability/permission/advice/obligation/probability) và Speaking Food & Restaurant.","note":"Xem Grammar Modal Verbs và Speaking Food & Restaurant.","source":"Lesson 15.pptx"}],"readGuide":[{"topic":"Job","text":"My dream is to become a teacher. / It is a good job for me / because I love working with kids.","stress":"dream, teacher, good job, love, kids","grammar":"want to become; because; Present Simple"},{"topic":"Family","text":"There are four people in my family: / my parents, / my younger brother / and me.","stress":"four people, family, parents, younger brother","grammar":"There are; possessive my"},{"topic":"Appearance","text":"My father is in his forties. / He is not very tall, / but he is well-built.","stress":"father, forties, not very tall, well-built","grammar":"be + adjective; but"},{"topic":"House","text":"My favorite room is my bedroom / because I feel free and comfortable there.","stress":"favorite room, bedroom, free, comfortable","grammar":"be + noun; because"},{"topic":"Weekend","text":"On the weekend, / I often go out for coffee / with my friends.","stress":"weekend, often, coffee, friends","grammar":"Present Simple; adverb of frequency"},{"topic":"Trip (past)","text":"The trip I remember the most / is my trip to Hue, Da Nang, and Hoi An.","stress":"trip, remember, Hue, Da Nang, Hoi An","grammar":"Past Simple setup"},{"topic":"Trip (future)","text":"I am going to go with my best friends. / We are going to travel by car.","stress":"going to, best friends, travel, car","grammar":"be going to; will"},{"topic":"Restaurant","text":"Last weekend, / I went to a seafood restaurant / with my family.","stress":"last weekend, seafood restaurant, family","grammar":"Past Simple; modal verbs"}],"review":[{"title":"Pronunciation Review","ordered":true,"items":["20 vowels: 12 monophthongs + 8 diphthongs.","24 consonants, chú ý cặp vô thanh/hữu thanh.","Âm tiết = số nguyên âm; trọng âm: to hơn, cao hơn, dài hơn.","-s/-es: `/s/`, `/z/`, `/ɪz/`. -ed: `/t/`, `/d/`, `/ɪd/`.","Không nuốt âm cuối khi nói."]},{"title":"Grammar Review","ordered":true,"items":["Foundation: nouns, quantifiers, pronouns, adjectives, articles, prepositions.","Present: Present Simple vs Present Continuous.","Past: Past Simple, Past Continuous, irregular verbs, -ed pronunciation.","Future: will vs be going to.","Modal verbs: can/could, may/might, should/ought to, must/have to/need to."]},{"title":"Speaking Review","ordered":true,"items":["Bản thân, Công việc.","Gia đình, Ngoại hình, Tính cách.","House / Room.","Weekend / Free time.","Trip (quá khứ và tương lai).","Food & Restaurant."]},{"title":"Common Mistake Review","ordered":false,"items":["Quên `s/es` với he/she/it.","Sau `did/didn't` vẫn dùng V2.","Nhầm `many/much`, `a few/a little`.", _.wav"},{"num":45,"topic":"House / Room","title":"What is your favorite room in your house?","file":"audio/45. What is your favorite room in your house_.wav"},{"num":46,"topic":"House / Room","title":"Can you describe your living room/bedroom/kitchen?","file":"audio/46. Can you describe your living room_bedroom_kitchen_.wav"}],"ipa":{"monophthongs":[{"ipa":"iː","word":"tea","vi":"dài","spell":"ea, ee, -y"},{"ipa":"ɪ","word":"sit","vi":"ngắn","spell":"i"},{"ipa":"uː","word":"food","vi":"dài","spell":"oo, ou, ue"},{"ipa":"ʊ","word":"book","vi":"ngắn","spell":"oo, u, ou"},{"ipa":"e","word":"ten","vi":"ngắn","spell":"e"},{"ipa":"æ","word":"hat","vi":"ngắn","spell":"a"},{"ipa":"ɑː","word":"car","vi":"dài","spell":"ar"},{"ipa":"ʌ","word":"cup","vi":"ngắn","spell":"u, o, ou"},{"ipa":"ɔː","word":"ball","vi":"dài","spell":"or, al, aw"},{"ipa":"ɒ","word":"hot","vi":"ngắn","spell":"o"},{"ipa":"ɜː","word":"bird","vi":"dài","spell":"ir, ur, er"},{"ipa":"ə","word":"teacher","vi":"không nhấn","spell":"nhiều cách"}],"diphthongs":[{"ipa":"ɪə","word":"ear","spell":"ea, ear, eer, ere"},{"ipa":"eɪ","word":"cake","spell":"a, ai, ay"},{"ipa":"eə","word":"hair","spell":"are, air, ear"},{"ipa":"aʊ","word":"house","spell":"ow, ou"},{"ipa":"ʊə","word":"tourist","spell":"ure, oor, ou"},{"ipa":"ɔɪ","word":"boy","spell":"oi, oy"},{"ipa":"aɪ","word":"five","spell":"i, y, igh"},{"ipa":"əʊ","word":"home","spell":"o, ow, oa"}],"consonants":[{"ipa":"p","word":"pen","voiced":false},{"ipa":"b","word":"big","voiced":true},{"ipa":"t","word":"tea","voiced":false},{"ipa":"d","word":"day","voiced":true},{"ipa":"k","word":"car","voiced":false},{"ipa":"ɡ","word":"go","voiced":true},{"ipa":"f","word":"fork","voiced":false},{"ipa":"v","word":"very","voiced":true},{"ipa":"θ","word":"think","voiced":false},{"ipa":"ð","word":"this","voiced":true},{"ipa":"s","word":"sit","voiced":false},{"ipa":"z","word":"zoo","voiced":true},{"ipa":"ʃ","word":"shop","voiced":false},{"ipa":"ʒ","word":"vision","voiced":true},{"ipa":
