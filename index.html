    <script>
/* ================================================================
 * app.js - Shell + Notes (Stage/Course/Pronunciation/Grammar/Speaking/Final)
 *
 * Publishes shared state + helpers on `window.APP` so that daily.js /
 * topics.js / practice.js (concat'd after this file by build.mjs) can
 * register additional NAV entries + renderers without touching the
 * shell. All modules run inside their own IIFE but read/write the
 * same window.APP object.
 * ================================================================ */
(function bootApp() {
  const DATA = window.__DATA__ || {};
  const DOCS = DATA.docs || [];
  const AUDIO = DATA.audio || [];
  const IPA = DATA.ipa || {};
  const M = DATA.meta || {};

  const APP = window.APP = {
    state: { page: "stage", opts: {} },
    data: {
      docs: DOCS,
      audio: AUDIO,
      ipa: IPA,
      meta: M,
      dailyIndex: DATA.dailyIndex || [],
      topicsIndex: DATA.topicsIndex || { topics: {}, order: [] },
      presets: DATA.presets || [],
      speakingQuestions: DATA.speakingQuestions || {},
      topicLabels: DATA.topicLabels || {}
    },
    NAV: [],
    TITLE: {},
    SUB: {},
    EYEBROW: {},
    renderers: {},
    wirers: {},
    helpers: {}
  };

  /* ============== Utilities ============== */
  const el = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (m) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
  const inline = (s) =>
    esc(s)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const slug = (s) =>
    String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 80);

  /* ============== Speech + dictionary ============== */
  let VOICES = [];
  function loadVoices() { VOICES = (window.speechSynthesis ? speechSynthesis.getVoices() : []) || []; }
  if (window.speechSynthesis) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
  function enVoices() { return VOICES.filter((v) => /^en/i.test(v.lang)); }
  function pickVoice() {
    const sel = el("voiceSel");
    const list = enVoices();
    if (sel && sel.value) { const f = list.find((v) => v.name === sel.value); if (f) return f; }
    return list[0] || null;
  }
  function speak(text) {
    if (!window.speechSynthesis) return false;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice(); if (v) u.voice = v;
    u.lang = "en-US";
    const r = el("rateSel"); u.rate = r ? parseFloat(r.value) : 0.9;
    speechSynthesis.speak(u);
    return true;
  }
  async function dictLookup(word) {
    try {
      const res = await fetch("https://api.dictionaryapi.dev/api/v2/entries/en/" + encodeURIComponent(word), { cache: "force-cache" });
      if (!res.ok) return null;
      const j = await res.json();
      const entry = j[0] || {};
      const ph = entry.phonetics || [];
      const audio = ph.map((p) => p.audio).filter(Boolean)[0] || "";
      const ipa = entry.phonetic || ph.map((p) => p.text).filter(Boolean)[0] || "";
      return { ipa, audio };
    } catch (e) { return null; }
  }
  const audioEl = new Audio();
  function playUrl(url) { try { audioEl.src = url; audioEl.play(); return true; } catch (e) { return false; } }

  /* ============== Audio bank (Speaking notes) ============== */
  const audioById = (n) => AUDIO.find((a) => String(a.num) === String(n));
  const audioHtml = (a) => a
    ? '<div class="inline-audio"><span class="audio-title">🎧 Audio trung tâm: ' + esc(a.title) +
      '</span><audio controls preload="none" src="' + esc(a.file) + '"></audio></div>'
    : "";

  /* ============== Markdown ============== */
  function mdToHtml(md) {
    const lines = md.split(/\r?\n/); const out = []; let i = 0;
    function table() {
      const rows = [];
      while (i < lines.length && /^\|.*\|\s*$/.test(lines[i])) rows.push(lines[i++]);
      if (rows.length < 2) return;
      const cells = (r) => r.split("|").slice(1, -1).map((x) => x.trim());
      const head = cells(rows[0]); const body = rows.slice(2).map(cells);
      out.push('<div class="table-wrap"><table><thead><tr>' + head.map((h) => `<th>${inline(h)}</th>`).join("") +
        "</tr></thead><tbody>" + body.map((r) => "<tr>" + r.map((c) => `<td>${inline(c)}</td>`).join("") + "</tr>").join("") + "</tbody></table></div>");
    }
    function list(ordered) {
      const items = []; const re = ordered ? /^\d+\.\s+(.+)/ : /^[-*]\s+(.+)/;
      while (i < lines.length && re.test(lines[i])) items.push(lines[i++].replace(re, "$1"));
      const tag = ordered ? "ol" : "ul";
      out.push(`<${tag}>` + items.map((x) => `<li>${inline(x)}</li>`).join("") + `</${tag}>`);
    }
    function blockquote() {
      const buf = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ""));
      let kind = "tip", title = "";
      const head = buf[0] && buf[0].match(/^\[!(warn|tip)\]\s*(.*)$/i);
      if (head) { kind = head[1].toLowerCase(); title = head[2]; buf.shift(); }
      out.push(`<div class="callout ${kind}">` + (title ? `<b>${inline(title)}</b>` : "") + mdToHtml(buf.join("\n")) + "</div>");
    }
    while (i < lines.length) {
      const line = lines[i];
      if (!line.trim()) { i++; continue; }
      const au = line.match(/^\[\[audio:(\d+)\]\]\s*$/);
      if (au) { out.push(audioHtml(audioById(au[1]))); i++; continue; }
      if (/^>\s?/.test(line)) { blockquote(); continue; }
      if (/^\|.*\|\s*$/.test(line)) { table(); continue; }
      const h = line.match(/^(#{1,4})\s+(.+)/);
      if (h) { const lv = h[1].length; out.push(`<h${lv} id="${slug(h[2])}">${inline(h[2])}</h${lv}>`); i++; continue; }
      if (/^\d+\.\s+/.test(line)) { list(true); continue; }
      if (/^[-*]\s+/.test(line)) { list(false); continue; }
      const paras = [];
      while (i < lines.length && lines[i].trim() && !/^(#{1,4})\s+/.test(lines[i]) && !/^\|.*\|\s*$/.test(lines[i]) &&
        !/^[-*]\s+/.test(lines[i]) && !/^\d+\.\s+/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !/^\[\[audio:\d+\]\]/.test(lines[i]))
        paras.push(lines[i++]);
      out.push(`<p>${inline(paras.join(" "))}</p>`);
    }
    return out.join("\n");
  }

  /* ============== Notes helpers ============== */
  const skillLabel = { pronunciation: "Pronunciation", grammar: "Grammar", speaking: "Speaking" };
  function badges(doc) {
    let b = `<span class="badge skill">${skillLabel[doc.type] || doc.type}</span>`;
    if (doc.lesson) b += `<span class="badge lesson">${esc(doc.lesson)}</span>`;
    if (/high/i.test(doc.priority)) b += `<span class="badge hi">Ưu tiên cao</span>`;
    return `<div class="badges">${b}</div>`;
  }
  function docSection(doc) {
    return `<article class="note-section searchable" id="doc-${doc.id}">${badges(doc)}<div class="note-content">${mdToHtml(doc.markdown)}</div>` +
      `<div class="source">Nguồn: ${esc(doc.file)}</div></article>`;
  }
  function chips(type) {
    const list = DOCS.filter((d) => d.type === type);
    if (!list.length) return "";
    return `<div class="chips">` + list.map((d) => `<button class="chip" data-goto="doc-${d.id}">${esc(d.title)}</button>`).join("") + `</div>`;
  }
  function heroOf(tag, title, text) {
    return `<section class="hero"><span class="tag">${esc(tag)}</span><h2>${esc(title)}</h2><p>${esc(text)}</p></section>`;
  }

  /* ============== Notes pages ============== */
  function stagePage() {
    const goals = (M.goals || []).map((g) => `<li>${esc(g)}</li>`).join("");
    const pr = (M.principles || []).map((p) => `<article class="note-card searchable"><h2>${esc(p.title)}</h2><p>${esc(p.text)}</p></article>`).join("");
    return heroOf("Đã học đến Lesson 15", M.stageTitle || "", M.stageIntro || "") +
      `<section class="note-card"><h2>Mục tiêu giai đoạn hiện tại</h2><ol>${goals}</ol></section>` +
      `<section class="note-grid">${pr}</section>`;
  }
  function coursePage() {
    const rows = (M.lessons || []).map((l) =>
      `<article class="course-row searchable"><div class="lesson-no">${l.n}</div><div><span class="tag">Lesson ${l.n}</span>` +

/* ================================================================
 * daily.js - Daily Practice · By Lesson
 *
 * Registers 2 pages: `daily` (16-card index) and `daily-lesson`
 * (per-lesson detail with 3 tabs: Study / Exercises / Flashcard).
 * Lazy-loads dist/daily/lesson-XX.js on demand and caches into
 * window.__DAILY__[key]. Works with file:// (no fetch, uses
 * <script src=…> injection).
 * ================================================================ */
(function bootDaily() {
  const APP = window.APP;
  if (!APP) { console.error("daily.js: APP not initialized"); return; }
  const { esc, slug, mdToHtml } = APP.helpers;

  APP.NAV.push(["daily", "Daily · Lesson", "📅"]);
  APP.TITLE.daily = "Daily Practice · Theo Lesson";
  APP.TITLE["daily-lesson"] = "Daily · Lesson";
  APP.SUB.daily = "16 challenge sets từ giáo trình (Lesson 1–15 + Break)";
  APP.SUB["daily-lesson"] = "";
  APP.EYEBROW.daily = "Daily · By Lesson";
  APP.EYEBROW["daily-lesson"] = "Daily · By Lesson";

  /* ============== Lazy loader ============== */
  window.__DAILY__ = window.__DAILY__ || {};
  const dailyCache = {};
  const pending = {};
  function loadDailyLesson(key) {
    if (dailyCache[key]) return Promise.resolve(dailyCache[key]);
    if (window.__DAILY__[key]) { dailyCache[key] = window.__DAILY__[key]; return Promise.resolve(dailyCache[key]); }
    if (pending[key]) return pending[key];
    pending[key] = new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = `dist/daily/${key}.js`;
      s.onload = () => {
        const data = window.__DAILY__[key];
        if (!data) { reject(new Error(`No data for ${key} after load`)); return; }
        dailyCache[key] = data;
        resolve(data);
      };
      s.onerror = () => reject(new Error(`Failed to load dist/daily/${key}.js`));
      document.head.appendChild(s);
    });
    // Clear the pending slot after settle so a failed load can be retried
    // by a subsequent call (previous behaviour re-served the rejected promise).
    pending[key].catch(() => {}).finally(() => { delete pending[key]; });
    return pending[key];
  }
  APP.loadDailyLesson = loadDailyLesson;

  /* ============== Daily index page ============== */
  function dailyIndexPage() {
    const idx = APP.data.dailyIndex || [];
    if (!idx.length) {
      return `<section class="hero"><span class="tag">Daily</span><h2>Chưa có dữ liệu daily</h2>
        <p>Chạy <code>npm run build</code> để normalize <code>source/daily/*</code>.</p></section>`;
    }

      const pct = l.correctRate != null ? Math.round(l.correctRate * 100) : null;

        : `<span class="mini-bar-label muted">Chưa chấm</span>`;

      return `<article class="daily-card searchable" data-key="${esc(l.key)}">
        <div class="daily-card-head"><span class="daily-no">${esc(l.number || "•")}</span>

          <button class="btn" data-open="${esc(l.key)}">Mở lesson →</button>
        </div>
      </article>`;
    }).join("");
    return `<section class="hero daily-hero"><span class="tag">16 lessons</span>
      <h2>Daily Practice · Theo Lesson</h2>
      <p>Bài tập daily từ LangGo, đã chuẩn hóa. Bấm vào lesson để xem nội dung + đề + đáp án + flashcard.</p></section>

  /* ---------- Exercises renderer ---------- */
  function renderExercises(data) {
    const groups = data.exerciseGroups || [{ id: "all", title: "Tất cả", questions: data.questions || [] }];
    if (!groups.length) return `<p class="muted">Lesson này không có exercise.</p>`;

      ? `<details class="explain-details fill-legend"><summary>Danh sách đáp án (${blanks.length})</summary>${
          blanks.map((b, i) =>
            `<div class="qblank"><span class="qblank-idx">${i + 1}.</span> <code>${esc((b.answers || []).join(" / "))}</code></div>`
          ).join("")
        }</details>`
      : "";
    if (q.bodyHtml) {
      const hydrated = hydrateBlankSlots(q.bodyHtml, blanks);
      return `<div class="fill-body">${hydrated}</div>${legend}`;
    }
    // Fallback: no answerTemplate → fall back to the numbered accepted-answer list only.
    if (!blanks.length) return "";
    return `<div class="qblanks-label muted">Đáp án đúng:</div>` +
      blanks.map((b, i) =>
        `<div class="qblank"><span class="qblank-idx">${i + 1}.</span> <code>${esc((b.answers || []).join(" / "))}</code>${b.explanationHtml ? `<div class="qblank-explain">${b.explanationHtml}</div>` : ""}</div>`
      ).join("");
  }
  APP.helpers.hydrateBlankSlots = hydrateBlankSlots;
  APP.helpers.renderFillBlankReview = renderFillBlankReview;

  function renderQuestion(q) {
    const audios = (q.audioRefs || []).map(audioRefHtml).join("");
    const imgs = (q.imageRefs || []).map((r) => `<figure class="ex-img"><img loading="lazy" src="${esc(r.localFile || r.url)}" alt=""></figure>`).join("");
    const topics = (q.topics || []).map(topicBadge).join("");

    if (q.kind === "info") {
      const hasBody = (q.promptHtml && q.promptHtml.trim()) || (q.prompt && q.prompt.trim()) || (q.explanationHtml && q.explanationHtml.trim()) || imgs || audios;
      if (!hasBody) return "";
      const explainInfo = q.explanationHtml ? `<div class="qinfo-explain">${q.explanationHtml}</div>` : "";
      return `<article class="qcard qcard-info searchable" id="q-${esc(q.id)}">
        <div class="block-badges">${topics}<span class="qtype-badge">info</span></div>
        <div class="qprompt">${q.promptHtml || esc(q.prompt || "")}</div>
        ${imgs}
        ${audios ? `<div class="block-audios">${audios}</div>` : ""}
        ${explainInfo}
      </article>`;
    }

    let answerBlock = "";
    switch (q.kind) {
      case "single_choice":
      case "multi_select": {
        const opts = (q.options || []).map((o) => {
          const isCorrect = q.correctAnswer && q.correctAnswer.includes(o.id);
          const isUser = q.userAnswer && q.userAnswer.includes(o.id);
          const cls = isCorrect ? "qopt correct" : (isUser ? "qopt wrong" : "qopt");
          const tag = isCorrect ? "<span class='qopt-tag'>✓ đáp án đúng</span>" : (isUser ? "<span class='qopt-tag'>× bạn đã chọn</span>" : "");
          return `<li class="${cls}">${o.html || esc(o.text || "")}${tag}</li>`;
        }).join("");
        answerBlock = opts ? `<ul class="qopts">${opts}</ul>` : "";
        break;
      }
      case "fill_blank": {
        answerBlock = renderFillBlankReview(q);
        break;
      }
      case "matching": {
        const pairs = q.pairs || [];
        if (!pairs.length) {
          answerBlock = `<div class="qopen muted">Không có dữ liệu ghép cặp cho câu này.</div>`;
          break;
        }
        const rows = pairs.map((p) =>
          `<tr><td>${esc(p.left || "")}</td><td>${esc(p.right || "")}</td></tr>`).join("");
        answerBlock = `<table class="qmatch"><thead><tr><th>Word</th><th>Meaning</th></tr></thead><tbody>${rows}</tbody></table>`;
        break;
      }
      case "open_or_video":
      default: {
        const ua = q.userAnswer;
        if (typeof ua === "string") {
          const isUrl = /^https?:/.test(ua);
          answerBlock = `<div class="qopen"><b>Đã nộp:</b> ${isUrl ? `<a href="${esc(ua)}" target="_blank" rel="noopener">${esc(ua)}</a>` : esc(ua)}</div>`;
        } else if (Array.isArray(ua)) {
          answerBlock = `<div class="qopen"><b>Đã nộp:</b><ul>${ua.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>`;
        } else {
          answerBlock = `<div class="qopen muted">Yêu cầu tự soạn (video / text).</div>`;
        }
      }
    }
    const explain = q.explanationHtml ? `<details class="explain-details"><summary>Giải thích</summary>${q.explanationHtml}</details>` : "";
    return `<article class="qcard searchable" id="q-${esc(q.id)}">
      <div class="block-badges">${topics}<span class="qtype-badge">${esc(q.kind || "?")}</span>${q.correct === true ? "<span class='q-ok'>✓ đúng</span>" : (q.correct === false ? "<span class='q-bad'>× sai</span>" : "")}</div>
      <div class="qprompt">${q.promptHtml || esc(q.prompt || "")}</div>
      ${imgs}
      ${audios ? `<div class="block-audios">${audios}</div>` : ""}
      ${answerBlock}
      ${explain}
    </article>`;
  }

  /* ---------- Flashcard renderer ---------- */
  function buildDeck(data) {
    const cards = [];
    (data.audio || []).forEach((a) => {
      if (!a.script) return;
      cards.push({ id: "au-" + a.id, front: a.script, back: audioRefHtml(a), kind: "audio" });
    });
    (data.vocabPairs || []).forEach((p, i) => {
      cards.push({ id: "vp-" + i, front: p.term, back: `<div class="fc-meaning">${esc(p.meaning || "")}</div>`, kind: "vocab" });
    });
    return cards;
  }
  function renderFlashcard(data, lessonKey) {
    const deck = buildDeck(data);
    if (!deck.length) return `<p class="muted">Chưa có material cho flashcard (thiếu script + vocab pairs).</p>`;
    return `<div class="flashcard-wrap" data-lesson="${esc(lessonKey)}" data-total="${deck.length}">
      <div class="fc-progress">Thẻ <span class="fc-cur">1</span>/${deck.length} · <span class="fc-known">0</span> đã thuộc</div>
      <div class="flashcard" tabindex="0">
        <div class="fc-face fc-front"></div>
        <div class="fc-face fc-back" hidden></div>
      </div>
      <div class="fc-controls">
        <button class="btn ghost" data-fc="prev">← Prev</button>
        <button class="btn" data-fc="flip">Lật thẻ (Space)</button>
        <button class="btn ghost" data-fc="next">Next →</button>
      </div>
      <div class="fc-mark">
        <button class="btn ghost" data-fc="again">Học lại (1)</button>
        <button class="btn ghost" data-fc="hard">Còn khó (2)</button>
        <button class="btn" data-fc="known">Đã thuộc (3)</button>
      </div>
      <script type="application/json" class="fc-deck">${JSON.stringify(deck).replace(/</g, "\\u003c")}<\/script>
    </div>`;
  }

  /* ============== Wire daily-lesson ============== */
  APP.wirers["daily-lesson"] = function (opts) {
    document.querySelectorAll("[data-back]").forEach((a) => a.onclick = (e) => { e.preventDefault(); APP.go("daily"); });
    document.querySelectorAll(".tab-btn").forEach((b) => b.onclick = () => APP.go("daily-lesson", { lessonKey: b.dataset.key, tab: b.dataset.tab }));
    wireFlashcard(opts && opts.lessonKey);
  };

  function wireFlashcard(lessonKey) {
    const wrap = document.querySelector(".flashcard-wrap");
    if (!wrap) return;
    const deckNode = wrap.querySelector(".fc-deck");
    if (!deckNode) return;
    const deck = JSON.parse(deckNode.textContent);
    const card = wrap.querySelector(".flashcard");
    const front = card.querySelector(".fc-front");
    const back = card.querySelector(".fc-back");
    const curEl = wrap.querySelector(".fc-cur");
    const knownEl = wrap.querySelector(".fc-known");
    const lsKey = `ielts-daily-${lessonKey}-flashcard`;
    let progress = {};
    try { progress = JSON.parse(localStorage.getItem(lsKey)) || {}; } catch (e) {}
    let idx = 0;
    function paint() {
      const c = deck[idx];
      front.innerHTML = c.front;
      back.innerHTML = c.back;
      back.hidden = true; front.hidden = false;
      curEl.textContent = String(idx + 1);
      knownEl.textContent = String(Object.values(progress).filter((v) => v && v.box >= 3).length);
    }
    function flip() { const f = back.hidden; back.hidden = !f; front.hidden = f; }
    function goto(n) { idx = (n + deck.length) % deck.length; paint(); }
    function mark(box) {
      const c = deck[idx];
      progress[c.id] = { box, lastSeen: Date.now() };
      try { localStorage.setItem(lsKey, JSON.stringify(progress)); } catch (e) {}
      goto(idx + 1);
    }
    wrap.querySelector('[data-fc="prev"]').onclick = () => goto(idx - 1);
    wrap.querySelector('[data-fc="next"]').onclick = () => goto(idx + 1);
    wrap.querySelector('[data-fc="flip"]').onclick = flip;
    wrap.querySelector('[data-fc="again"]').onclick = () => mark(1);
    wrap.querySelector('[data-fc="hard"]').onclick = () => mark(2);
    wrap.querySelector('[data-fc="known"]').onclick = () => mark(3);
    card.addEventListener("click", flip);
    card.focus();
    document.addEventListener("keydown", onKey);
    function onKey(e) {
      if (!document.body.contains(wrap)) { document.removeEventListener("keydown", onKey); return; }
      if (e.target.matches("input,textarea,select")) return;
      if (e.code === "Space") { e.preventDefault(); flip(); }
      else if (e.key === "ArrowLeft") goto(idx - 1);
      else if (e.key === "ArrowRight") goto(idx + 1);
      else if (e.key === "1") mark(1);
      else if (e.key === "2") mark(2);
      else if (e.key === "3") mark(3);
    }
    paint();
  }

  APP.renderers.daily = dailyIndexPage;
  APP.renderers["daily-lesson"] = dailyLessonPage;
})();

/* ================================================================
 * topics.js - Daily Practice · By Topic (cross-lesson)
 *
 * Registers 2 pages: `topics` (index of all topics grouped by skill)
 * and `topic-detail` (aggregates content blocks + questions from
 * all lessons for one topic). Uses APP.loadDailyLesson from daily.js.
 * ================================================================ */
(function bootTopics() {
  const APP = window.APP;
  if (!APP) { console.error("topics.js: APP not initialized"); return; }
  const { esc } = APP.helpers;

  APP.NAV.push(["topics", "Daily · Topic", "🏷️"]);
  APP.TITLE.topics = "Daily Practice · Theo Chủ Đề";
  APP.TITLE["topic-detail"] = "Chủ đề";
  APP.SUB.topics = "Gom xuyên suốt các chủ đề Grammar / Pronunciation / Vocabulary / Speaking";
  APP.SUB["topic-detail"] = "";
  APP.EYEBROW.topics = "Daily · By Topic";
  APP.EYEBROW["topic-detail"] = "Daily · By Topic";

  const SKILL_ORDER = ["grammar", "pronunciation", "vocabulary", "speaking", "listening"];
  const SKILL_LABEL = { grammar: "Grammar", pronunciation: "Pronunciation", vocabulary: "Vocabulary", speaking: "Speaking", listening: "Listening" };

  /* ============== Topics index page ============== */
  function topicsIndexPage() {
    const idx = APP.data.topicsIndex || { topics: {}, order: [] };
    const labels = APP.data.topicLabels || {};
    const topicKeys = idx.order || Object.keys(idx.topics || {});
    if (!topicKeys.length) {
      return `<section class="hero"><span class="tag">Topics</span><h2>Chưa có topics index</h2>
        <p>Chạy <code>npm run build</code> để sinh <code>dist/topics-index.js</code>.</p></section>`;
    }
    // group by skill
    const groups = {};
    topicKeys.forEach((k) => {
      const meta = labels[k] || {};
      const skill = meta.skill || (idx.topics[k] && idx.topics[k].skill) || "misc";
      (groups[skill] = groups[skill] || []).push(k);
    });
    const order = SKILL_ORDER.concat(Object.keys(groups).filter((s) => !SKILL_ORDER.includes(s)));
    const sections = order.map((skill) => {
      const list = groups[skill]; if (!list) return "";
      const cards = list.map((k) => {
        const t = idx.topics[k] || {};
        const meta = labels[k] || {};
        const label = meta.label || t.label || k;
        const refs = t.refs || [];
        const nCore = refs.filter((r) => r.role === "core").length;
        const nReview = refs.filter((r) => r.role === "review").length;
        const nPreview = refs.filter((r) => r.role === "preview").length;
        const lessons = [...new Set(refs.map((r) => r.lessonKey))].sort();
        const needs = meta.needsNotes ? `<span class="need-notes-badge">chưa có notes</span>` : "";
        return `<article class="topic-card searchable" data-topic="${esc(k)}">
          <div class="topic-card-head">
            <h3>${esc(label)}${needs}</h3>
            <span class="topic-skill">${esc(SKILL_LABEL[skill] || skill)}</span>
          </div>
          <p class="muted topic-count">${refs.length} item · ${nCore} core · ${nReview} review · ${nPreview} preview</p>
          <p class="muted topic-lessons">Có mặt trong: ${lessons.length ? lessons.map((l) => `<span class="mini-chip">${esc(l.replace("lesson-", "L"))}</span>`).join("") : "—"}</p>
          <div class="topic-actions"><button class="btn" data-open-topic="${esc(k)}">Mở chủ đề →</button></div>
        </article>`;
      }).join("");
      return `<section class="topic-section">
        <h2>${esc(SKILL_LABEL[skill] || skill)}</h2>
        <div class="topic-grid">${cards}</div>
      </section>`;
    }).join("");
    return `<section class="hero topics-hero"><span class="tag">${topicKeys.length} chủ đề</span>
      <h2>Daily Practice · Theo Chủ Đề</h2>
      <p>Gom mọi content block + câu hỏi thuộc cùng chủ đề, xuyên suốt 16 lessons. Phân biệt <span class="role-badge role-core">core</span> · <span class="role-badge role-review">review</span> · <span class="role-badge role-preview">preview</span> để biết bài chính vs ôn lại vs chuẩn bị.</p>
    </section>${sections}`;
  }

  APP.wirers.topics = function () {
    document.querySelectorAll("[data-open-topic]").forEach((b) => {
      b.onclick = () => APP.go("topic-detail", { topicKey: b.dataset.openTopic, tab: "study" });
    });
    document.querySelectorAll(".topic-card").forEach((c) => c.addEventListener("click", (e) => {
      if (e.target.closest("[data-open-topic]")) return;
      APP.go("topic-detail", { topicKey: c.dataset.topic, tab: "study" });
    }));
  };

  /* ============== Topic detail page ============== */
  async function topicDetailPage(opts) {
    const key = (opts && opts.topicKey) || "";
    const tab = (opts && opts.tab) || "study";
    const idx = APP.data.topicsIndex || { topics: {} };
    const t = idx.topics[key];
    if (!t) return `<pre class="callout warn">Không tìm thấy topic: ${esc(key)}</pre>`;
    const meta = APP.data.topicLabels[key] || {};
    const label = meta.label || t.label || key;
    const refs = t.refs || [];

    // Determine which lessons to load
    const lessonKeys = [...new Set(refs.map((r) => r.lessonKey))].sort();
    let lessons;
    try { lessons = await Promise.all(lessonKeys.map((k) => APP.loadDailyLesson(k))); }
    catch (e) { return `<pre class="callout warn">Không tải được lessons: ${esc(e.message)}</pre>`; }
    const byKey = {};
    lessonKeys.forEach((k, i) => { byKey[k] = lessons[i]; });

    // Gather actual items by topic refs
    const blockItems = [];
    const questionItems = [];
    const audioItems = [];
    refs.forEach((r) => {
      const L = byKey[r.lessonKey]; if (!L) return;
      if (r.kind === "block") {
        const b = (L.contentBlocks || []).find((x) => x.id === r.itemId);
        if (b) blockItems.push({ lessonKey: r.lessonKey, role: r.role, block: b });
      } else if (r.kind === "question") {
        const q = flattenQuestions(L).find((x) => x.id === r.itemId);
        if (q) questionItems.push({ lessonKey: r.lessonKey, role: r.role, question: q });
      } else if (r.kind === "audio") {
        const a = (L.audio || []).find((x) => x.id === r.itemId);
        if (a) audioItems.push({ lessonKey: r.lessonKey, role: r.role, audio: a });
      }
    });

    const tabs = ["study", "exercises", "flashcard", "questions"].map((tv) =>
      `<button class="tab-btn${tv === tab ? " active" : ""}" data-tab="${tv}" data-topic="${esc(key)}">${
        tv === "study" ? "📖 Study" : tv === "exercises" ? "📝 Exercises" : tv === "flashcard" ? "🎴 Flashcard" : "❓ Câu hỏi Speaking"
      }</button>`).join("");

    let body;
    if (tab === "exercises") body = renderTopicExercises(questionItems);
    else if (tab === "flashcard") body = renderTopicFlashcard(audioItems, blockItems, key);
    else if (tab === "questions") body = renderSpeakingQuestions(key);
    else body = renderTopicStudy(blockItems);

    const skillLbl = SKILL_LABEL[meta.skill] || meta.skill || "";
    const needs = meta.needsNotes ? `<span class="need-notes-badge">chưa có notes</span>` : "";
    const head = `<section class="hero topics-hero"><a href="#" class="back-link" data-back-topics>← Danh sách chủ đề</a>
      <span class="tag">${esc(skillLbl)}</span>
      <h2>${esc(label)}${needs}</h2>
      <p class="muted">${refs.length} item · trải qua ${lessonKeys.length} lesson: ${lessonKeys.map((l) => esc(l.replace("lesson-", "L"))).join(", ")}</p>
    </section>
    <div class="tabs">${tabs}</div>`;
    return `<div class="topic-detail" data-topic="${esc(key)}">${head}<div class="tab-panel">${body}</div></div>`;
  }
  function flattenQuestions(L) {
    if (Array.isArray(L.questions)) return L.questions;
    const out = [];
    (L.exerciseGroups || []).forEach((g) => (g.questions || []).forEach((q) => out.push(q)));
    return out;
  }
  function renderTopicStudy(items) {
    if (!items.length) return `<p class="muted">Chủ đề này không có content block trong daily.</p>`;
    return items.map(({ lessonKey, role, block }) => {
      const body = block.html || `<p>${esc(block.text || "")}</p>`;
      const audios = (block.audioRefs || []).map((a) =>
        `<div class="inline-audio"><span class="audio-title">🎧 ${esc(a.script || "audio")}</span>
        <audio controls preload="none" src="${esc(a.localFile || a.url)}"></audio></div>`).join("");
      return `<article class="content-block searchable">
        <div class="block-badges"><span class="lesson-src-badge">${esc(lessonKey.replace("lesson-", "Lesson "))}</span><span class="role-badge role-${role}">${role}</span></div>
        <div class="block-body">${body}</div>
        ${audios ? `<div class="block-audios">${audios}</div>` : ""}
      </article>`;
    }).join("");
  }
  function renderTopicExercises(items) {
    if (!items.length) return `<p class="muted">Chủ đề này không có exercise trong daily.</p>`;
    // Reuse renderQuestion from daily.js via APP.renderers? We copy the minimum shape here.
    return items.map(({ lessonKey, role, question: q }) => {
      const label = `<div class="block-badges"><span class="lesson-src-badge">${esc(lessonKey.replace("lesson-", "Lesson "))}</span><span class="role-badge role-${role}">${role}</span></div>`;
      return `<article class="qcard searchable">${label}<div class="qprompt">${q.promptHtml || esc(q.prompt || "")}</div>${renderAnswerBlock(q)}${q.explanationHtml ? `<details class="explain-details"><summary>Giải thích</summary>${q.explanationHtml}</details>` : ""}</article>`;
    }).join("");
  }
  function renderAnswerBlock(q) {
    switch (q.kind) {
      case "single_choice":
      case "multi_select": {
        const opts = (q.options || []).map((o) => {
          const c = q.correctAnswer && q.correctAnswer.includes(o.id);
          return `<li class="qopt${c ? " correct" : ""}">${o.html || esc(o.text || "")}${c ? "<span class='qopt-tag'>✓ đúng</span>" : ""}</li>`;
        }).join("");
        return opts ? `<ul class="qopts">${opts}</ul>` : "";
      }
      case "fill_blank": {
        if (APP.helpers.renderFillBlankReview) return APP.helpers.renderFillBlankReview(q);
        const blanks = (q.blanks || []).map((b, i) =>
          `<div class="qblank"><span class="qblank-idx">${i + 1}.</span> <code>${esc((b.answers || []).join(" / "))}</code></div>`).join("");
        return blanks;
      }
      case "matching": {
        const rows = (q.pairs || []).map((p) => `<tr><td>${esc(p.left || "")}</td><td>${esc(p.right || "")}</td></tr>`).join("");
        return rows ? `<table class="qmatch"><thead><tr><th>Word</th><th>Meaning</th></tr></thead><tbody>${rows}</tbody></table>` : "";
      }
      default: return "";
    }
  }
  function renderTopicFlashcard(audioItems, blockItems, topicKey) {
    const cards = [];
    audioItems.forEach(({ audio: a, lessonKey }) => {
      if (!a.script) return;
      cards.push({
        id: "au-" + a.id,
        front: `<div class="fc-hint">${esc(lessonKey.replace("lesson-", "L"))}</div>${esc(a.script)}`,
        back: `<div class="inline-audio"><audio controls autoplay preload="none" src="${esc(a.localFile || a.url)}"></audio></div>`,
        kind: "audio"
      });
    });
    if (!cards.length) return `<p class="muted">Chủ đề này chưa có audio+transcript để làm flashcard.</p>`;
    return `<div class="flashcard-wrap" data-topic="${esc(topicKey)}" data-total="${cards.length}">
      <div class="fc-progress">Thẻ <span class="fc-cur">1</span>/${cards.length} · <span class="fc-known">0</span> đã thuộc</div>
      <div class="flashcard" tabindex="0">
        <div class="fc-face fc-front"></div>
        <div class="fc-face fc-back" hidden></div>
      </div>
      <div class="fc-controls">
        <button class="btn ghost" data-fc="prev">← Prev</button>
        <button class="btn" data-fc="flip">Lật thẻ (Space)</button>
        <button class="btn ghost" data-fc="next">Next →</button>
      </div>
      <div class="fc-mark">
        <button class="btn ghost" data-fc="again">Học lại (1)</button>
        <button class="btn ghost" data-fc="hard">Còn khó (2)</button>
        <button class="btn" data-fc="known">Đã thuộc (3)</button>
      </div>
      <script type="application/json" class="fc-deck">${JSON.stringify(cards).replace(/</g, "\\u003c")}<\/script>
    </div>`;
  }
  function renderSpeakingQuestions(key) {
    const meta = APP.data.topicLabels[key] || {};
    if (meta.skill !== "speaking") return `<p class="muted">Tab này chỉ áp dụng cho chủ đề Speaking.</p>`;
    const bank = (APP.data.speakingQuestions || {})[key] || [];
    if (!bank.length) return `<p class="muted">Chưa có câu hỏi trong topics-map.json cho chủ đề này.</p>`;
    return `<section class="speaking-bank">
      <h3>Bộ câu hỏi Final Test · ${esc(meta.label || key)}</h3>
      <ol class="speaking-qlist">${bank.map((q) => `<li>${esc(q.q)}${q.subQuestions ? `<ul>${q.subQuestions.map((s) => `<li>${esc(s)}</li>`).join("")}</ul>` : ""}</li>`).join("")}</ol>
      ${meta.needsNotes ? `<p class="muted"><em>Chủ đề này chưa có notes markdown — cần soạn source/speaking/<code>${esc(key)}</code>.md sau.</em></p>` : ""}
    </section>`;
  }

  APP.wirers["topic-detail"] = function (opts) {
    document.querySelectorAll("[data-back-topics]").forEach((a) => a.onclick = (e) => { e.preventDefault(); APP.go("topics"); });
    document.querySelectorAll(".tab-btn").forEach((b) => b.onclick = () => APP.go("topic-detail", { topicKey: b.dataset.topic, tab: b.dataset.tab }));
    wireTopicFlashcard(opts && opts.topicKey);
  };
  function wireTopicFlashcard(topicKey) {
    const wrap = document.querySelector(".flashcard-wrap[data-topic]");
    if (!wrap) return;
    const deckNode = wrap.querySelector(".fc-deck");
    const deck = JSON.parse(deckNode.textContent);
    const card = wrap.querySelector(".flashcard");
    const front = card.querySelector(".fc-front");
    const back = card.querySelector(".fc-back");
    const curEl = wrap.querySelector(".fc-cur");
    const knownEl = wrap.querySelector(".fc-known");
    const lsKey = `ielts-topic-${topicKey}-flashcard`;
    let progress = {};
    try { progress = JSON.parse(localStorage.getItem(lsKey)) || {}; } catch (e) {}
    let idx = 0;
    function paint() {
      const c = deck[idx];
      front.innerHTML = c.front;
      back.innerHTML = c.back;
      back.hidden = true; front.hidden = false;
      curEl.textContent = String(idx + 1);
      knownEl.textContent = String(Object.values(progress).filter((v) => v && v.box >= 3).length);
    }
    function flip() { const f = back.hidden; back.hidden = !f; front.hidden = f; }
    function goto(n) { idx = (n + deck.length) % deck.length; paint(); }
    function mark(box) {
      const c = deck[idx];
      progress[c.id] = { box, lastSeen: Date.now() };
      try { localStorage.setItem(lsKey, JSON.stringify(progress)); } catch (e) {}
      goto(idx + 1);
    }
    wrap.querySelector('[data-fc="prev"]').onclick = () => goto(idx - 1);
    wrap.querySelector('[data-fc="next"]').onclick = () => goto(idx + 1);
    wrap.querySelector('[data-fc="flip"]').onclick = flip;
    wrap.querySelector('[data-fc="again"]').onclick = () => mark(1);
    wrap.querySelector('[data-fc="hard"]').onclick = () => mark(2);
    wrap.querySelector('[data-fc="known"]').onclick = () => mark(3);
    card.addEventListener("click", flip);
    document.addEventListener("keydown", onKey);
    function onKey(e) {
      if (!document.body.contains(wrap)) { document.removeEventListener("keydown", onKey); return; }
      if (e.target.matches("input,textarea,select")) return;
      if (e.code === "Space") { e.preventDefault(); flip(); }
      else if (e.key === "ArrowLeft") goto(idx - 1);
      else if (e.key === "ArrowRight") goto(idx + 1);
      else if (e.key === "1") mark(1);
      else if (e.key === "2") mark(2);
      else if (e.key === "3") mark(3);
    }
    paint();
  }

  APP.renderers.topics = topicsIndexPage;
  APP.renderers["topic-detail"] = topicDetailPage;
})();

 * practice.js - Final Practice (generator + interactive runner)
 *
 * Registers 3 pages: `practice` (topic-mix form + preset picker +
 * history), `practice-runner` (question-by-question quiz),
 * `practice-result` (score + breakdown + review sai).
 * ================================================================ */
(function bootPractice() {
  const APP = window.APP;
  if (!APP) { console.error("practice.js: APP not initialized"); return; }
  const { esc } = APP.helpers;

  APP.NAV.push(["practice", "Final Practice", "🎯"]);
  APP.TITLE.practice = "Final Practice · Generator";
  APP.TITLE["practice-runner"] = "Đang làm bài";
  APP.TITLE["practice-result"] = "Kết quả";
  APP.SUB.practice = "Chọn preset hoặc tùy chỉnh tỷ lệ topic → shuffle → làm → chấm";
  APP.SUB["practice-runner"] = "";
  APP.SUB["practice-result"] = "";
  APP.EYEBROW.practice = "Final Practice";
  APP.EYEBROW["practice-runner"] = "Final Practice · Runner";
  APP.EYEBROW["practice-result"] = "Final Practice · Result";

  const SESSION_PREFIX = "ielts-practice-session-";
  const HISTORY_KEY = "ielts-practice-history";
  const MAX_HISTORY = 50;

  /* ============== Utility: pool sampling ============== */
  function xrand(seed) {
    let s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffle(arr, rnd) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function samplePool(config) {
    const idx = APP.data.topicsIndex || { topics: {} };
    const total = config.total || 20;
    const seed = config.seed || Math.floor(Math.random() * 1e9);
    const rnd = xrand(seed);
    const allowedTypes = new Set(config.questionTypes || ["fill_blank", "single_choice", "multi_select", "matching"]);
    const allowedRoles = new Set(config.roles || ["core", "review", "preview"]);
    // Note: require r.qkind (excludes untyped/info refs even if their qkind is somehow whitelisted)
    const gather = (topic) => {
      const t = idx.topics[topic];
      if (!t) return [];
      return (t.refs || []).filter((r) =>
        r.kind === "question" &&
        allowedRoles.has(r.role) &&
        r.qkind && r.qkind !== "info" && allowedTypes.has(r.qkind)
      );
    };
    // Pre-filter topics that have no available candidates → auto-redistribute their % to the rest.
    const skipped = [];
    const validMix = [];
    for (const m of (config.mix || [])) {
      const cand = gather(m.topic);
      if (!cand.length) {
        skipped.push({ topic: m.topic, percent: m.percent, reason: idx.topics[m.topic] ? "no matching questions" : "topic not found" });
        continue;
      }
      validMix.push({ topic: m.topic, percent: m.percent, candidates: cand });
    }
    if (!validMix.length) {
      return { questions: [], shortages: [], skipped, seed };
    }
    // Renormalize % over valid topics only, then largest-remainder round to `total`.
    const sumPct = validMix.reduce((s, m) => s + m.percent, 0) || 1;
    const raw = validMix.map((m) => ({ topic: m.topic, exact: (m.percent / sumPct) * total, candidates: m.candidates }));
    const floors = raw.map((r) => ({ ...r, n: Math.floor(r.exact), remain: r.exact - Math.floor(r.exact) }));
    let sum = floors.reduce((s, r) => s + r.n, 0);
    const sortedByRemain = floors.slice().sort((a, b) => b.remain - a.remain);
    let i = 0;
    while (sum < total && i < sortedByRemain.length) { sortedByRemain[i].n += 1; sum++; i++; }
    while (sum > total) { const idx2 = floors.findIndex((f) => f.n > 0); floors[idx2].n--; sum--; }

    const picked = [];
    const shortages = [];
    for (const f of floors) {
      if (f.n <= 0) continue;
      const shuffled = shuffle(f.candidates, rnd);
      const take = shuffled.slice(0, f.n).map((r) => ({ ...r, topic: f.topic }));
      if (take.length < f.n) shortages.push({ topic: f.topic, wanted: f.n, got: take.length });
      picked.push(...take);
    }
    return { questions: shuffle(picked, rnd), shortages, skipped, seed };
  }

  /* ============== Session storage ============== */
  function saveSession(session) {
    try { sessionStorage.setItem(SESSION_PREFIX + session.id, JSON.stringify(session)); } catch (e) {}
  }
  function loadSession(id) {
    try { return JSON.parse(sessionStorage.getItem(SESSION_PREFIX + id)); } catch (e) { return null; }
  }
  function loadHistory() {
    try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch (e) { return []; }
  }
  function pushHistory(entry) {
    const list = loadHistory();
    list.unshift(entry);
    if (list.length > MAX_HISTORY) list.length = MAX_HISTORY;
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); } catch (e) {}
  }
  function uid() { return "s" + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36); }

  /* ============== Page: Practice generator form ============== */
  function practicePage() {
    const presets = APP.data.presets || [];

      return `<li><a href="#" data-open-result="${esc(h.id)}"><b>${pct}%</b> · ${h.score}/${h.total} · ${esc(dt)} · ${esc(h.presetLabel || "custom")}</a></li>`;
    }).join("");

    return `<section class="hero practice-hero"><span class="tag">Generator</span>
      <h2>Final Practice</h2>
      <p>Chọn preset chuẩn từ đề mẫu, hoặc tùy chỉnh tỷ lệ % topic; bấm Generate để sinh phiên quiz shuffle. Chấm điểm client-side.</p>
    </section>
    <section class="practice-page practice-form" id="practiceForm">
      <div class="form-row">
        <label>Preset
          <select id="presetSel">
            <option value="">— Custom —</option>
            ${presetOpts}
          </select>
        </label>
        <label>Tổng số câu
          <input type="number" id="totalInput" min="5" max="200" value="30">
        </label>
        <label>Random seed (optional)
          <input type="text" id="seedInput" placeholder="để trống = ngẫu nhiên">
        </label>
      </div>
      <div class="form-row">
        <label>Loại câu:
          <span class="qtypes">
            <label><input type="checkbox" name="qtype" value="fill_blank" checked> fill_blank</label>
            <label><input type="checkbox" name="qtype" value="single_choice" checked> single_choice</label>
            <label><input type="checkbox" name="qtype" value="multi_select" checked> multi_select</label>
            <label><input type="checkbox" name="qtype" value="matching" checked> matching</label>
          </span>
        </label>
        <label>Vai trò:
          <span class="qtypes">
            <label><input type="checkbox" name="qrole" value="core" checked> core</label>
            <label><input type="checkbox" name="qrole" value="review" checked> review</label>
            <label><input type="checkbox" name="qrole" value="preview" checked> preview</label>
          </span>
        </label>
      </div>

      <h3>Mix topic (%)</h3>
      <table class="mix-table">
        <thead><tr><th>Topic</th><th style="width:100px">%</th><th style="width:80px">Câu</th><th style="width:60px"></th></tr></thead>
        <tbody id="mixBody"></tbody>
      </table>
      <div class="mix-add">
        <select id="addTopicSel"><option value="">+ Thêm topic…</option>${topicOptions}</select>
        <button class="btn ghost" id="addTopicBtn" type="button">Thêm</button>
        <span class="mix-total muted">Tổng %: <b id="mixTotalPct">0</b> · Câu: <b id="mixTotalN">0</b></span>
      </div>

      <div class="form-actions">
        <button class="btn" id="generateBtn" type="button">🎲 Generate</button>
        <button class="btn ghost" id="resetMixBtn" type="button">Reset mix</button>

    </section>

    ${history ? `<section class="practice-page practice-history">
      <h3>5 phiên gần nhất</h3>

    </section>` : ""}`;
  }

  APP.wirers.practice = function () {
    const presetSel = document.getElementById("presetSel");
    const totalInp = document.getElementById("totalInput");
    const seedInp = document.getElementById("seedInput");
    const mixBody = document.getElementById("mixBody");
    const addSel = document.getElementById("addTopicSel");
    const addBtn = document.getElementById("addTopicBtn");
    const totalPctEl = document.getElementById("mixTotalPct");
    const totalNEl = document.getElementById("mixTotalN");
    const genBtn = document.getElementById("generateBtn");
    const resetBtn = document.getElementById("resetMixBtn");
    const genWarn = document.getElementById("genWarn");
    const labels = APP.data.topicLabels || {};
    const presets = APP.data.presets || [];

    function addRow(topic, percent) {
      if ([...mixBody.querySelectorAll("tr")].some((tr) => tr.dataset.topic === topic)) return;
      const l = (labels[topic] && labels[topic].label) || topic;
      const tr = document.createElement("tr");
      tr.dataset.topic = topic;
      tr.innerHTML = `<td>${esc(l)}</td><td><input type="number" min="0" max="100" step="1" value="${percent}" class="mix-pct"></td><td class="mix-n">—</td><td><button class="btn ghost mix-del" type="button">×</button></td>`;
      mixBody.appendChild(tr);
      tr.querySelector(".mix-pct").addEventListener("input", updateTotals);
      tr.querySelector(".mix-del").onclick = () => { tr.remove(); updateTotals(); };
    }
    function updateTotals() {
      const total = parseInt(totalInp.value, 10) || 0;
      let sumPct = 0;
      mixBody.querySelectorAll("tr").forEach((tr) => {
        const pct = parseFloat(tr.querySelector(".mix-pct").value) || 0;
        sumPct += pct;
        tr.querySelector(".mix-n").textContent = Math.round((pct / 100) * total);
      });
      totalPctEl.textContent = sumPct.toFixed(0);
      totalNEl.textContent = String(total);
      totalPctEl.style.color = Math.abs(sumPct - 100) > 0.5 ? "#dc2626" : "#059669";
    }
    function applyPreset(id) {
      const p = presets.find((x) => x.id === id);
      mixBody.innerHTML = "";
      if (!p) { updateTotals(); return; }
      totalInp.value = String(p.totalQuestions || 30);
      (p.mix || []).forEach((m) => addRow(m.topic, m.percent));
      // set qtype checkboxes
      const types = new Set(p.questionTypes || ["fill_blank", "single_choice", "multi_select", "matching"]);
      document.querySelectorAll('input[name="qtype"]').forEach((cb) => cb.checked = types.has(cb.value));
      updateTotals();
    }

    presetSel.onchange = () => applyPreset(presetSel.value);
    totalInp.oninput = updateTotals;
    addBtn.onclick = () => { if (addSel.value) { addRow(addSel.value, 10); updateTotals(); addSel.value = ""; } };
    resetBtn.onclick = () => { mixBody.innerHTML = ""; presetSel.value = ""; updateTotals(); };

    genBtn.onclick = () => {
      const mix = [...mixBody.querySelectorAll("tr")].map((tr) => ({
        topic: tr.dataset.topic,
        percent: parseFloat(tr.querySelector(".mix-pct").value) || 0
      })).filter((m) => m.percent > 0);
      if (!mix.length) { genWarn.innerHTML = `<div class="callout warn">Cần chọn ít nhất 1 topic có % > 0.</div>`; return; }
      const sumPct = mix.reduce((s, m) => s + m.percent, 0);
      if (Math.abs(sumPct - 100) > 0.5) { genWarn.innerHTML = `<div class="callout warn">Tổng % phải bằng 100 (hiện: ${sumPct}).</div>`; return; }
      const total = parseInt(totalInp.value, 10) || 30;
      const seed = seedInp.value.trim() ? parseInt(seedInp.value.trim(), 10) || hashCode(seedInp.value.trim()) : Math.floor(Math.random() * 1e9);
      const types = [...document.querySelectorAll('input[name="qtype"]:checked')].map((cb) => cb.value);
      const roles = [...document.querySelectorAll('input[name="qrole"]:checked')].map((cb) => cb.value);
      const config = { mix, total, seed, questionTypes: types, roles };
      const sampled = samplePool(config);
      if (!sampled.questions.length) { genWarn.innerHTML = `<div class="callout warn">Không có câu nào match filter. Nới lỏng loại câu / vai trò / topic.</div>`; return; }
      const skippedMsg = (sampled.skipped && sampled.skipped.length)
        ? `<div class="callout tip"><b>Đã bỏ qua topic không có câu:</b> ${sampled.skipped.map((s) => `${esc(s.topic)} (${s.percent}%)`).join(", ")}. Đã phân bổ lại % cho các topic còn lại để đạt đủ ${config.total} câu.</div>`
        : "";
      const shortMsg = sampled.shortages.length
        ? `<div class="callout tip"><b>Một số topic không đủ câu:</b> ${sampled.shortages.map((s) => `${esc(s.topic)} (${s.got}/${s.wanted})`).join(", ")}. Vẫn tiến hành.</div>`
        : "";
      const presetId = presetSel.value;
      const presetLabel = presetId ? (presets.find((p) => p.id === presetId) || {}).label : "custom";
      const sessionId = uid();
      const session = {
        id: sessionId,
        config,
        presetId,
        presetLabel,
        questions: sampled.questions,
        answers: {},
        startedAt: Date.now()
      };
      saveSession(session);
      genWarn.innerHTML = skippedMsg + shortMsg;
      setTimeout(() => APP.go("practice-runner", { sessionId }), 200);
    };

    document.querySelectorAll("[data-open-result]").forEach((a) => a.onclick = (e) => {
      e.preventDefault(); APP.go("practice-result", { historyId: a.dataset.openResult });
    });
    updateTotals();
  };
  function hashCode(s) { let h = 0; for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0; return h >>> 0; }

  /* ============== Page: Practice runner ============== */
  async function practiceRunnerPage(opts) {
    const sid = opts && opts.sessionId;
    if (!sid) return `<pre class="callout warn">Không có sessionId.</pre>`;
    const session = loadSession(sid);
    if (!session) return `<pre class="callout warn">Phiên đã hết hạn. <a href="#" data-go-practice>Về Generator</a></pre>`;
    // Load all needed lessons
    const lessonKeys = [...new Set(session.questions.map((q) => q.lessonKey))];
    let lessons;
    try { lessons = await Promise.all(lessonKeys.map((k) => APP.loadDailyLesson(k))); }
    catch (e) { return `<pre class="callout warn">Không tải được lessons: ${esc(e.message)}</pre>`; }
    const byKey = {}; lessonKeys.forEach((k, i) => { byKey[k] = lessons[i]; });
    // Hydrate questions
    const hydrated = session.questions.map((ref) => {
      const L = byKey[ref.lessonKey];
      const all = flattenQ(L);
      const q = all.find((x) => x.id === ref.itemId);
      return q ? { ref, q } : null;
    }).filter(Boolean);
    if (!hydrated.length) return `<pre class="callout warn">Không hydrate được câu hỏi nào.</pre>`;

    return `<section class="practice-page practice-runner" data-sid="${esc(sid)}">
      <div class="runner-head">
        <span class="tag">Runner</span>
        <b>${hydrated.length} câu</b>
        <span class="muted"> · preset: ${esc(session.presetLabel || "custom")} · seed: ${session.config.seed}</span>
        <button class="btn ghost runner-exit" type="button" data-exit>← Thoát</button>
      </div>
      <div class="runner-progress-bar"><i id="runnerBar"></i></div>
      <div class="runner-body">
        ${hydrated.map((h, i) => renderRunnerQuestion(h.q, h.ref, i, hydrated.length, session.answers[i])).join("")}
      </div>
      <div class="runner-actions">
        <button class="btn" id="runnerSubmit" type="button">✅ Submit &amp; Chấm</button>
      </div>
      <script type="application/json" id="runnerHydrated">${JSON.stringify(hydrated).replace(/</g, "\\u003c")}<\/script>
    </section>`;
  }
  function flattenQ(L) {
    if (Array.isArray(L.questions)) return L.questions;
    const out = []; (L.exerciseGroups || []).forEach((g) => (g.questions || []).forEach((q) => out.push(q))); return out;
  }

  function renderRunnerQuestion(q, ref, i, total, prevAnswer) {
    const header = `<div class="rq-head"><b>Câu ${i + 1}/${total}</b> · <span class="muted">${esc(ref.topic || "?")}</span> · <span class="qtype-badge">${esc(q.kind || "?")}</span></div>`;
    const prompt = `<div class="qprompt">${q.promptHtml || esc(q.prompt || "")}</div>`;
    const audios = (q.audioRefs || []).map((a) =>
      `<div class="inline-audio"><audio controls preload="none" src="${esc(a.localFile || a.url)}"></audio></div>`).join("");
    const imgs = (q.imageRefs || []).map((r) => `<figure class="ex-img"><img loading="lazy" src="${esc(r.localFile || r.url)}" alt=""></figure>`).join("");
    let input = "";
    const namePrefix = `rq-${i}-`;
    if (q.kind === "single_choice") {
      input = `<div class="rq-opts">` + (q.options || []).map((o) =>
        `<label class="rq-opt"><input type="radio" name="${namePrefix}v" value="${esc(o.id)}"${prevAnswer === o.id ? " checked" : ""}> ${o.html || esc(o.text || "")}</label>`
      ).join("") + `</div>`;
    } else if (q.kind === "multi_select") {
      const set = new Set(Array.isArray(prevAnswer) ? prevAnswer : []);
      input = `<div class="rq-opts">` + (q.options || []).map((o) =>
        `<label class="rq-opt"><input type="checkbox" name="${namePrefix}v" value="${esc(o.id)}"${set.has(o.id) ? " checked" : ""}> ${o.html || esc(o.text || "")}</label>`
      ).join("") + `</div>`;
    } else if (q.kind === "fill_blank") {
      const blanks = (q.blanks || [{}]);
      const prev = Array.isArray(prevAnswer) ? prevAnswer : [];
      if (q.bodyHtml) {
        // Inline runner: replace each blank-slot with a live <input>. Aria-labels use blank index.
        const filled = String(q.bodyHtml).replace(/<span class="blank-slot" data-blank="(\d+)"><\/span>/g,
          (_m, n) => {
            const k = parseInt(n, 10);
            const v = prev[k] || "";
            return `<input type="text" class="blank-input" data-blank="${n}" name="${namePrefix}b${k}" value="${esc(v)}" aria-label="Ô ${k + 1}">`;
          });
        input = `<div class="rq-fill-body">${filled}</div>`;
      } else {
        input = `<div class="rq-blanks">` + blanks.map((b, k) =>
          `<label class="rq-blank">Ô ${k + 1}: <input type="text" name="${namePrefix}b${k}" value="${esc(prev[k] || "")}" placeholder="gõ đáp án"></label>`).join("") + `</div>`;
      }
    } else if (q.kind === "matching") {
      const pairs = q.pairs || [];
      const rightOptions = pairs.map((p, k) => ({ key: p.rightId || String(k), label: p.right || "" }));
      const prev = Array.isArray(prevAnswer) ? prevAnswer : [];
      input = `<table class="rq-match"><tbody>` + pairs.map((p, k) => {
        const opts = rightOptions.map((r) => `<option value="${esc(r.key)}"${prev[k] === r.key ? " selected" : ""}>${esc(r.label)}</option>`).join("");
        return `<tr><td>${esc(p.left || "")}</td><td><select name="${namePrefix}m${k}"><option value="">-- chọn --</option>${opts}</select></td></tr>`;
      }).join("") + `</tbody></table>`;
    } else {
      input = `<div class="muted"><em>Loại câu ${esc(q.kind)} không chấm tự động — bỏ qua.</em></div>`;
    }
    return `<article class="rq" data-i="${i}" data-kind="${esc(q.kind)}">${header}${prompt}${imgs}${audios ? `<div class="block-audios">${audios}</div>` : ""}${input}</article>`;
  }

  APP.wirers["practice-runner"] = function (opts) {
    const sid = opts && opts.sessionId;
    const session = loadSession(sid);
    if (!session) return;
    const hydratedNode = document.getElementById("runnerHydrated");
    const hydrated = JSON.parse(hydratedNode.textContent);
    const bar = document.getElementById("runnerBar");
    function updateBar() {
      const answered = Object.keys(session.answers).length;
      bar.style.width = Math.round((answered / hydrated.length) * 100) + "%";
    }
    document.querySelectorAll(".rq").forEach((art) => {
      const i = +art.dataset.i;
      const kind = art.dataset.kind;
      art.querySelectorAll("input,select,textarea").forEach((inp) => {
        inp.oninput = inp.onchange = () => {
          session.answers[i] = collectAnswer(art, kind);
          saveSession(session);
          updateBar();
        };
      });
    });
    document.querySelector("[data-exit]").onclick = () => APP.go("practice");
    document.getElementById("runnerSubmit").onclick = () => {
      const graded = gradeSession(session, hydrated);
      session.result = graded;
      session.submittedAt = Date.now();
      saveSession(session);
      pushHistory({
        id: session.id,
        presetId: session.presetId,
        presetLabel: session.presetLabel,
        config: session.config,
        score: graded.score,
        total: graded.total,
        breakdown: graded.breakdown,
        detail: (graded.detail || []).map((d) => ({
          i: d.i,
          ok: d.ok,
          topic: d.topic,
          ans: d.ans,
          q: {
            id: d.q.id,
            kind: d.q.kind,
            prompt: d.q.prompt,
            promptHtml: d.q.promptHtml,
            correctAnswer: d.q.correctAnswer,
            blanks: (d.q.blanks || []).map((b) => ({ answers: b.answers })),
            pairs: d.q.pairs,
            explanationHtml: d.q.explanationHtml
          }
        })),
        answers: session.answers,
        questions: session.questions,
        submittedAt: session.submittedAt
      });
      APP.go("practice-result", { sessionId: session.id });
    };
    updateBar();
  };
  function collectAnswer(art, kind) {
    if (kind === "single_choice") { const c = art.querySelector('input[type="radio"]:checked'); return c ? c.value : null; }
    if (kind === "multi_select") { return [...art.querySelectorAll('input[type="checkbox"]:checked')].map((c) => c.value); }
    if (kind === "fill_blank") {
      // Prefer inline slots (data-blank attribute) sorted by numeric index; fall back to sequential inputs.
      const slots = [...art.querySelectorAll('.blank-input[data-blank]')];
      if (slots.length) {
        const arr = [];
        for (const s of slots) {
          const idx = parseInt(s.dataset.blank, 10);
          if (!Number.isFinite(idx)) continue;
          arr[idx] = s.value.trim();
        }
        for (let i = 0; i < arr.length; i++) if (arr[i] == null) arr[i] = "";
        return arr;
      }
      return [...art.querySelectorAll('input[type="text"]')].map((i) => i.value.trim());
    }
    if (kind === "matching") { return [...art.querySelectorAll("select")].map((s) => s.value); }
    return null;
  }

  function normStr(s) { return String(s == null ? "" : s).toLowerCase().trim().replace(/\s+/g, " "); }
  function gradeSession(session, hydrated) {
    let score = 0;
    const total = hydrated.length;
    const breakdown = {};
    const detail = [];
    hydrated.forEach((h, i) => {
      const q = h.q; const ans = session.answers[i]; const topic = h.ref.topic;
      const b = breakdown[topic] = breakdown[topic] || { correct: 0, total: 0 };
      b.total++;
      let ok = false;
      if (q.kind === "single_choice") {
        const correct = (q.correctAnswer || [])[0];
        ok = ans && String(ans) === String(correct);
      } else if (q.kind === "multi_select") {
        const c = new Set((q.correctAnswer || []).map(String));
        const a = new Set((ans || []).map(String));
        ok = c.size === a.size && [...c].every((x) => a.has(x));
      } else if (q.kind === "fill_blank") {
        const blanks = q.blanks || [];
        ok = blanks.length > 0 && blanks.every((b, k) => {
          const user = normStr((ans || [])[k]);
          const accepted = (b.answers || []).map(normStr);
          return accepted.length ? accepted.includes(user) : false;
        });
      } else if (q.kind === "matching") {
        const pairs = q.pairs || [];
        ok = pairs.length > 0 && pairs.every((p, k) => String((ans || [])[k]) === String(p.rightId || k));
      }
      if (ok) { score++; b.correct++; }
      detail.push({ i, q, ans, ok, topic });
    });
    return { score, total, breakdown, detail };
  }

  /* ============== Page: Practice result ============== */
  function practiceResultPage(opts) {
    const sid = opts && (opts.sessionId || opts.historyId);
    let session = sid ? loadSession(sid) : null;
    if (!session && opts && opts.historyId) {
      const h = loadHistory().find((x) => x.id === opts.historyId);
      if (h) session = { id: h.id, config: h.config, questions: h.questions, answers: h.answers, presetLabel: h.presetLabel, submittedAt: h.submittedAt, result: { score: h.score, total: h.total, breakdown: h.breakdown, detail: h.detail || [] } };
    }
    if (!session || !session.result) return `<pre class="callout warn">Không có kết quả cho phiên này.</pre>`;
    const r = session.result;
    const pct = r.total ? Math.round((r.score / r.total) * 100) : 0;
    const breakdown = Object.entries(r.breakdown || {}).map(([t, b]) => {
      const p = b.total ? Math.round((b.correct / b.total) * 100) : 0;
      const label = (APP.data.topicLabels[t] && APP.data.topicLabels[t].label) || t;
      return `<div class="result-row"><div class="result-label">${esc(label)}</div>
        <div class="result-bar"><i style="width:${p}%"></i></div>
        <div class="result-num">${b.correct}/${b.total} · ${p}%</div></div>`;
    }).join("");
    const wrongList = (r.detail || []).filter((d) => !d.ok).map((d) => {
      return `<article class="qcard">
        <div class="block-badges"><span class="topic-badge">${esc(d.topic)}</span><span class="q-bad">× sai</span></div>
        <div class="qprompt">${d.q.promptHtml || esc(d.q.prompt || "")}</div>
        <div class="rq-user-answer"><b>Bạn trả lời:</b> <code>${esc(JSON.stringify(d.ans))}</code></div>
        <div class="rq-correct-answer"><b>Đáp án đúng:</b> <code>${esc(JSON.stringify(d.q.correctAnswer || (d.q.blanks || []).map((b) => b.answers)))}</code></div>
        ${d.q.explanationHtml ? `<details class="explain-details" open><summary>Giải thích</summary>${d.q.explanationHtml}</details>` : ""}
      </article>`;
    }).join("");
    return `<section class="hero result-hero"><span class="tag">Kết quả</span>
      <h2>${pct}% · ${r.score}/${r.total} câu đúng</h2>
      <p class="muted">Preset: ${esc(session.presetLabel || "custom")} · Submit: ${esc(new Date(session.submittedAt || Date.now()).toLocaleString())}</p>
    </section>
    <section class="practice-page result-breakdown">
      <h3>Breakdown theo topic</h3>
      ${breakdown || "<p class='muted'>Không có breakdown.</p>"}
    </section>
    ${wrongList ? `<section class="practice-page result-wrong">
      <h3>Câu sai (${(r.detail || []).filter((d) => !d.ok).length})</h3>
      ${wrongList}
    </section>` : `<section class="practice-page"><div class="callout tip"><b>Hoàn hảo! 🎉</b> Không có câu sai.</div></section>`}
    <div class="result-actions">
      <button class="btn ghost" data-back-practice type="button">← Về Generator</button>
      <button class="btn" data-retry type="button" data-sid="${esc(session.id)}">🔁 Làm lại session này (cùng seed)</button>
    </div>`;
  }
  APP.wirers["practice-result"] = function () {
    document.querySelectorAll("[data-back-practice]").forEach((b) => b.onclick = () => APP.go("practice"));
    document.querySelectorAll("[data-retry]").forEach((b) => b.onclick = () => {
      const sid = b.dataset.sid;
      const old = loadSession(sid); if (!old) return;
      const sampled = samplePool(old.config);
      const newId = uid();
      const newSession = { id: newId, config: old.config, presetId: old.presetId, presetLabel: old.presetLabel, questions: sampled.questions, answers: {}, startedAt: Date.now() };
      saveSession(newSession);
      APP.go("practice-runner", { sessionId: newId });
    });
    document.querySelectorAll("[data-go-practice]").forEach((a) => a.onclick = (e) => { e.preventDefault(); APP.go("practice"); });
  };

  APP.renderers.practice = practicePage;
  APP.renderers["practice-runner"] = practiceRunnerPage;
  APP.renderers["practice-result"] = practiceResultPage;
})();


/* ---- module boundary ---- */


/* ---- bootstrap ---- */
if (window.APP && window.APP.init) window.APP.init();

    </script>
  </body>
