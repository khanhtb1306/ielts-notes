<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Pre-IELTS Notes · Khánh</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
        background: #f6f7fb;
        color: #1b2333;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(680px, 100%);
        border: 1px solid #e6e8ef;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 12px 40px rgba(16, 24, 40, 0.1);
        padding: 28px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: clamp(28px, 5vw, 44px);
        letter-spacing: -0.04em;
      }
      p {
        margin: 0 0 18px;
        color: #6b7385;
        line-height: 1.6;
      }
      a,
      code {
        color: #2563eb;
      }
      a.button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 18px;
        border-radius: 999px;
        background: #2563eb;
        color: #fff;
        text-decoration: none;
        font-weight: 700;
      }
      .hint {
        margin-top: 18px;
        font-size: 14px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          background: #0f172a;
          color: #f8fafc;
        }
        main {
          background: #111827;
          border-color: #263244;
        }
        p {
          color: #cbd5e1;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Pre-IELTS Notes</h1>
      <p>
        App mới nằm trong <code>next/</code>. React/Vite không chạy trực tiếp qua
        <code>file://</code>; hãy mở bằng local server.
      </p>
      <p>
        <a class="button" href="http://127.0.0.1:5174/#/final">Mở Final Review</a>
      </p>
      <p class="hint">
        Dev: <code>cd next && npm run dev</code> rồi mở
        <code>http://127.0.0.1:5173/#/final</code>. Preview build: chạy
        <code>cd next && npm run preview</code> rồi mở link ở trên.
      </p>
    </main>
    <script>
      const target = "http://127.0.0.1:5174/#/final"
      fetch("http://127.0.0.1:5174/", { method: "HEAD", mode: "no-cors" })
        .then(() => window.location.replace(target))
        .catch(() => {})
    </script>
  </body>
</html>
